 {t:"p",v:"הזמנה מחו״ל מגיעה במטוס לחברת הפצה שיש לה מרכזים בארץ, ומשם צריכה להגיע ללקוח. אפשר להביא לנקודת חלוקה (פשוט — מסלולים ונקודות קבועות) או להביא ללקוח עצמו, שמפוזר ולעיתים קשה להגיע אליו. <b>בעיית המייל האחרון:</b> איך להביא מהנקודה האחרונה של הספק אל הלקוח."},

 {t:"h",v:"דפוס תנועה יומי ויר״מ"},
 {t:"p",v:"לכל כביש מאפיינים משלו. מדידה ביציאה מאיילון (קיבולת מתוכננת 2,000): בלילה כמות נמוכה; מ-5:00 עלייה עם שיא ב-7:00; ירידה 8:00–13:00; עלייה 13:00–19:00 עם שיא ב-16:00–17:00. <b>בכל כביש צריך להבין מדוע יש עומסים — הסיבה משתנה לפי מאפייניו.</b>"},
 {t:"p",v:"<b>יחידת רכב משווה (יר״מ / PCU):</b> מגדירים רכב פרטי כיחידת הבסיס, ולכל כלי רכב אחר ערך יחסי. הקיבולת מוגדרת כ<b>יר״מ לנתיב אחד לשעה</b>."},
 {t:"tbl",head:["סוג רכב","מישור","הר","צומת"],rows:[
  ["פרטי","1","1","1"],["משא","1.7","8","2"],["אוטובוס","1.5","5","1.8"],["אופנוע","—","—","0.8"]
 ]},

 {t:"h",v:"זרימת תנועה — המודל"},
 {t:"p",v:"מודל המחבר שלושה מאפיינים: <b>מהירות (S)</b> בקמ״ש, <b>זרימה/נפח (q)</b> ברכבים לשעה, ו<b>צפיפות (D)</b> ברכבים לק״מ. <b>קיבולת (C)</b> = רכבים בנתיב אחד בשעה; קיבולת × מספר נתיבים = זרימת הכביש כולו."},
 {t:"box",v:"<b>משוואה 1:</b> q = S × D &nbsp;·&nbsp; <b>משוואה 2:</b> S = Sf · (1 − D/Dj) &nbsp;·&nbsp; <b>משוואה 3:</b> q = Sf · (D − D²/Dj) &nbsp;·&nbsp; <b>משוואה 4:</b> q = Dj · (S − S²/Sf)"},
 {t:"ul",v:[
  "<b>Sf (Speed Free)</b> — המהירות החופשית: המהירות הגבוהה ביותר כשאין רכבים על הכביש (צפיפות 0).",
  "<b>Dj</b> — צפיפות הפקק: כמות הרכבים שגורמת לכך שלא ניתן לנסוע כלל (מהירות 0).",
  "ככל שכמות הרכבים עולה — המהירות יורדת, עד שמגיעה ל-0 בצפיפות Dj.",
  "אם אין רכבים — אין זרימה (q=0). מוסיפים רכבים ← הזרימה עולה עד ל<b>זרימה מקסימלית</b>. מעבר לכך כל תוספת רכב מגדילה את העומס, המהירות יורדת, ולכן הזרימה יורדת — עד ל-Dj שבו שוב אין זרימה."
 ]},
 {t:"p",v:"המודל נקרא <b>מודל גרינשילדס</b>: הקשר מהירות–צפיפות הוא <b>ליניארי יורד</b>, ולכן הקשר זרימה–צפיפות הוא <b>פרבולי</b>."},
 {t:"box",v:"<b>הזרימה המקסימלית (qmax)</b> מתקבלת ב-<b>Dq = Dj/2</b> וב-<b>Sq = Sf/2</b> (האמצע)."},
 {t:"ex",v:"<b>שאלה לדוגמה (מהשיעור):</b> נתון Sf=96 ו-Dj=88. qmax מתקבל ב-D=88/2=44 וב-S=96/2=48 ← qmax = 48×44 = 2,112.<br>אם נתון q=1000 — מציבים במשוואה 3, מקבלים <b>משוואה ריבועית</b> (מעבירים אגפים ומשווים ל-0, נוסחת השורשים) ומקבלים <b>שני</b> פתרונות של הפרבולה, ואז מוצאים את המהירויות במשוואה 1."},
 {t:"box",v:"<b>שאלה אמריקאית שהמרצה ציין:</b> אם הזרימה המקסימלית 1000 והזרימה הנוכחית 500 — <b>לכל ערך זרימה (למעט זרימת השיא) יש שתי צפיפויות ושתי מהירויות מתאימות</b>. אם אין אף רכב על הכביש — המהירות שווה ל-Sf."}
]},

{u:2,title:"מידע מרחבי",lessons:"שיעורים 3–5 · 12.5 · 19.5 · 26.5",blocks:[
 {t:"h",v:"בעיית הגשרים של קניגסברג"},
 {t:"p",v:"הבעיה הראשונה שנפתרה בתורת הגרפים. בעיר קניגסברג עבר נהר ובה 7 גשרים; התושבים חיפשו מסלול מעגלי שעובר בכל גשר פעם אחת בלבד ולא מצאו. <b>אויילר</b> (מתמטיקאי, 1735) הוכיח שאי אפשר, והראה מהם התנאים שכן מאפשרים מסלול כזה."},
 {t:"p",v:"אויילר תרגם את המציאות לגרף: כל יבשת = <b>קודקוד</b>, כל גשר = <b>קשת</b>. <b>דרגה</b> = מספר הקשתות המחוברות לקודקוד."},
 {t:"box",v:"<b>התנאי למסלול אוילר</b> (מעבר בכל קשת בדיוק פעם אחת) בגרף קשיר:<br>• <b>כל הקודקודים בדרגה זוגית</b> ← קיים מסלול <b>מעגלי</b> (מתחילים ומסיימים באותה נקודה).<br>• <b>בדיוק 2 קודקודים בדרגה אי-זוגית</b> ← מתחילים באחד ומסיימים בשני.<br>בקניגסברג היו קודקודים בדרגה 3, 3 ו-5 ← לא מתקיים."},
 {t:"ex",v:"<b>ציור הבית הקלאסי</b> (ריבוע עם ״איקס״ וגג משולש): שתי הפינות התחתונות בדרגה 3 (אי-זוגית), השאר זוגיות ← יש בדיוק 2 אי-זוגיים ← <b>אפשר</b> לצייר בלי להרים עיפרון, אך <b>חייבים להתחיל באחת הפינות התחתונות ולסיים בשנייה</b>. אם מתחילים בראש הגג (זוגי) — לא ניתן להשלים."},

 {t:"h",v:"מערכות מידע גאוגרפיות (GIS)"},
 {t:"p",v:"<b>GIS = Geographic Information System</b> (ממ״ג). מערכת ממוחשבת לקליטה, אחסון, עדכון, תפעול, תשאול והצגה של נתונים גאוגרפיים, המאפשרת גם <b>ניתוח</b> ליצירת מידע חדש. היתרון הבולט: הנתונים נשמרים עם ייחוס גאוגרפי וניתן להציגם על מפות ולא רק בטבלאות."},
 {t:"p",v:"<b>שימושים:</b> תכנון רשתות מים, חשמל, תקשורת, מבנים ודיור; ניהול נכסים; מציאת מסלול קצר לכוחות כיבוי אש."},
 {t:"box",v:"<b>5 מרכיבי GIS:</b> נתונים · חומרה · תוכנה · פרוצדורות · כח אדם.<br><b>אל תתבלבל עם שלבי התהליך:</b> איסוף ← אחסון ← תשאול ← ניתוח ← תצוגה ← פלט."},
 {t:"ul",v:[
  "<b>נתונים</b> — מתוכניות שתוכננו, איסוף מהשטח (כמו Waze שבנה מפות מנתוני נהגים), או סריקת תצלומי אוויר/לוויין.",
  "<b>חומרה</b> — מחשבים ורשתות תקשורת. <b>תוכנה</b> — מה שרץ עליהם.",
  "<b>פרוצדורות</b> — תוכניות קטנות שכותבים בתוך המערכת ומוסיפות פונקציות שאינן מובנות בה.",
  "<b>כח אדם</b> — מי שמשתמש, מנתח, מוציא שאילתות ומחליט לאן להפנות משאבים."
 ]},
 {t:"p",v:"<b>ציוני דרך:</b> יישומים ראשונים בשנות ה-50–60 · 1963 CGIS (קנדה) · <b>1969 הקמת ESRI</b> (חברת ה-GIS הגדולה בעולם) · 1972 LandSat 1 · 1981 ArcInfo · <b>1985 GPS מבצעי</b> · <b>2005 Google Maps</b> · <b>2006 Google Earth</b>."},
 {t:"p",v:"<b>שכבות (Layers):</b> לוקחים את העולם האמיתי ומחלקים אותו לשכבות שכל אחת עוסקת בתחום אחר (לקוחות, צמחייה, מבנים, כבישים). המערכת עונה על שאלות <b>ע״י השוואת שכבות שונות באותו מרחב</b>."},

 {t:"h",v:"אחסון נתונים — ראסטר מול וקטור"},
 {t:"tbl",head:["","ראסטר (Raster)","וקטור (Vector)"],rows:[
  ["עיקרון","תמונה המפורקת לתאים (פיקסלים)","ייצוג מספרי בקואורדינטות"],
  ["רזולוציה","ככל שהתאים קטנים — פירוט גבוה יותר","דינמי; ניתן לשנות תצוגה בכל קנה מידה"],
  ["מתאים ל","תצלומי אוויר, תצלומי לוויין, מפות סרוקות","כבישים, מבנים, אנטנות, גבולות"],
  ["מגבלה","התמונה קבועה — קשה לשנות פירוט או להוסיף נתונים","—"],
  ["יתרון","מהיר לקליטה (סריקה)","ניתן לבצע חישובים ומניפולציות"]
 ]},
 {t:"p",v:"<b>3 הישויות הבסיסיות במידע וקטורי:</b>"},
 {t:"ul",v:[
  "<b>נקודות</b> — מידע נקודתי: עמודי תאורה, אנטנות, בארות, חנויות.",
  "<b>קווים</b> — סדרת נקודות מחוברות לפי סדר: כבישים, נהרות, פסי רכבת, צינורות, קווי חשמל.",
  "<b>שטחים / פוליגונים</b> — סדרת קווים הסוגרת שטח: מבנים, מגרשים, ייעודי קרקע, יערות."
 ]},
 {t:"h",v:"3 מרכיבי המידע הגאוגרפי"},
 {t:"ul",v:[
  "<b>גיאומטריה</b> — המיקום והצורה במרחב (מאיפה מתחיל הכביש ואיפה נגמר).",
  "<b>מאפיינים (Attributes)</b> — נתונים בטבלה: שם רחוב, מספר נתיבים, אוכלוסייה במחוז, עומק באר.",
  "<b>חוקים / התנהגות</b> — יחסים מרחביים וכללי היגיון: רחובות וכבישים מהירים שלא אמורים להצטלב, באר שצריכה להיות בעומק מסוים."
 ]},
 {t:"h",v:"עיגון תמונה (Georeferencing)"},
 {t:"p",v:"תמונות ראסטר בד״כ אינן מכילות מידע גאוגרפי, ולעיתים לא צולמו בזווית התואמת את המערכת. <b>עיגון תמונה</b> = לסובב, להגדיל ולהתאים את התמונה למערכת הקואורדינטות של העולם האמיתי. ייצוג העיגון כולל גודל תא ב-X וב-Y, סיבוב, ונקודת ייחוס (Easting/Northing)."},

 {t:"h",v:"סוגי עבודה במערכת"},
 {t:"ul",v:[
  "<b>תשאול (Query)</b> — שאלות פשוטות על הנתונים. לדוגמה: ״הצג מחוזות בפלורידה עם מעל 300 אלף תושבים״. לכל אובייקט מספר מזהה, סוג (פוליגון) ומאפיינים.",
  "<b>ניתוח (Analysis)</b> — הפעלת אלגוריתמים וכלים חישוביים על הנתונים."
 ]},
 {t:"p",v:"<b>3 סוגי ניתוח:</b>"},
 {t:"ul",v:[
  "<b>קרבה (Proximity)</b> — אילו חלקות בטווח 50 מ׳ מהכביש? אילו אזורים בסכנת שיטפון לפי קרבה לנהרות?",
  "<b>שכבות-על (Overlay)</b> — הצלבת מספר שכבות: ״כל הבארות מסוג מסוים, בקרקע חולית, עם מבנה מסוים״.",
  "<b>רשת (Network)</b> — ניתוח לאורך רשת קווית: מסלול קצר מבית חולים לתאונה, תוך התחשבות בגובה גשרים ומשקל מותר."
 ]},
 {t:"p",v:"<b>תצוגה ופלט:</b> טבלאות, גרפים, מפות ודוחות. הפצה: שמירת פרויקט, שליחת תמונה (לא צריך את המערכת אצל המקבל), מפות נייר לשטח, או העלאה לאינטרנט."},

 {t:"h",v:"מושגים נוספים"},
 {t:"box",v:"<b>קנה מידה:</b> מספר קטן במכנה = קנה מידה <b>גדול</b> = יותר פירוט. ב-1:500 עיר עשויה להופיע כ<b>פוליגון</b>; ב-1:250,000 (קנ״מ קטן) אותה עיר תופיע כ<b>נקודה</b>. הכל נמצא במערכת — זה רק עניין של תצוגה."},
 {t:"p",v:"<b>יחסים מרחביים:</b> חיבור (כביש מחבר בין ערים), הכלה (סן פרנסיסקו בתוך קליפורניה), כיוון ואורך, וסמיכות."},
 {t:"p",v:"<b>יישומי תחבורה:</b> בניית מסלולים לסוגי כלי רכב שונים (משאיות, רכבות, אוטובוסים, הולכי רגל, מלגזות) · <b>Linear Referencing</b> — מיקום נקודות לאורך כביש: מיקומי תאונות, נקודות בעייתיות, תקלות ותשתיות · מחלפים וכבישים חד-סטריים · נתוני זרימת תנועה ועומסים · המחשה מרחבית בצבעים · <b>שילוב עם מערכות ארגוניות</b> כמו SAP, כדי לא לנהל מידע פעמיים."},

 {t:"h",v:"טכנולוגיות איכון — GPS"},
 {t:"p",v:"רוצים לאכן כדי שתהיה שליטה — לדעת איפה הדברים נמצאים ומה קורה. מבחינים בין איכון מחוץ למבנים ובתוכם."},
 {t:"box",v:"<b>השיטה האמריקאית (GPS):</b> 24 לוויינים · 6 מסלולים סביב כדור הארץ (4 בכל מסלול) · גובה ~20,200 ק״מ · נטייה 55°. הוקמה ע״י משרד ההגנה האמריקאי ומתופעלת ע״י חיל האוויר."},
 {t:"p",v:"<b>מנגנון הפעולה:</b> כל לוויין נושא <b>שעון אטומי</b> מדויק ומשדר אות הכולל את השעה ואת מיקומו. המקלט מחשב את המרחק מהלוויין לפי זמן הגעת האות."},
 {t:"box",v:"<b>טריאנגולציה:</b> חישוב נקודה במרחב ע״י הצלבת מרחקים מכמה מקורות. נדרשים <b>לפחות 4 לוויינים</b> — כי יש 4 נעלמים: x, y, z (מיקום וגובה) <b>והזמן t</b>."},
 {t:"p",v:"מערכות לוויין נוספות: <b>Galileo</b> (אירופה), <b>Glonass</b> (רוסיה), <b>Beidou</b> (סין)."},

 {t:"h",v:"AGPS ו-AVL"},
 {t:"p",v:"<b>הבעיה:</b> ה-GPS צריך לטעון את כל הנתונים לפני שמתחיל לעבוד — וזה איטי, במיוחד כשהאות חלש."},
 {t:"box",v:"<b>AGPS (Assisted GPS):</b> במקום להוריד את נתוני מיקומי הלוויינים <b>מהלוויין</b> (איטי), המכשיר מוריד אותם <b>משרת אינטרנט</b> שמתעדכן כל הזמן. מאיץ את ה״נעילה״ הראשונה (<b>TTFF — Time To First Fix</b>). מתאים למכשירים סלולריים שיכולים להתחבר לאינטרנט, ובעיקר באזורים עירוניים."},
 {t:"box",v:"<b>AVL (Automatic Vehicle Location) = GPS + GIS.</b> קופסה שמתחברת לרכב, קולטת נתוני GPS ומעבירה למוקד החברה."},
 {t:"ul",v:[
  "ניהול והצגת כלי הרכב על מפה.",
  "<b>שילוח דינמי</b> — לבדוק מי פנוי וקרוב ולשלוח אותו (למשל אמבולנס).",
  "<b>אזורים מגודרים (geofencing)</b> — התראות על כניסה/יציאה.",
  "תקשורת עם כלי הרכב; מעקב מלאי בשילוב <b>RFID</b>."
 ]},

 {t:"h",v:"איכון בתוך מבנים (Indoor Positioning)"},
 {t:"p",v:"ב-GPS האותות חלשים ולא זמינים בתוך מבנים (למשל ממ״ד עם גוף מתכת), ולעיתים נדרש דיוק גבוה יותר. לכן משתמשים בכלים אחרים שזמינים בטלפון: <b>מצפן, מד תאוצה, ג׳ירוסקופ, מד צעדים ומד גובה</b>."},
 {t:"ul",v:[
  "<b>Wi-Fi</b> — הטלפון דוגם את הרשת וקולט נקודות גישה ממופות; לפי <b>עוצמת האות</b> מבצעים מעין טריאנגולציה.",
  "<b>Bluetooth / BLE</b> — קולט תדרים ועוצמות ומחשב מרחקים. <b>היתרון על Wi-Fi: צריכת אנרגיה נמוכה בהרבה</b> (טווח ~50 מ׳).",
  "<b>ברקוד</b> — החיסרון: צריך לגשת פיזית לקרוא אותו, הוא קבוע ומכיל רק מידע אחד."
 ]},
 {t:"box",v:"<b>צריכת חשמל (מהנמוך לגבוה):</b> BLE (~100 ימי סוללה) ← Bluetooth 2.1 ← INS ← WLAN ← <b>GPS</b> (1–2.5 שעות בלבד)."}
]},

{u:3,title:"זרימה ברשתות",lessons:"שיעורים 5–7 · 26.5 · 2.6 · 9.6",blocks:[
 {t:"h",v:"מבנה הרשת"},
 {t:"p",v:"ברשת יש כבישים, מפעלים, לקוחות ומחסנים. לכל <b>קשת</b> מספר המייצג את הקיבולת (למשל 10 משאיות לשעה), וכן אורך ועלות נסיעה. לכל לקוח <b>דרישה (Demand)</b> ולכל ספק <b>כמות שהוא יכול לספק</b>."},
 {t:"tbl",head:["רכיב","תפקיד","סימון מאזן"],rows:[
  ["מקור / ספק / מפעל","מספק את ההיצע","<b>חיובי</b> (יוצא)"],
  ["יעד / לקוח","מייצג את הביקוש","<b>שלילי</b> (נכנס)"],
  ["נקודת ביניים / מעבר","מחסן, מרלו״ג, מתקן טיהור","<b>0</b> (נכנס = יוצא)"]
 ]},
 {t:"p",v:"<b>מאפייני בעיות זרימה:</b> <b>קיבולת</b> — המקסימום שניתן להעביר · <b>חסם תחתון</b> — לעיתים אסור לרדת מכמות מסוימת (למשל חוזים; תעלה שלא רוצים שתתייבש) · <b>עלויות</b> — קבועות (הקמה) ומשתנות (היקף שימוש)."},
 {t:"box",v:"<b>למה הקיבולת חשובה?</b> היא משפיעה על הכמות ועל הזמן. קריטי בפינוי חירום: דרכי מילוט, נקודות פינוי ברעידות אדמה, צונאמי, ובעתות מלחמה — לקיבולת הכביש חשיבות רבה לקצב הפינוי."},
 {t:"tbl",head:["שימוש","מקור (היצע)","מעבר","יעד (ביקוש)"],rows:[
  ["תפעול רשת הפצה","מקור המוצרים","אתרי אחסון","לקוחות"],
  ["טיפול באשפה מוצקה","מקור האשפה","מתקני טיהור","מטמנות"],
  ["תפעול רשת הספקה","ספקים","מחסנים","מפעלים"],
  ["תיאום תמהיל מוצרים","מפעלים","ייצור מוצרים","שווקים למוצרים"],
  ["ניהול תזרים מזומנים","מקורות","חלופות להשקעה","שימושים"]]},

 {t:"h",v:"בעיית התובלה (Transportation)"},
 {t:"p",v:"<b>הבעיה הפשוטה ביותר.</b> קיימים ספקים ולקוחות (נניח אותו מוצר); כל ספק יכול לספק לכל לקוח, ולכל שילוח יש עלות. <b>השאלה:</b> כמה להעביר מכל ספק לכל לקוח כך שסך עלות ההובלה תהיה מינימלית."},
 {t:"box",v:"<b>הערה חשובה:</b> מרחק אינו שקול ב-100% לעלות. יש עלויות שדה תעופה, דלק וכו׳ — טיסה לקפריסין יכולה להיות יקרה מטיסה לפריז; נסיעה דרך כביש 6 יכולה להגדיל עלויות."},
 {t:"ex",v:"<b>דוגמת P&T Co.:</b> 3 מפעלי שימורים ו-4 מחסנים. <b>סה״כ היצע 300 = סה״כ ביקוש 300</b> — בעיה מאוזנת. טבלת עלויות המשלוח למשאית:"},
 {t:"tbl",head:["מפעל \\ מחסן","W1","W2","W3","W4","היצע"],rows:[
  ["C1 (Bellingham)","464","513","654","867","<b>75</b>"],
  ["C2 (Eugene)","352","416","690","791","<b>125</b>"],
  ["C3 (Albert Lea)","995","682","388","685","<b>100</b>"],
  ["<b>ביקוש</b>","<b>80</b>","<b>65</b>","<b>70</b>","<b>85</b>","300"]]},
 {t:"p",v:"<b>פתרון א׳ — אלגוריתם חמדן:</b> מתחילים מהשינוע בעלות הנמוכה ביותר, מספקים כמה שאפשר, ועוברים לעלות הבאה. מהיר, אך <b>לא תמיד נותן את הפתרון האופטימלי</b> (לרוב קרוב אליו)."},
 {t:"p",v:"<b>פתרון ב׳ — תכנון לינארי:</b> פונקציית מטרה = סכום (כמות × עלות) על כל הקשתות, ורוצים <b>מינימום</b>."},
 {t:"box",v:"<b>אילוצים:</b> הכמות שיוצאת מכל ספק ≤ הכמות שיש לו (אי אפשר להוציא יותר ממה שיש) · הכמות שמגיעה לכל לקוח = הדרישה שלו · אי-שליליות (x ≥ 0) · לעיתים שלמות (INT) — כשמובילים פריטים בודדים ולא נוזלים."},

 {t:"h",v:"מאזן — היצע מול ביקוש"},
 {t:"box",v:"בעיה <b>מאוזנת</b>: סך ההיצע = סך הביקוש. כאשר אין שוויון — הבעיה <b>לא מאוזנת</b>, ומאזנים אותה:<br>• <b>היצע > ביקוש</b> ← מוסיפים <b>לקוח/יעד פיקטיבי</b> שקולט את העודף, בעלות 0.<br>• <b>ביקוש > היצע</b> ← מוסיפים <b>ספק/מקור פיקטיבי</b> שמספק את החוסר, בעלות 0.<br>המודל <b>אינו</b> הופך ללא-פתיר, ופונקציית המטרה אינה הופכת לשלילית."},

 {t:"h",v:"בעיית השיטעון (Transshipment)"},
 {t:"p",v:"בעיה מורכבת יותר: עדיין מעבירים סחורה מספקים ללקוחות עם עלויות שינוע, אך <b>יש נקודות ביניים (Transshipment points)</b> — מחסנים ומרלו״גים שדרכם הסחורה עוברת בדרך ליעד."},
 {t:"ul",v:[
  "<b>ספקים (Suppliers)</b> — מקור הסחורה.",
  "<b>לקוחות (Customers)</b> — יעד הסחורה.",
  "<b>נקודות ביניים</b> — מחסנים / מרכזים לוגיסטיים."
 ]},
 {t:"box",v:"<b>ההבדל המהותי מתובלה:</b> בתובלה הזרימה <b>ישירה</b> ממקור ליעד; בשיטעון יש <b>קודקודי ביניים</b> שבהם סך הזרימה הנכנסת חייבת להיות שווה ליוצאת (<b>שימור זרימה</b>). בנוסף, בנקודות שיטעון ייתכן שנדרש להשאיר מלאי מסוים."},
 {t:"p",v:"<b>המטרה:</b> לספק את דרישות הלקוחות תוך עמידה במגבלות המלאי של הספקים ומינימום עלויות הובלה כוללות. <b>הפתרון:</b> תיאור כבעיית תכנות לינארי ופתרון בסולבר."},

 {t:"h",v:"תכנות לינארי ופתרון בסולבר"},
 {t:"p",v:"מאחר שקשה לפתור בעיות שיטעון ידנית, מגדירים שלושה מרכיבים:"},
 {t:"ul",v:[
  "<b>פונקציית מטרה</b> — ביטוי המייצג את העלות הכוללת: סכום של (כמות × עלות ליחידה) על כל קשת. השאיפה: <b>מינימום</b>.",
  "<b>משתני החלטה</b> — X<sub>ij</sub>: כמות הסחורה שעוברת מקודקוד i לקודקוד j.",
  "<b>אילוצים</b> — היצע, ביקוש, שימור זרימה, אי-שליליות ולעיתים שלמות."
 ]},
 {t:"ex",v:"<b>דוגמה מהשיעור:</b> סנדוויל = −45 (יוצאת ממנו כמות), אמרילו = 80 (נכנסת אליו). על הקשת עלות 250 להובלת פריט אחד. הכמות מסומנת X<sub>16</sub> (מקודקוד 1 לקודקוד 6) ומוכפלת ב-250. כך סוכמים את כל הקשתות: כל עלות × משתנה ההחלטה שלה."},
 {t:"box",v:"<b>למה צריך אילוצים?</b> בלי אילוצים אפשר להציב 0 בכל המשתנים ולקבל עלות 0 — אבל אז לא יעבור כלום, ואנחנו חייבים לספק סחורה."},
 {t:"p",v:"<b>שלבי העבודה בסולבר (Excel):</b> מפעילים את תוספת ה-Solver (קובץ ← אפשרויות ← תוספות) ← מופיע בלשונית <b>DATA</b> ← מסמנים את תא <b>פונקציית המטרה</b> ← מסמנים את תאי <b>משתני ההחלטה</b> לשינוי ← בוחרים <b>מינימום</b> ← מוסיפים אילוצים (ADD; אפשר להגדיר טווח שלם במקום אילוץ-אילוץ) ← מוסיפים אילוץ <b>INT</b> ואילוץ ≥ 0 ← <b>Solve</b>."},
 {t:"box",v:"<b>הערה:</b> ניתן להגדיר בסולבר <b>רק פונקציית מטרה אחת</b>. שימושי: <b>SUMPRODUCT</b> — מכפילה איבר-איבר בין שני טווחים וסוכמת."},
 {t:"box",v:"<b>המרצה אמר במפורש:</b> ״לא תהיה לכם שאלה כזאת במבחן [של אקסל/סולבר]. אתם לא יכולים לפתור את זה.״ — הסולבר נדרש רק לתרגיל ההגשה."},

 {t:"h",v:"בעיית הזרימה המקסימלית (Max Flow)"},
 {t:"p",v:"בגרף שמייצג רשת, המספרים על הקשתות הם <b>הקיבולת</b> של כל קשת. השאלה: <b>כמה ניתן להעביר מ-O ל-T אם משתמשים בכל הרשת בו-זמנית?</b> (לא מחפשים מסלול אחד)."},
 {t:"ex",v:"<b>חסם ראשוני:</b> אם מ-O יוצאות קשתות בקיבולת 5+7+4 = 16, ואל T נכנסות 9+6 = 15 — הזרימה המקסימלית <b>לא יכולה לעבור 15</b> (המינימום מביניהם)."},
 {t:"p",v:"<b>רשת שיורית (Residual Network):</b> לכל קשת בגרף המקורי בונים גם <b>קשת בכיוון ההפוך</b> עם ערך התחלתי 0. אפשר לרשום שני מספרים על כל קשת במקום לצייר גרף נוסף."},
 {t:"box",v:"<b>אלגוריתם פורד-פולקרסון:</b><br>1. מצא <b>מסלול אוגמנטי</b> כלשהו מהמקור ליעד, שבו הזרימה השיורית בכל הקשתות > 0.<br>2. זהה את <b>f</b> = הקיבולת <b>המינימלית</b> באותו מסלול (צוואר הבקבוק).<br>3. <b>הפחת f</b> מהקשתות הישרות ו<b>הוסף f</b> לקשתות ההפוכות.<br>4. חזור עד שאין יותר מסלולים אפשריים.<br><b>הזרימה המקסימלית = סכום כל ערכי f.</b>"},
 {t:"box",v:"<b>למה צריך קשתות חוזרות?</b> הן מאפשרות ״לבטל״ זרימה שהוקצתה בטעות בצעד קודם ולנתב אותה מחדש — מגדילות את האופציות ומאפשרות להגיע לאופטימום."},
 {t:"ex",v:"<b>ההמחשה מהמצגת (שקף 20):</b> רשת קטנה S→V1, S→V2, V2→V1, V1→T, V2→T שבה <b>כל הקיבולות = 1</b>. בחירת המסלול S→V2→V1→T ״חוסמת״ את הרשת — והקשת החוזרת היא שמאפשרת לתקן ולהגיע לזרימה המקסימלית."},
 {t:"ex",v:"<b>דוגמה פתורה (שקפים 14–15):</b> ברשת O–A–B–C–D–E–T עם קיבולות O→A=5, O→B=7, O→C=4, A→B=1, A→D=3, B→C=2, B→D=4, B→E=5, C→E=4, E→D=1, D→T=9, E→T=6 — הזרימה בפועל: O→A=4, O→B=7, O→C=3, A→B=1, A→D=3, B→D=4, B→E=4, C→E=3, E→D=1, D→T=8, E→T=6.<br><b>הזרימה המקסימלית = 14</b> (4+7+3 יוצא מהמקור = 8+6 נכנס ליעד)."},
 {t:"p",v:"<b>ריבוי מקורות ויעדים:</b> מוסיפים <b>סופר-מקור</b> ו<b>סופר-יעד</b> דמיוניים בקיבולת <b>אינסופית</b>, המחוברים לכל הנקודות הרלוונטיות. זה לא משנה את הזרימה (שנקבעת לפי הערך המינימלי) ומאפשר להשתמש באותו אלגוריתם."},

 {t:"h",v:"החתך המינימלי (Min Cut)"},
 {t:"p",v:"<b>חתך</b> = מחיקת קבוצת קשתות כך שלא נותר מסלול מ-S ל-T. <b>ערך החתך</b> = סך הקיבולות של הקשתות שבו. מחפשים חתך בעל ערך <b>מינימלי</b>."},
 {t:"box",v:"<b>משפט Max-Flow / Min-Cut:</b> החתך המינימלי הוא הבעיה <b>הדואלית</b> של הזרימה המקסימלית — <b>ערך הזרימה המקסימלית = ערך החתך המינימלי</b>. כדי למצוא את החתך פותרים תחילה את הזרימה המקסימלית; הקשתות של החתך הן אלו ש<b>הזרימה בהן שווה לקיבולת</b> (הקשתות הרוויות — צוואר הבקבוק)."},
 {t:"p",v:"<b>אילוצי קיבולת בתכנון לינארי:</b> בנוסף לאילוצי המאזן, מוסיפים אילוץ שהכמות בקשת לא תעלה על הקיבולת. גם אם העלות נמוכה — ייתכן שנהיה מוגבלים בקיבולת הקשת."},
 {t:"h",v:"בעיית מינימום עלות (Minimum Cost Flow) — דוגמה פתורה"},
 {t:"p",v:"זו הבעיה הכללית שממנה תובלה ושיטעון הן מקרים פרטיים. הדוגמה מהמצגת (שקפים 26–27):"},
 {t:"box",v:"<b>פונקציית מטרה:</b> min Z = 2x<sub>AB</sub> + 4x<sub>AC</sub> + 9x<sub>AD</sub> + 3x<sub>BC</sub> + x<sub>CE</sub> + 3x<sub>DE</sub> + 2x<sub>ED</sub>"},
 {t:"ul",v:[
  "<b>A [50]:</b> x<sub>AB</sub> + x<sub>AC</sub> + x<sub>AD</sub> = 50 — מקור (מאזן חיובי)",
  "<b>B [40]:</b> −x<sub>AB</sub> + x<sub>BC</sub> = 40",
  "<b>C [0]:</b> −x<sub>AC</sub> − x<sub>BC</sub> + x<sub>CE</sub> = 0 — <b>קודקוד מעבר</b>",
  "<b>D [−30]:</b> −x<sub>AD</sub> + x<sub>DE</sub> − x<sub>ED</sub> = −30 — יעד (מאזן שלילי)",
  "<b>E [−60]:</b> −x<sub>CE</sub> − x<sub>DE</sub> + x<sub>ED</sub> = −60 — יעד",
  "<b>אילוצי קיבולת:</b> x<sub>AB</sub> ≤ 10 · x<sub>CE</sub> ≤ 80 · אי-שליליות: x<sub>ij</sub> ≥ 0"]},
 {t:"box",v:"<b>הפתרון האופטימלי:</b> x<sub>AD</sub> = 10 · x<sub>AC</sub> = 40 · x<sub>BC</sub> = 40 · x<sub>CE</sub> = 80 · x<sub>ED</sub> = 20 · x<sub>AB</sub> = 0 &nbsp;←&nbsp; <b>Z = 490</b>"}
]},

{u:4,title:"מיקום מתקנים",lessons:"שיעורים 8 · 16.6",blocks:[
 {t:"h",v:"הבעיה"},
 {t:"p",v:"הצורך למצוא <b>מיקום אופטימלי למתקן</b> — מרלו״ג, מפעל, תחנת כיבוי אש, מוקד שילוח — כשלכל אחד המטרות והאילוצים שלו."},
 {t:"ex",v:"<b>דוגמת סן פרנסיסקו:</b> ניתוח GIS יוצר <b>מפת חום</b> של זמני הגעה לבתי חולים קיימים (5 / 10 / 20 דקות). המטרה <b>אינה</b> להתחרות בבתי חולים קיימים, אלא לזהות את ה״אזורים הצהובים״ — בעלי רמת שירות נמוכה וזמני הגעה ארוכים — ולמקם שם את המתקן החדש כדי להרחיב את הכיסוי."},

 {t:"h",v:"סוגי מתקנים"},
 {t:"ul",v:[
  "<b>מרכז הפצה</b> — אחסון והפצה ליעד הסופי + פעולות משלימות (איחוד, אריזה).",
  "<b>מחסן</b> — לאחסון בלבד.",
  "<b>שטעון / Cross-docking</b> — מעבר סחורה <b>ללא אחסון</b>: מעמדת פריקה ישירות לעמדת טעינה.",
  "<b>נמלים</b> — הובלה ארוכת טווח, יבוא/יצוא, ממשק לאמצעי תובלה נוספים (כולל אזור סחר חופשי ונמל עורפי).",
  "<b>מסופים</b> — Intermodal (רב-אמצעי), מסוף צובר (למשל צינורות גזים), מסוף רכזת (Hub), מסוף עירוני.",
  "<b>מרכז לוגיסטי משולב</b> — פארק תעשייתי / ״עיר״ לוגיסטית."
 ]},
 {t:"box",v:"<b>שני סוגים עיקריים:</b> מרלו״גים גדולים מחוץ לעיר באזורי תעשייה · מרכזי הפצה מקומיים קטנים יותר לשירות אזורי."},

 {t:"h",v:"שלבים בבחירת מיקום"},
 {t:"p",v:"1. תכנון ואסטרטגיה ← 2. עיצוב רשת ← 3. סינון אתרים ← 4. בדיקת שטח וניתוח כספי ← 5. משא ומתן ובחירת אתר."},
 {t:"h",v:"לוגיסטיקה עירונית"},
 {t:"box",v:"<b>הבעיות:</b> תאונות · רעש (נסיעה ופריקה) · זיהום. מרלו״ג מחוץ לעיר יוצר גם בעיית נגישות.<br><b>הפתרונות:</b> הגבלת תנועה · הספקה מחוץ לשעות הפעילות · <b>חלונות זמן</b> שהרשות מגדירה · פריקה יעילה (ניצול עמדות, קיצור משך הפריקה) · מערכות מידע · הבחנה סינכרוני/אסינכרוני."},

 {t:"h",v:"השפעות של מיקום מתקן"},
 {t:"tbl",head:["השפעות תחבורתיות","השפעות כלכליות"],rows:[
  ["תנועת כלי רכב (עירוני או לא, תח״צ או רכב פרטי)","פיתוח תשתיות (אזורי תעשייה חדשים)"],
  ["עלויות נסיעה","פעילות כלכלית במתקן"],
  ["שרשרת ההספקה","פיתוח כלכלי של האזור"],
  ["סביבה, זיהום ורעש (למשל רמת חובב)","משיכת עסקים"],
  ["אנרגיה · בטיחות ובטחון",""]
 ]},

 {t:"h",v:"גורמים המשפיעים על הבחירה"},
 {t:"ul",v:[
  "<b>נגישות לשווקים</b> — קרבה לשווקים שאיתם עובדים, להוזלת עלויות שינוע (מרחק וזמן).",
  "<b>נגישות לרשת התחבורה</b> — קישור לכבישים ארציים, שדות תעופה.",
  "<b>אמצעי הובלה</b> — האם קיימים רכבות, מטוסים וכו׳.",
  "<b>עבודה וכוח אדם</b> — קרבה למקומות עירוניים שיש בהם כח אדם.",
  "<b>תשתיות</b> ו<b>מתקנים מתאימים</b> — האם קיימים או שצריך להקים מחדש.",
  "<b>תקנות וחוקים · מיסוי · סיוע ציבורי</b>.",
  "<b>מזג אוויר</b> — רלוונטי בעיקר בארה״ב (אזורי הוריקן/טורנדו)."
 ]},

 {t:"h",v:"לוגיסטיקה עירונית"},
 {t:"p",v:"<b>בעיות המרכזים הלוגיסטיים:</b> רעש · עבודה 24 שעות ביממה · תנועת כלי רכב רבה (תאונות וזיהום) · מרלו״ג מחוץ לעיר יוצר בעיית נגישות וזמינות. לכן בונים מרכזים קטנים יותר לשירות האזור הקרוב."},
 {t:"p",v:"<b>פתרונות לעומסי חלוקה בעיר:</b> הגבלת תנועה ברחובות מסוימים בשעות מסוימות · אספקה מחוץ לשעות הפעילות (מוקדם בבוקר / מאוחר בערב) · <b>חלונות זמן</b> שהעירייה מגדירה לכניסה לעיר · שיטות פריקה יעילות."},
 {t:"box",v:"<b>חלון זמן</b> = פרק הזמן שבו אמורים לתת שירות ללקוח. למשל סופר שמקבל סחורה מהמון ספקים — מחלקים אותם לחלונות זמנים."},

 {t:"h",v:"עלות מול מרחק — ה-Trade-off"},
 {t:"box",v:"ככל שמתרחקים מאזורים עירוניים <b>עלויות הקרקע יורדות</b>, אך <b>השינוע מתרחק מהשווקים</b> ומתייקר. מחברים את שתי העלויות ומקבלים <b>עקומת U</b> — העלות הכוללת המינימלית מתקבלת ב<b>נקודת ביניים</b>, לא בקצוות."},

 {t:"h",v:"סיווג מודלים"},
 {t:"tbl",head:["סיווג","הסבר"],rows:[
  ["<b>בדיד מול רציף</b>","בדיד — אפשר להתמקם רק ממקומות מוגדרים שצריך לבחור ביניהם. רציף — אפשר לבחור כל נקודה במרחב."],
  ["<b>סטטי מול דינמי</b>","סטטי — מיקום הלקוחות, הכמויות וזהות הלקוחות קבועים (מקל על ההחלטה). דינמי — משתנים כל הזמן."],
  ["<b>דטרמיניסטי מול סטוכסטי</b>","דטרמיניסטי — הנתונים ידועים. סטוכסטי — יש אקראיות; יודעים רק הסתברות וסטיית תקן, לא כמות מדויקת."],
  ["<b>אופן חישוב מרחק</b>","מפורש (ברשת בפועל ב-GIS — מדויק) · אוקלידי (קו אווירי) · Rectilinear (לאורך צירי X ו-Y)."]
 ]},
 {t:"ex",v:"<b>דוגמת מוכר הגלידה בחוף:</b> אם מותר לו לעמוד בכל נקודה בחוף — <b>מודל רציף</b>. אם רק ממקומות מוגדרים מראש — <b>מודל בדיד</b>."},
 {t:"ex",v:"<b>דוגמה בדיד מול רציף:</b> נדרש מרלו״ג במרחק שלא יעלה על 100 ק״מ מכל לקוח, עם אפשרויות A, B, C. אם A רחוק 120 ק״מ מ-C — <b>אין פתרון בדיד</b> שעומד באילוץ. במודל רציף היה ניתן למקם בדיוק בנקודת 100 ק״מ."},
 {t:"box",v:"<b>הערכת מרחק:</b> <b>קו אווירי</b> קצר מהמציאות ← הערכת <b>חסר</b> (אפשר לפצות: להגדיר 40 ק״מ אווירי כדי לקבל ~50 בפועל). <b>מדידה לאורך צירים</b> (לנוע ב-Y ואז ב-X) ← הערכה <b>מחמירה</b>, בד״כ ארוכה מהמסלול המפורט."},

 {t:"h",v:"ריבוי פונקציות מטרה וחזית פארטו"},
 {t:"p",v:"בשנים האחרונות מדברים על בעיות אופטימיזציה עם יותר ממטרה אחת — למשל <b>מינימום עלות</b> מול <b>מקסימום שביעות רצון לקוחות</b>. בד״כ הן פוגעות זו בזו: הורדת עלויות פוגעת בשירות."},
 {t:"box",v:"פותרים את שתי הבעיות <b>בו-זמנית</b> ומקבלים <b>סט של פתרונות</b> — <b>חזית פארטו (Pareto Front)</b>: אוסף הפתרונות ה<b>לא-נשלטים</b>, שבהם אי אפשר לשפר מטרה אחת בלי לפגוע באחרת. כולם ״טובים באותה מידה״, והארגון בוחר לפי המשקלים וההעדפות שלו. נקודה שנשלטת (נחותה) אינה על החזית."},

 {t:"h",v:"מודלי מיקום"},
 {t:"tbl",head:["מודל","המטרה"],rows:[
  ["<b>P-Median</b>","מזעור <b>סכום המרחקים המשוקלל בביקוש</b> (מרחק × ביקוש) — מטרת עלות כוללת."],
  ["<b>Min-Max</b>","מזעור המרחק/הזמן אל <b>הלקוח המרוחק ביותר</b> — מטרת הוגנות ורמת שירות."],
  ["<b>כיסוי מקסימלי</b>","מקסום סך <b>הביקוש המכוסה</b> בתוך טווח כיסוי נתון (D<sub>c</sub>), במספר מתקנים מוגבל (P)."],
  ["<b>Hub &amp; Spokes</b>","רשת היררכית — מרכזי-על (Hubs) וחישורים (Spokes). יעיל לקונסולידציה (קווי תעופה, שילוח)."]
 ]},
 {t:"box",v:"<b>שים לב — המודל שבוחרים משנה את התוצאה!</b> חלופה א׳: 5+10+20 = 35 · חלופה ב׳: 15+10+15 = 40. לפי <b>P-Median</b> עדיפה א׳ (35 < 40); לפי <b>Min-Max</b> עדיפה ב׳ (מקסימום 15 מול 20)."},

 {t:"h",v:"מיקום מתקן יחיד — שיטת החציון המשוקלל"},
 {t:"p",v:"כאשר יש לקוחות במיקומים ידועים ולכל אחד <b>משקל</b> (למשל כמות סטודנטים), משתמשים בשיטת החציון כדי למזער את סך מרחקי ההליכה/ההובלה:"},
 {t:"ul",v:[
  "<b>1. מיון</b> — ממיינים את הנקודות לפי ציר X בנפרד ולפי ציר Y בנפרד.",
  "<b>2. משקל מצטבר</b> — מחשבים את סך המשקלים ומוצאים את החציון (סך המשקל ÷ 2).",
  "<b>3. מציאת המיקום</b> — המיקום האופטימלי בציר הוא הנקודה שבה המשקל המצטבר <b>עובר לראשונה</b> את ערך החציון. חוזרים על התהליך לציר השני."
 ]},
 {t:"ex",v:"<b>דוגמת הספרייה:</b> הנדסה (0,0)=190 · מנע״ס (5,13)=310 · חינוך (8,18)=280 · מדעי הרוח (6,3)=530 · משפטים (14,20)=320 · מדעים (10,12)=410. <b>סה״כ 2,040 ← חציון 1,020.</b><br><b>ציר X:</b> 0(190) ← 5(500) ← <b>6(1030)</b> ✔ חוצה את 1,020 ← X* = 6.<br><b>ציר Y:</b> 0(190) ← 3(720) ← <b>12(1130)</b> ✔ ← Y* = 12.<br><b>המיקום: (6, 12)</b> — ואז בודקים אם אין שם בניין קיים."},
 {t:"box",v:"<b>קריטי:</b> הפתרון הוא <b>חציון משוקלל</b> — <b>לא ממוצע</b> ולא מרכז גיאומטרי!"},

 {t:"h",v:"גבול הפצה (Delivery Boundary)"},
 {t:"p",v:"כאשר לקוח יכול להיות משורת מהמפעל או ממרכז הפצה, <b>גבול ההפצה</b> הוא <b>נקודת שוויון העלויות</b> — המקום שממנו ואילך זול יותר לספק מהמקור השני."},
 {t:"ex",v:"עלות מהמפעל: 1 + 0.06x. עלות ממרכז ההפצה (במרחק 200 ק״מ): 2.5 + 0.4 + 0.04·(200−x). משווים ← <b>x = 99 ק״מ</b>."}
]},

{u:5,title:"ניתוב רכבים",lessons:"שיעורים 9–10 · 23.6 · 30.6 · 7.7",blocks:[
 {t:"h",v:"מבוא"},
 {t:"p",v:"ניתוב רכבים הוא <b>סדרה של בעיות</b> שבהן צריך לקבוע מסלולים — לרכב אחד או יותר. לכל בעיה האילוצים והמטרות שלה. הנקודה המרכזית: <b>לדעת להבחין בין הבעיות</b>."},
 {t:"p",v:"<b>ייצוג ברשת:</b> משתמשים ב<b>גרף</b> — קודקודים מייצגים צמתים, קשתות מייצגות כבישים. לכל קשת אפשר לשייך מספר שמייצג מה שרוצים: מהירות, קיבולת, זמן נסיעה, עומס או עלות. המספרים נקראים <b>משקלים</b>."},
 {t:"box",v:"כשאומרים ״מסלול קצר ביותר״ — <b>זה לא תמיד באמת הקצר</b>; תלוי במה שהמספרים מייצגים (זמן, מרחק, עלות)."},

 {t:"h",v:"בעיית המסלול הקצר ביותר"},
 {t:"p",v:"יש נקודת מוצא ונקודת יעד, ומחפשים את המסלול הזול ביותר במונחי זמן, מרחק או עלות (Waze / Google Maps). ייתכנו <b>שני מסלולים בעלי אותו אורך או זמן</b>."},
 {t:"box",v:"<b>K-Shortest Paths:</b> K המסלולים הקצרים ביותר. כשנערכים לתרחיש חירום וצריך נתיבי פינוי, <b>אי אפשר לתכנן רק נתיב אחד</b> — ייתכן שלא יהיה זמין. לכן מכינים מראש סט מסלולים, ואם הקצר ביותר חסום עוברים לבא בתור."},
 {t:"box",v:"<b>האלגוריתם (שקף 7) — 5 שלבים:</b><br>1. מצא את המסלול הקצר ביותר, N=1.<br>2. צרף לרשימת המועמדים את כל <b>ההטיות</b> של מסלול N.<br>3. מיין את הרשימה לפי אורכי המסלולים, N=N+1.<br>4. המסלול הקצר ביותר ברשימה הוא המסלול ה-N הקצר ביותר.<br>5. אם N=K — סיים; אחרת חזור לשלב 2."},

 {t:"h",v:"אלגוריתם דייקסטרה (Dijkstra)"},
 {t:"p",v:"פותח ב-<b>1959</b> ע״י מדען המחשב ההולנדי <b>אדסחר דייקסטרה</b>. אלגוריתם ישן, פשוט וקל להבנה — ומשתמשים בו עד היום."},
 {t:"box",v:"<b>מה הוא עושה:</b> הוא <b>אינו</b> מחשב מסלול מקודקוד אחד לקודקוד שני בלבד — אלא מוצא <b>בבת אחת</b> את אוסף המסלולים הקצרים <b>מקודקוד המוצא לכל שאר הקודקודים</b> (Single-source). בגרף עם 6 קודקודים נקבל 5 מסלולים. <b>אין הגדרת יעד</b> — הוא פותר לכל היעדים האפשריים."},
 {t:"p",v:"<b>שלבי האלגוריתם:</b>"},
 {t:"ul",v:[
  "<b>אתחול</b> — לקודקוד המוצא מרחק 0; לכל השאר <b>אינסוף</b> (עדיין לא יודעים איך להגיע אליהם).",
  "<b>בחירה</b> — בוחרים מבין הקודקודים שטרם טופלו את זה שהמרחק אליו <b>הקצר ביותר</b> (הצעד ה״חמדני״).",
  "<b>עדכון (Relaxation)</b> — בוחנים את שכניו: אם המרחק החדש קטן מהרשום — מוחקים ורושמים את החדש; אם גדול — לא נוגעים.",
  "<b>חזרה</b> — ממשיכים תמיד מהקודקוד עם המרחק הקטן ביותר שנותר, עד שמסיימים."
 ]},
 {t:"box",v:"<b>הסימון על הגרף:</b> ליד כל קודקוד רושמים <b>מרחק/קודקוד-אב</b> — למשל <b>7/v6</b> פירושו: המרחק המינימלי הוא 7, והגענו לכאן מ-v6. <b>שחזור המסלול</b> נעשה ע״י הליכה אחורה לפי קודקודי האב."},
 {t:"box",v:"<b>הגרף בדוגמה (שקף 8):</b> V1→V2=8 · V1→V4=4 · V2→V3=2 · V2→V4=6 · V2→V6=4 · V6→V2=2 · V6→V3=7 · V4→V6=1 · V4→V5=4 · V5→V6=4 · V6→V5=5.<br><b>סדר העיבוד:</b> V1(0) ← V4(4) ← V6(5) ← V2(7 — עודכן מ-8) ← V5(8) ← V3(9 — עודכן מ-12). המצגת מקדישה לכך <b>9 שקפים של הרצה צעד-אחר-צעד</b> — סימן שזה נושא מרכזי."},
 {t:"ex",v:"<b>התוצאה הסופית (מוצא V1):</b><br>V1→V2 = <b>7</b> (V1-V4-V6-V2) · V1→V3 = <b>9</b> (V1-V4-V6-V2-V3) · V1→V4 = <b>4</b> (V1-V4) · V1→V5 = <b>8</b> (V1-V4-V5) · V1→V6 = <b>5</b> (V1-V4-V6)."},
 {t:"box",v:"<b>המגבלה (שאלת מבחן!):</b> דייקסטרה <b>אינו מתמודד עם משקלים שליליים</b>. הסיבה: הוא חמדני — ברגע שקודקוד סומן כ<b>קבוע</b>, מניחים שהמרחק אליו מינימלי; אם בהמשך הרשת יש משקל שלילי שעשוי להציע מרחק קצר יותר, האלגוריתם <b>כבר לא יעדכן</b> אותו.<br><b>הערת המרצה:</b> ״בעולם שלנו במקרים נדירים ניתקל במשקל שלילי (זמן/מהירות/מרחק אינם שליליים), ולכן האלגוריתם רלוונטי לנו למרות המגבלה.״"},

 {t:"h",v:"אלגוריתם חמדני (Greedy)"},
 {t:"p",v:"<b>משפחה של אלגוריתמים</b>, לא אלגוריתם ספציפי. עובדים בצעדים, ובכל צעד עושים את הפעולה שנותנת את מירב התועלת <b>באותו רגע</b> — בלי להסתכל על ההשפעה העתידית."},
 {t:"box",v:"ייתכן שבחירה שנראית הכי טובה כרגע <b>לא תהיה טובה בהמשך</b>. לכן חמדני יכול לעבוד באופן מושלם (דייקסטרה — אופטימלי) או לתת רק <b>פתרון מקורב</b> (TSP). היתרון: מהיר, לא צריך לסרוק את כל הפתרונות."},

 {t:"h",v:"בעיית הסוכן הנוסע (TSP)"},
 {t:"p",v:"משאית צריכה לעבור במספר נקודות ולחזור לנקודת המוצא (המרלו״ג). <b>בהינתן שאין אילוצים</b> (עיתוי או סדר) — מה הסדר של הקודקודים שייתן את המסלול הקצר ביותר?"},
 {t:"box",v:"<b>הגדרה:</b> מציאת <b>מעגל המילטוני בעל משקל מינימלי</b>. <b>מסלול המילטוני</b> = עובר בכל קודקודי הגרף פעם אחת בלבד; <b>מעגל המילטוני</b> = גם חוזר לקודקוד ההתחלה. מוגדרת עבור <b>גרף שלם</b> (קשת בין כל זוג קודקודים)."},
 {t:"box",v:"<b>הבעיה שייכת ל-NP-Hard</b> — במדעי המחשב לא מצליחים למצוא אלגוריתם יעיל שפותר אותה. מספר האפשרויות גדל בקצב <b>עצרתי</b>: ב-10 ערים כבר ~מיליוני מסלולים; המעבר מ-100! ל-101! הוא הכפלה ב-101. <b>הדרך היחידה למצוא אופטימום היא לנסות את כל האפשרויות — וזה לא מעשי.</b> (לא הוכח ש-NP היא בעיה ללא פתרון.)"},
 {t:"p",v:"<b>Brute Force (״כוח גס״):</b> הדרך הפשוטה והנאיבית — המחשב מייצר את כל המסלולים האפשריים, מחשב את המרחק של כל אחד ובוחר את הקצר. מבטיח אופטימום אך בלתי מעשי."},
 {t:"box",v:"<b>אלגוריתם השכן הקרוב ביותר (Nearest Neighbor)</b> — היוריסטיקה <b>חמדנית</b>: בוחרים קודקוד התחלה, ובכל צעד עוברים לקודקוד <b>הקרוב ביותר שטרם ביקרנו בו</b>, עד שמסיימים.<br><b>חסם הביצועים:</b> S<sub>opt</sub> ≤ S<sub>alg</sub> ≤ <b>2 · S<sub>opt</sub></b> — לעולם לא גרוע מפי 2 מהאופטימום, אך לא מובטח אופטימלי."},
 {t:"box",v:"<b>נקודה חשובה:</b> מכיוון שזה מסלול מעגלי, אפשר להתחיל בנקודה אחרת — <b>ושינוי נקודת ההתחלה יכול להוביל לתוצאה שונה לחלוטין</b>, אף שהמסלול עדיין מבקר באותן נקודות."},
 {t:"p",v:"<b>הערת המרצה:</b> ״AI לא יכול לחשוב במקומנו, ולא יכול לעשות דברים שאנחנו לא יודעים לעשות.״"},

 {t:"h",v:"בעיית מחלק הדואר הסיני"},
 {t:"p",v:"בסוכן הנוסע חיפשנו מסלול שעובר בכל <b>הקודקודים</b>; כאן מחפשים מסלול שיעבור בכל <b>הקשתות</b> של הגרף."},
 {t:"box",v:"<b>ההבחנה המרכזית:</b> מחלק הדואר = כל ה<b>קשתות</b> · סוכן נוסע = כל ה<b>קודקודים</b>."},
 {t:"p",v:"לא בכל גרף ניתן לעבור בכל קשת בדיוק פעם אחת. לא רוצים לעבור פעמיים על קשת — זה עולה זמן וכסף. <b>השאלה:</b> על אילו קשתות צריך לעבור פעם נוספת כך שהתוספת תהיה <b>מינימלית</b>?"},
 {t:"p",v:"<b>שימושים:</b> חלוקת דואר · איסוף אשפה · טאטוא רחובות · תכנון מסלול הליכה במוזיאון."},

 {t:"h",v:"בעיית ניתוב רכבים (VRP)"},

 {t:"box",v:"<b>המעבר מ-TSP ל-VRP — האילוץ שמתווסף הוא קיבולת הרכב.</b> בסוכן נוסע סוכן אחד עובר בין כל הלקוחות; ב-VRP לא ניתן — צריך <b>מספר רכבים ומספר מסלולים</b>. גם בעיה זו <b>בלתי פתירה אופטימלית</b> ← פתרונות מקורבים."},

  "<b>סוג הרשת</b> — <b>כביש דו-סטרי מכפיל את הרשת</b> (ההלוך שונה מהחזור) ומקשה יותר מרשת חד-סטרית.",
  "<b>מגבלות זמן ומרחק</b> — לא רוצים משאית שנוסעת שעה לצד אחרת שנוסעת 10 שעות.",
  "<b>תפעול</b> — אספקה, איסוף או שניהם; סידור המשאית שתהיה מאוזנת במשקל.",
  "<b>עלויות</b> — קבועות (תפעול, רכש, פחת), משתנות (דלק), וקנסות."
 ]},

function blockHTML(b){
  if(b.t==="h")   return `<h3>${b.v}</h3>`;
  if(b.t==="p")   return `<p>${b.v}</p>`;
  if(b.t==="ul")  return `<ul>${b.v.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.t==="box") return `<div class="bk-box">${b.v}</div>`;
  if(b.t==="ex")  return `<div class="bk-ex">${b.v}</div>`;
  if(b.t==="tbl") return `<div class="tb-scroll"><table class="tb"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

}

  const counts={}; QUESTIONS.forEach(q=>counts[q.u]=(counts[q.u]||0)+1);
  const chips=Object.entries(UNITS).map(([u,info])=>{
    const on=state.selectedUnits.has(+u);
    return `<button class="chip" aria-pressed="${on}" data-unit="${u}"><span class="dot" style="background:${info.hex}"></span>${info.name} <span style="color:var(--muted);font-weight:600">(${counts[u]||0})</span></button>`;
  }).join("");
  const total=state.profOnly?PROF_COUNT:QUESTIONS.filter(q=>state.selectedUnits.has(q.u)).length;
  main.innerHTML=`<div class="wrap">
    <div class="hero">
      <div class="hero-top">
        <div class="kicker">בר-אילן · ד״ר אורן נחום</div>

      </div>
      <div class="hero-body">
        <label class="toggle-row" for="prof" style="border-color:#f0cf9a;background:#fff9f0">
          <span class="t-txt"><b>⭐ רק שאלות המרצה (${PROF_COUNT})</b>השאלות המדויקות שהוצגו בכיתה</span>
          <span class="switch"><input type="checkbox" id="prof" ${state.profOnly?"checked":""}><span class="slider"></span></span>
        </label>
        <div style="${state.profOnly?'opacity:.4;pointer-events:none':''}">
          <p class="field-label">בחר יחידות לתרגול</p>
          <div class="chips" id="chips">${chips}</div>
        </div>
        <label class="toggle-row" for="shf">
          <span class="t-txt"><b>ערבוב שאלות ותשובות</b>סדר אקראי בכל סבב</span>
          <span class="switch"><input type="checkbox" id="shf" ${state.shuffle?"checked":""}><span class="slider"></span></span>
        </label>
        <div class="start-meta">
          <span class="count">${total} שאלות נבחרו</span>
          <button class="btn btn-primary" id="startBtn" ${total?"":"disabled"}>התחל תרגול ←</button>
        </div>
      </div>
    </div>
    <p class="foot">מבחן: 13.8.26 · אמריקאי · חומר פתוח <b>מודפס בלבד</b> (אין מחשבים) · ללא חישובים</p>
  </div>`;
  document.getElementById("chips").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b)return;
    const u=+b.dataset.unit;
    state.selectedUnits.has(u)?state.selectedUnits.delete(u):state.selectedUnits.add(u);
    renderStart();
  });
  document.getElementById("prof").addEventListener("change",e=>{state.profOnly=e.target.checked;renderStart();});
  document.getElementById("shf").addEventListener("change",e=>{state.shuffle=e.target.checked;});
  document.getElementById("startBtn").addEventListener("click",startQuiz);
}
function startQuiz(){
  let pool=state.profOnly?QUESTIONS.filter(q=>q.prof):QUESTIONS.filter(q=>state.selectedUnits.has(q.u));
  if(!pool.length)return;
  if(state.shuffle)pool=shuffle(pool);
  pool=pool.map(shuffleOptions);
  state.pool=pool;state.idx=0;state.score=0;state.answered=false;state.log=[];
  renderQuestion();
}
function renderQuestion(){
  const q=state.pool[state.idx], info=UNITS[q.u];
  const pct=Math.round(state.idx/state.pool.length*100);
  main.innerHTML=`<div class="wrap">
    <div class="qhead"><div class="qhead-in">
      <span class="counter">שאלה ${state.idx+1}/${state.pool.length}</span>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <span class="score-chip">✓ ${state.score}</span>
    </div></div>
    <div class="card">
      <span class="badge" style="background:${info.hex}">${q.u===6?esc(info.name):"יחידה "+q.u+" · "+esc(info.name)}</span>${q.prof?'<span class="badge badge-prof">⭐ שאלת מרצה</span>':''}${q.past?'<span class="badge badge-past">📎 ממבחן קודם</span>':''}${q.cut?'<span class="badge badge-cut">⬜ ירד מהמיקוד</span>':''}
      <div class="scenario">${esc(q.s)}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lt">${LETTERS[i]}</span><span class="ot">${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <div class="nav" id="nav"><span class="hint">בחר/י תשובה</span></div>
    </div>
  </div>`;
  document.getElementById("opts").addEventListener("click",onAnswer);
}
function onAnswer(e){
  if(state.answered)return;
  const btn=e.target.closest(".opt"); if(!btn)return;
  const chosen=+btn.dataset.i, q=state.pool[state.idx];
  state.answered=true;
  const ok=chosen===q.a; if(ok)state.score++;
  state.log.push({u:q.u,correct:ok});
  document.querySelectorAll(".opt").forEach(o=>{
    const i=+o.dataset.i; o.disabled=true;
    if(i===q.a){o.classList.add("correct");o.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>');}
    else if(i===chosen){o.classList.add("wrong");o.insertAdjacentHTML("beforeend",'<span class="mark">✗</span>');}
  });
  document.getElementById("fb").innerHTML=`<div class="explain ${ok?'ok':'no'}"><b>${ok?"נכון!":"לא נכון — התשובה הנכונה: "+LETTERS[q.a]}</b>${esc(q.e)}</div>`;
  const last=state.idx===state.pool.length-1;
  document.getElementById("nav").innerHTML=`<span class="hint">${state.score} מתוך ${state.idx+1} עד כה</span><button class="btn btn-primary" id="nextBtn">${last?"סיום וסיכום ←":"הבא ←"}</button>`;
  const nb=document.getElementById("nextBtn");
  nb.addEventListener("click",()=>{
    if(last)renderResults();
    else{state.idx++;state.answered=false;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
  });
  nb.focus();
}
function renderResults(){
  const total=state.pool.length, pct=Math.round(state.score/total*100);
  const msg=pct>=85?"מצוין! אתה מוכן למבחן 💪":pct>=65?"יפה מאוד — עוד חזרה קטנה ואתה שם":"כדאי לחזור על החומר ולנסות שוב";
  const byU={}; state.log.forEach(l=>{(byU[l.u]=byU[l.u]||{c:0,t:0});byU[l.u].t++;if(l.correct)byU[l.u].c++;});
  const rows=Object.keys(byU).sort().map(u=>{
    const d=byU[u],p=Math.round(d.c/d.t*100),info=UNITS[u];
    return `<div class="bd-row"><div class="bd-name"><span class="dot" style="background:${info.hex}"></span>יחידה ${u} · ${esc(info.name)}</div><div class="bd-val">${d.c}/${d.t}</div><div class="bd-bar"><i style="width:${p}%;background:${info.hex}"></i></div></div>`;
  }).join("");
  main.innerHTML=`<div class="wrap">
    <div class="result">
      <div class="result-top"><div class="ring" style="--v:${pct}"><i>${pct}%</i></div><h2>${state.score} מתוך ${total}</h2><p>${msg}</p></div>
      <div class="breakdown"><p class="field-label" style="text-align:right">פירוט לפי יחידה</p>${rows}</div>

[1,"ייצוג מספרי בקואורדינטות. שלוש ישויות בסיסיות: נקודות — עמודי תאורה, אנטנות, בארות. קווים — כבישים, נהרות, פסי רכבת, צינורות. ופוליגונים, כלומר שטחים — מבנים, מגרשים, ייעודי קרקע."],
[0,"והיתרון?"],
[1,"שאפשר לבצע עליו חישובים ומניפולציות, והתצוגה דינמית — אפשר להתקרב ולהתרחק בלי לאבד דיוק."],
[0,"אז אם בשאלה מופיע ״תצלום אוויר״ —"],
[1,"זה ראסטר. ואם מופיע ״פוליגונים עם קואורדינטות״ — זה וקטור. זה כמעט תמיד ההבדל שהשאלה בודקת."],
[0,"שלושת מרכיבי המידע הגאוגרפי?"],
[1,"גיאומטריה — המיקום והצורה במרחב. מאפיינים — הנתונים בטבלה, כמו שם רחוב או מספר נתיבים. וחוקים או התנהגות — יחסים מרחביים וכללי היגיון, למשל שרחוב מקומי וכביש מהיר לא אמורים להצטלב סתם."],
[0,"מה זה עיגון תמונה?"],
[1,"תמונות ראסטר בדרך כלל לא מכילות מידע גאוגרפי, ולפעמים גם צולמו בזווית לא מתאימה. עיגון תמונה הוא לסובב, להגדיל ולהתאים את התמונה למערכת הקואורדינטות של העולם האמיתי."],
[0,"נעבור לניתוח. יש שלושה סוגים."],
[1,"קרבה, שכבות־על, ורשת. ואת שלושתם צריך לדעת להבדיל."],
[0,"קרבה?"],
[1,"מרחק ממאפיין. אילו חלקות נמצאות בטווח חמישים מטר מהכביש? אילו אזורים בסכנת שיטפון לפי קרבה לנהרות?"],
[0,"שכבות־על?"],
[1,"הצלבה של כמה שכבות באותו מרחב. למשל: כל הבארות מסוג מסוים, שנמצאות בקרקע חולית, ובעלות מבנה מסוים. כל תנאי הוא שכבה אחרת."],
[0,"ורשת?"],
[1,"ניתוח לאורך רשת קווית. המסלול הקצר מבית חולים לזירת תאונה — תוך התחשבות בגובה גשרים ובמשקל מותר."],
[0,"אז המילה המפתחית בשאלה תהיה ״מרחק״, ״הצלבה״ או ״מסלול״."],
[1,"בדיוק כך. זה הטריק לזהות במבחן."],
[0,"מה עם קנה מידה? זה מבלבל."],
[1,"מבלבל, כי זה הפוך מהאינטואיציה. מספר קטן במכנה זה קנה מידה גדול, וזה יותר פירוט. באחד לחמש מאות, עיר תופיע כפוליגון. באחד למאתיים חמישים אלף — קנה מידה קטן — אותה עיר תופיע כנקודה."],
[0,"אבל המידע עצמו לא השתנה."],
[1,"נכון, הכל נמצא במערכת. זה רק עניין של תצוגה."],
[0,"בוא נעבור ל־GPS.","בוא נעבור לג׳י פי אס."],
[1,"המערכת האמריקאית. עשרים וארבעה לוויינים, שישה מסלולים סביב כדור הארץ, ארבעה לוויינים בכל מסלול, בגובה של כעשרים אלף ומאתיים קילומטר. הוקמה על ידי משרד ההגנה האמריקאי."],
[0,"ואיך היא עובדת?"],
[1,"כל לוויין נושא שעון אטומי מדויק ומשדר אות שכולל את השעה ואת מיקומו. המקלט מחשב את המרחק מהלוויין לפי הזמן שלקח לאות להגיע."],
[0,"ופה מגיעה השאלה הקלאסית: למה צריך ארבעה לוויינים?"],
[1,"כי יש ארבעה נעלמים. שלוש קואורדינטות מרחב — אורך, רוחב וגובה — ובנוסף הזמן."],
[0,"למה הזמן נעלם? הרי לשעון האטומי יש זמן מדויק."],
[1,"ללוויין יש. למקלט שלכם — לא. בטלפון אין שעון אטומי, ולכן יש סטייה בשעון המקלט, והיא נעלם רביעי. ארבעה נעלמים דורשים ארבע משוואות, ולכן ארבעה לוויינים."],
[0,"וזה נקרא טריאנגולציה."],
[1,"חישוב נקודה במרחב על ידי הצלבת מרחקים מכמה מקורות."],
[0,"יש מערכות נוספות?"],
[1,"גלילאו באירופה, גלונאס ברוסיה, ובייידו בסין."],
[0,"מה זה AGPS?","מה זה איי־ג׳י־פי־אס?"],
[1,"הבעיה עם ג׳י פי אס היא שהוא צריך לטעון את כל נתוני מיקומי הלוויינים לפני שהוא מתחיל לעבוד, וזה איטי — במיוחד כשהאות חלש. איי־ג׳י־פי־אס, כלומר ג׳י פי אס נעזר, מוריד את הנתונים האלה משרת אינטרנט במקום מהלוויין."],
[0,"וזה מאיץ את הנעילה הראשונה."],
[1,"שנקראת טי־טי־אף־אף, זמן לנעילה ראשונה. מתאים למכשירים סלולריים שיכולים להתחבר לאינטרנט, ובעיקר בערים."],
[0,"ועכשיו AVL, שזה מושג מרכזי לקורס.","ועכשיו איי־וי־אל, שזה מושג מרכזי לקורס."],
[1,"המשוואה פשוטה: איי־וי־אל שווה ג׳י פי אס ועוד ג׳י אי אס. איתור אוטומטי של כלי רכב. קופסה מתחברת לרכב, קולטת נתוני מיקום ומעבירה למוקד החברה — שמציג אותם על מפה."],
[0,"ומה זה נותן בפועל?"],
[1,"ארבעה דברים. הצגת כל הצי על מפה. שילוח דינמי — לבדוק מי פנוי וקרוב ולשלוח אותו, למשל אמבולנס. אזורים מגודרים, ג׳יאופנסינג — התראה כשרכב נכנס או יוצא מאזור מוגדר. ותקשורת עם כלי הרכב, כולל מעקב מלאי בשילוב אר־אף־איי־די."],
[0,"אז אם בשאלה מופיע ״לראות איפה המשאיות ולקבל התראה על יציאה מאזור״ —"],
[1,"זה איי־וי־אל. וזו התשובה, לא אר־אף־איי־די לבדו."],
[0,"נסיים באיכון בתוך מבנים."],
[1,"בתוך מבנים אותות הג׳י פי אס חלשים או לא זמינים בכלל, ולפעמים גם צריך דיוק גבוה יותר. לכן משתמשים בחיישנים שכבר יש בטלפון — מצפן, מד תאוצה, ג׳ירוסקופ, מד צעדים ומד גובה."],
[0,"ובנוסף?"],
[1,"וויי־פיי — הטלפון קולט נקודות גישה ממופות ולפי עוצמת האות עושה מעין טריאנגולציה. ובלוטות׳, ובעיקר בי־אל־אי, שהטווח שלו כחמישים מטר."],
[0,"ומה היתרון של בלוטות׳ על וויי־פיי?"],
[1,"צריכת אנרגיה נמוכה בהרבה. וזה מוביל לסדר שכדאי לזכור, מהחסכוני לבזבזני: בי־אל־אי, שנותן בערך מאה ימי סוללה. אחריו בלוטות׳ 2.1. אחר כך מערכת ניווט אינרציאלית. אחר כך וויי־פיי. ובסוף — ג׳י פי אס, שנותן שעה עד שעתיים וחצי בלבד."],
[0,"אז ג׳י פי אס הכי מדויק בחוץ, והכי יקר באנרגיה."],
[1,"בדיוק. וזה הטרייד־אוף. סיכום הפרק: אויילר וזוגיות הדרגות. ראסטר מול וקטור. חמישה מרכיבים ולא שישה שלבים. שלושה סוגי ניתוח. ארבעה לוויינים בגלל ארבעה נעלמים. ואיי־וי־אל שווה ג׳י פי אס ועוד ג׳י אי אס."],
[0,"מושלם. בפרק הבא — זרימה ברשתות, ושם מתחילות הבעיות המעניינות באמת."]
]},

{n:3,u:3,title:"ספקים, לקוחות, וצוואר הבקבוק",tag:"יחידה 3 · זרימה ברשתות",lines:[
[0,"פרק שלישי — זרימה ברשתות. רועי, זו היחידה הכי כבדה בקורס?"],
[1,"היא הכי צפופה בשאלות. שתיים מתוך שמונה שאלות המרצה מגיעות מכאן. אבל החדשות הטובות: הכל בנוי על אותו רעיון אחד."],
[0,"שהוא?"],
[1,"שרשת היא גרף שבו לכל קודקוד יש מאזן. מקור — כלומר ספק או מפעל — הוא חיובי, כי יוצאת ממנו סחורה. יעד — לקוח — הוא שלילי, כי נכנסת אליו. ונקודת מעבר היא אפס: מה שנכנס שווה למה שיוצא."],
[0,"ועל הקשתות?"],
[1,"מספר שמייצג קיבולת, אורך או עלות נסיעה. לפעמים גם חסם תחתון — למשל חוזה שמחייב להעביר כמות מינימלית, או תעלה שלא רוצים שתתייבש."],
[0,"למה הקיבולת כל כך חשובה?"],
[1,"כי היא משפיעה גם על הכמות וגם על הזמן. וזה קריטי בפינוי חירום — דרכי מילוט, נקודות פינוי ברעידת אדמה או בצונאמי. לקיבולת הכביש יש חשיבות עצומה לקצב הפינוי."],
[0,"בוא נתחיל בבעיה הפשוטה ביותר — בעיית התובלה."],
[1,"יש ספקים, יש לקוחות, ומדובר באותו מוצר. כל ספק יכול לספק לכל לקוח, ולכל שילוח יש עלות. השאלה: כמה להעביר מכל ספק לכל לקוח, כך שסך עלות ההובלה תהיה מינימלית."],
[0,"והערה חשובה — מרחק זה לא עלות."],
[1,"נכון, וזה שווה זכירה. מרחק אינו שקול במאה אחוז לעלות. יש עלויות שדה תעופה, דלק, אגרות. טיסה לקפריסין יכולה להיות יקרה מטיסה לפריז, אף שהיא קצרה בהרבה."],
[0,"עכשיו — המאזן. זה הנושא הכי נשאל ביחידה."],
[1,"בעיה מאוזנת היא בעיה שבה סך ההיצע שווה לסך הביקוש. וזה התנאי שהמודל מניח."],
[0,"ומה אם לא?"],
[1,"אז מאזנים אותה, ויש שני מקרים סימטריים. אם ההיצע גדול מהביקוש — יש עודף סחורה שאף אחד לא לוקח — מוסיפים לקוח פיקטיבי, יעד דמה, שסופג את העודף. עלויות ההובלה אליו: אפס."],
[0,"ואם הביקוש גדול מההיצע?"],
[1,"הפוך בדיוק. יש חוסר, ולכן מוסיפים ספק פיקטיבי, מקור דמה, שמספק את החוסר — שוב בעלות אפס."],
[0,"יש דרך פשוטה לזכור?"],
[1,"תשאלו מה חסר. אם חסר מי שיקלוט — תוסיפו לקוח. אם חסר מי שיספק — תוסיפו ספק. אתם מוסיפים בדיוק את מה שאין."],
[0,"ומה בטוח לא קורה?"],
[1,"וזה חשוב כי אלו ההסחות בשאלה. המודל לא הופך ללא־פתיר. פונקציית המטרה לא הופכת לשלילית. ולא, לא כל הספקים שולחים הכל ללקוח הזול."],
[0,"בוא נעבור לשיטעון."],
[1,"אותו רעיון, אבל עכשיו הסחורה לא עוברת ישירות מהספק ללקוח. יש נקודות ביניים — מחסנים, מרלו״גים, נמלים — שדרכם היא עוברת בדרך ליעד."],
[0,"וההבדל המהותי בין תובלה לשיטעון?"],
[1,"זו בדיוק שאלת המרצה, אז שימו לב לניסוח: בתובלה הזרימה ישירה ממקור ליעד. בשיטעון יש קודקודי ביניים שבהם סך הזרימה הנכנסת חייבת להיות שווה לסך היוצאת."],
[0,"וזה נקרא שימור זרימה."],
[1,"שימור זרימה. המאזן בקודקוד המעבר הוא אפס. וגם — מניחים שם קיבולת גדולה מאוד, מעין חוצץ, כדי שהסחורה תוכל לזרום דרכו."],
[0,"במבחן יופיעו הסחות."],
[1,"ותכירו אותן. יגידו לכם שההבדל הוא שאחת נפתרת בסולבר והשנייה בהיוריסטיקה — לא נכון. או שההבדל הוא ההנחה על שטח אחסון אינסופי — זו הנחה טכנית של המודל, אבל היא לא ההבדל המהותי. ההבדל המהותי הוא קודקודי המעבר ושימור הזרימה."],
[0,"מה עם בעיית השיבוץ?"],
[1,"זה מקרה פרטי יפה של בעיית התובלה. יש ארבעה מהנדסים וארבעה פרויקטים, וכל אחד מקבל בדיוק אחד."],
[0,"ולמה זה מקרה פרטי?"],
[1,"כי כל היצע שווה אחד וכל ביקוש שווה אחד. התאמה אחד לאחד, עם משתנים בינאריים. זו אותה בעיה בדיוק, רק עם המספרים הפשוטים ביותר."],
[0,"עכשיו זרימה מקסימלית. במה זה שונה?"],
[1,"פה כבר לא מחפשים עלות מינימלית אלא כמות מקסימלית. המספרים על הקשתות הם קיבולת, והשאלה היא כמה אפשר להעביר ממקור ליעד — כשמשתמשים בכל הרשת בו־זמנית, לא במסלול אחד."],
[0,"יש חסם ראשוני מהיר?"],
[1,"תסתכלו מה יוצא מהמקור ומה נכנס ליעד. אם מהמקור יוצאות קשתות בקיבולת 5 ועוד 7 ועוד 4, כלומר 16, ואל היעד נכנסות 9 ועוד 6, כלומר 15 — הזרימה לא תוכל לעבור 15."],
[0,"והאלגוריתם?"],
[1,"פורד־פולקרסון, בארבעה צעדים. מוצאים מסלול אוגמנטי כלשהו מהמקור ליעד שבו הזרימה השיורית בכל הקשתות גדולה מאפס. מזהים את הקיבולת המינימלית באותו מסלול — צוואר הבקבוק. מפחיתים אותה מהקשתות הישרות ומוסיפים לקשתות ההפוכות. וחוזרים עד שאין יותר מסלולים."],
[0,"והתשובה?"],
[1,"סכום כל הכמויות שהעברנו בכל הסבבים."],
[0,"רגע — קשתות הפוכות. למה בכלל צריך אותן?"],
[1,"זו שאלה מצוינת, וזה החלק הכי לא־אינטואיטיבי. הקשת ההפוכה מאפשרת ״לבטל״ זרימה שהוקצתה בטעות בצעד קודם ולנתב אותה מחדש."],
[0,"יש דוגמה?"],
[1,"יש, מהמצגת. רשת קטנה שבה כל הקיבולות שוות אחד. אם בוחרים מסלול מסוים דרך האמצע, הוא חוסם את הרשת ונראה שסיימנו. הקשת החוזרת היא שמאפשרת לתקן את הבחירה ולהגיע לזרימה המקסימלית האמיתית."],
[0,"אז הקשתות ההפוכות לא מוסיפות זרימה — הן מוסיפות אפשרויות."],
[1,"ניסוח מדויק."],
[0,"ומה אם יש כמה מקורות וכמה יעדים?"],
[1,"מוסיפים סופר־מקור וסופר־יעד דמיוניים, בקיבולת אינסופית, ומחברים אותם לכל הנקודות הרלוונטיות. זה לא משנה את התוצאה, כי היא נקבעת לפי הצווארים האמיתיים — ומאפשר להשתמש באותו אלגוריתם בדיוק."],
[0,"ועכשיו החתך המינימלי."],
[1,"חתך הוא קבוצת קשתות שאם מוחקים אותן, לא נשאר מסלול מהמקור ליעד. ערך החתך הוא סך הקיבולות שלהן. ומחפשים את החתך בעל הערך המינימלי."],
[0,"והמשפט?"],
[1,"משפט מקס־פלואו מין־קאט: ערך הזרימה המקסימלית שווה לערך החתך המינימלי. אלו שתי בעיות דואליות — שני צדדים של אותו מטבע."],
[0,"מה זה אומר אינטואיטיבית?"],
[1,"שהרשת חזקה בדיוק כמו צוואר הבקבוק שלה. אי אפשר להעביר יותר ממה שהחלק הצר מרשה."],
[0,"ואיך מוצאים את החתך בפועל?"],
[1,"פותרים קודם את הזרימה המקסימלית. הקשתות של החתך הן אלו שהזרימה בהן שווה לקיבולת — הקשתות הרוויות."],
[0,"נסיים במינימום עלות."],
[1,"זו הבעיה הכללית שממנה תובלה ושיטעון הן מקרים פרטיים. יש עלויות על הקשתות, יש מאזנים בקודקודים, ולפעמים גם אילוצי קיבולת. פונקציית המטרה היא סכום של כמות כפול עלות על כל קשת, ורוצים מינימום."],
[0,"והאילוצים?"],
[1,"היצע, ביקוש, שימור זרימה בקודקודי המעבר, אי־שליליות, ולפעמים שלמות — כשמובילים פריטים בודדים ולא נוזלים."],
[0,"למה בכלל צריך אילוצים?"],
[1,"שאלה שהמרצה שאל בכיתה, והתשובה חדה: בלי אילוצים אפשר להציב אפס בכל המשתנים ולקבל עלות אפס. מושלם — חוץ מזה שלא עבר כלום. האילוצים הם מה שמכריח אותנו באמת לספק."],
[0,"ומה עם אקסל וסולבר?"],
[1,"נשימה עמוקה — המרצה אמר במפורש שלא תהיה שאלה כזאת במבחן. הסולבר נדרש רק לתרגיל ההגשה. במבחן צריך רק להבין איך זה עובד."],
[0,"סיכום הפרק?"],
[1,"היצע גדול מביקוש — יעד פיקטיבי. ביקוש גדול מהיצע — מקור פיקטיבי, שניהם בעלות אפס. תובלה מול שיטעון — קודקודי מעבר ושימור זרימה. שיבוץ — תובלה עם היצע וביקוש שווים לאחד. וזרימה מקסימלית שווה לחתך מינימלי."],
[0,"בפרק הבא — איפה לשים את המחסן."]
]},

{n:4,u:4,title:"איפה לשים את המחסן",tag:"יחידה 4 · מיקום מתקנים",lines:[
[0,"פרק רביעי — מיקום מתקנים. רועי, הבעיה בשורה אחת?"],
[1,"למצוא מיקום אופטימלי למתקן — מרלו״ג, מפעל, תחנת כיבוי אש, מוקד שילוח — כשלכל אחד המטרות והאילוצים שלו."],
[0,"יש דוגמה יפה מהשיעור, של סן פרנסיסקו."],
[1,"מריצים ניתוח ג׳י אי אס ומקבלים מפת חום של זמני הגעה לבתי החולים הקיימים — חמש דקות, עשר, עשרים. ואז מחפשים את האזורים הצהובים."],
[0,"כלומר לא מתחרים בבתי החולים הקיימים."],
[1,"בדיוק ההפך. מחפשים איפה רמת השירות נמוכה וזמני ההגעה ארוכים — ושם ממקמים את המתקן החדש, כדי להרחיב את הכיסוי. זה הרעיון של כל היחידה."],
[0,"בוא נעבור על סוגי המתקנים."],
[1,"מרכז הפצה — אחסון והפצה ליעד הסופי, ובנוסף פעולות משלימות כמו איחוד ואריזה. מחסן — לאחסון בלבד. וקרוס־דוקינג — מעבר סחורה בלי אחסון בכלל, ישירות מעמדת פריקה לעמדת טעינה."],
[0,"ההבדל בין השלושה הוא בעצם כמה זמן הסחורה נשארת."],
[1,"ניסוח מצוין. מחסן — נשארת. מרכז הפצה — נשארת ומטופלת. קרוס־דוקינג — לא נשארת בכלל."],
[0,"ויש עוד?"],
[1,"נמלים — הובלה ארוכת טווח, יבוא ויצוא, ממשק לאמצעי תובלה נוספים. מסופים — אינטרמודליים, מסוף צובר, מסוף רכזת, מסוף עירוני. ומרכז לוגיסטי משולב, שזה כבר פארק תעשייתי או ״עיר״ לוגיסטית."],
[0,"אילו גורמים משפיעים על הבחירה?"],
[1,"נגישות לשווקים שאיתם עובדים. נגישות לרשת התחבורה — כבישים ארציים, שדות תעופה. אילו אמצעי הובלה קיימים באזור. כוח אדם. תשתיות ומתקנים מתאימים. תקנות, מיסוי וסיוע ציבורי. ובארצות הברית גם מזג אוויר — אזורי הוריקן וטורנדו."],
[0,"נדבר על לוגיסטיקה עירונית לרגע."],
[1,"מרכזים לוגיסטיים בתוך העיר יוצרים רעש, עבודה מסביב לשעון, תנועת כלי רכב רבה, תאונות וזיהום. אבל מרלו״ג מחוץ לעיר יוצר בעיה הפוכה — נגישות."],
[0,"אז מה עושים?"],
[1,"מגבילים תנועה ברחובות מסוימים בשעות מסוימות. מספקים מחוץ לשעות הפעילות — מוקדם בבוקר או מאוחר בערב. מגדירים חלונות זמן לכניסה לעיר. ומייעלים את הפריקה עצמה."],
[0,"מה זה חלון זמן?"],
[1,"פרק הזמן שבו אמורים לתת שירות ללקוח. תחשבו על סופרמרקט שמקבל סחורה מעשרות ספקים — אם כולם יגיעו בשמונה בבוקר זה קורס. אז מחלקים אותם לחלונות. וזכרו את המושג — הוא חוזר ביחידה 5 כהרחבה של ניתוב רכבים."],
[0,"עכשיו הטרייד־אוף המרכזי של היחידה."],
[1,"וזה כנראה הגרף החשוב ביותר כאן. ככל שמתרחקים מאזורים עירוניים, עלויות הקרקע יורדות. אבל במקביל מתרחקים מהשווקים, והשינוע מתייקר."],
[0,"שתי עקומות מנוגדות."],
[1,"ואם מחברים אותן מקבלים עקומת U. העלות הכוללת המינימלית מתקבלת בנקודת ביניים — לא הכי קרוב לשוק, ולא הכי רחוק ממנו.","ואם מחברים אותן מקבלים עקומה בצורת האות יו. העלות הכוללת המינימלית מתקבלת בנקודת ביניים — לא הכי קרוב לשוק, ולא הכי רחוק ממנו."],
[0,"וזו בדיוק שאלת מבחן."],
[1,"קלאסית. יציעו לכם ״הכי קרוב לשוק כי ההובלה זולה״ או ״הכי רחוק כי הקרקע זולה״. שתיהן שגויות — התשובה היא תמיד נקודת האיזון."],
[0,"בוא נעבור לסיווג המודלים. יש כמה זוגות."],
[1,"ארבעה. הראשון: בדיד מול רציף. בדיד — אפשר להתמקם רק במקומות מוגדרים מראש שצריך לבחור ביניהם. רציף — אפשר לבחור כל נקודה במרחב."],
[0,"יש את דוגמת מוכר הגלידה."],
[1,"אם מותר לו לעמוד בכל נקודה בחוף — מודל רציף. אם רק בעמדות מוגדרות — מודל בדיד."],
[0,"ויש הבדל מעשי חשוב."],
[1,"מאוד. במודל בדיד ייתכן שפשוט אין פתרון. אם דורשים מרלו״ג במרחק של עד מאה קילומטר מכל לקוח, והאפשרות היחידה רחוקה מאה ועשרים — אין פתרון בדיד. במודל רציף היינו ממקמים בדיוק בנקודת המאה."],
[0,"הזוג השני?"],
[1,"סטטי מול דינמי. סטטי — מיקומי הלקוחות, הכמויות וזהות הלקוחות קבועים, וזה מקל מאוד. דינמי — הכל משתנה כל הזמן."],
[0,"השלישי?"],
[1,"דטרמיניסטי מול סטוכסטי. דטרמיניסטי — הנתונים ידועים וקבועים. סטוכסטי — יש אקראיות, ואנחנו יודעים רק הסתברות וסטיית תקן, לא כמות מדויקת."],
[0,"והרביעי הוא אופן חישוב המרחק."],
[1,"שלוש שיטות. אוקלידי — קו אווירי. רקטילינארי — מדידה לאורך צירי איקס ו־וואי, כמו לנוע ברשת רחובות. ומפורש — לאורך הרשת בפועל בג׳י אי אס, וזה המדויק."],
[0,"ולכל אחת יש הטיה."],
[1,"וזו הנקודה. קו אווירי תמיד קצר מהמציאות — ולכן הוא הערכת חסר. אפשר לפצות: להגדיר ארבעים קילומטר אווירי כדי לקבל בערך חמישים בפועל. מדידה לאורך צירים דווקא ארוכה מהמסלול האמיתי — ולכן היא הערכה מחמירה."],
[0,"נעבור לחזית פארטו."],
[1,"בשנים האחרונות מדברים על בעיות עם יותר ממטרה אחת. למשל מינימום עלות מול מקסימום שביעות רצון לקוחות. ובדרך כלל הן פוגעות זו בזו — הורדת עלויות פוגעת בשירות."],
[0,"אז אין פתרון אחד."],
[1,"אין. פותרים את שתי הבעיות בו־זמנית ומקבלים סט של פתרונות — חזית פארטו. זה אוסף הפתרונות הלא־נשלטים: אלה שבהם אי אפשר לשפר מטרה אחת בלי לפגוע באחרת."],
[0,"ומה זה פתרון נשלט?"],
[1,"פתרון שיש פתרון אחר שטוב ממנו בכל המטרות, או טוב באחת ושווה בשאר. הוא נחות, ולכן הוא לא על החזית. כל הפתרונות שעל החזית ״טובים באותה מידה״, והארגון בוחר לפי ההעדפות שלו."],
[0,"טוב. מודלי המיקום. זו ההבחנה שהכי נשאלת ביחידה."],
[1,"שלושה עיקריים. פי־מדיאן — מזעור סכום המרחקים המשוקלל בביקוש, כלומר מרחק כפול ביקוש. זו מטרת עלות כוללת."],
[0,"מין־מקס?"],
[1,"מזעור המרחק אל הלקוח המרוחק ביותר. זו מטרת הוגנות ורמת שירות — הוא ״דואג לגרוע ביותר״."],
[0,"וכיסוי מקסימלי?"],
[1,"מקסום סך הביקוש המכוסה בתוך טווח כיסוי נתון, כשמספר המתקנים מוגבל. למשל: איפה לשים חמישה סניפים כדי שכמה שיותר לקוחות יהיו בטווח הליכה של חמש מאות מטר."],
[0,"יש עוד רביעי."],
[1,"האב אנד ספוקס — רשת היררכית עם מרכזי־על וחישורים. יעיל לקונסולידציה, וזה בדיוק המודל של חברות תעופה וחברות שילוח."],
[0,"ורועי — האם המודל שבוחרים באמת משנה את התוצאה?"],
[1,"לגמרי, ויש דוגמה מצוינת מהמצגת. חלופה א׳: מרחקים 5, 10, 20 — סכום 35. חלופה ב׳: 15, 10, 15 — סכום 40."],
[0,"אז לפי פי־מדיאן?"],
[1,"עדיפה חלופה א׳, כי 35 קטן מ־40."],
[0,"ולפי מין־מקס?"],
[1,"עדיפה חלופה ב׳, כי המקסימום שלה הוא 15 לעומת 20. אותם נתונים בדיוק, שתי תשובות הפוכות. זו הנקודה: השאלה ״איזה מודל״ היא בעצם השאלה ״מה חשוב לנו״."],
[0,"בוא נדבר על מיקום מתקן יחיד."],
[1,"כשיש לקוחות במיקומים ידועים ולכל אחד משקל — נניח כמות סטודנטים — משתמשים בשיטת החציון המשוקלל."],
[0,"איך זה עובד?"],
[1,"שלושה צעדים. ממיינים את הנקודות לפי ציר איקס בנפרד ולפי ציר וואי בנפרד. מחשבים את סך המשקלים ומחלקים בשתיים — זה החציון. ואז מוצאים את הנקודה שבה המשקל המצטבר עובר לראשונה את ערך החציון."],
[0,"יש דוגמת הספרייה."],
[1,"שש פקולטות עם משקלים, סך הכל 2040 — אז החציון הוא 1020. בציר איקס המשקל המצטבר עובר את 1020 בנקודה 6. בציר וואי הוא עובר אותה בנקודה 12. אז המיקום האופטימלי הוא שש, שתים־עשרה."],
[0,"ואז?"],
[1,"ואז בודקים אם בכלל אפשר לבנות שם, או שכבר יש מבנה קיים. המודל נותן נקודה, לא אישור בנייה."],
[0,"ורועי, מה הטעות הנפוצה כאן?"],
[1,"לחשוב שזה ממוצע. זה לא. הפתרון הוא חציון משוקלל — לא ממוצע ולא מרכז גיאומטרי. תסמנו את זה."],
[0,"מה זה גבול הפצה?"],
[1,"כשלקוח יכול להיות משורת משני מקורות — נניח ישירות מהמפעל, או ממרכז הפצה — גבול ההפצה הוא נקודת שוויון העלויות. המקום שממנו והלאה זול יותר לספק מהמקור השני."],
[0,"ונסיים בשאלה של המרצה."],
[1,"ג׳סט אין טיים. איך מעבר לג׳סט אין טיים משפיע על מיקום המחסנים ביחס ללקוחות?"],
[0,"והתשובה?"],
[1,"מחייב מיקום קרוב גיאוגרפית ללקוחות."],
[0,"למה? תן את ההיגיון, לא רק את התשובה."],
[1,"כי בג׳סט אין טיים אין מלאי חוצץ. מלאי הוא כרית ביטחון שסופגת עיכובים — ואם אין מלאי, כל עיכוב באספקה עוצר את הקו. לכן צריך אספקה מהירה, תכופה ואמינה, וזה אפשרי רק ממרחק קצר. מרחק גדול פשוט הורס את היכולת לספק בדיוק בזמן."],
[0,"סיכום הפרק?"],
[1,"עקומת U — המינימום בנקודת ביניים. פי־מדיאן זה סכום משוקלל, מין־מקס זה הלקוח המרוחק, כיסוי מקסימלי זה טווח נתון. מתקן יחיד — חציון משוקלל, לא ממוצע. חזית פארטו — פתרונות לא־נשלטים. וג׳סט אין טיים — קרוב ללקוח.","עקומה בצורת האות יו — המינימום בנקודת ביניים. פי־מדיאן זה סכום משוקלל, מין־מקס זה הלקוח המרוחק, כיסוי מקסימלי זה טווח נתון. מתקן יחיד — חציון משוקלל, לא ממוצע. חזית פארטו — פתרונות לא־נשלטים. וג׳סט אין טיים — קרוב ללקוח."],
[0,"מעולה. בפרק הבא — ניתוב רכבים, ושם יושבות ארבע משאלות המרצה."]
]},

{n:5,u:5,title:"דייקסטרה, סוכן נוסע, ולמה זה קשה",tag:"יחידה 5 · ניתוב רכבים",lines:[
[0,"פרק חמישי — ניתוב רכבים. רועי, זו היחידה עם הכי הרבה שאלות מרצה."],
[1,"ארבע מתוך שמונה. וזו גם היחידה שהכי קל להתבלבל בה, כי יש בה חמש בעיות שנשמעות דומות ומתכוונות לדברים שונים לגמרי."],
[0,"אז נעשה סדר. איך מייצגים?"],
[1,"בגרף. קודקודים הם צמתים, קשתות הם כבישים, ולכל קשת מספר שנקרא משקל. והמשקל יכול לייצג מה שרוצים: מרחק, זמן נסיעה, עלות, עומס או קיבולת."],
[0,"ופה יש הערה חשובה של המרצה."],
[1,"כן. כשאומרים ״המסלול הקצר ביותר״ — זה לא תמיד באמת הקצר. תלוי לגמרי במה שהמספרים מייצגים. אם המשקלים הם זמן, המסלול ״הקצר״ הוא המהיר, והוא יכול להיות ארוך יותר בקילומטרים."],
[0,"בוא נתחיל בבעיית המסלול הקצר ביותר."],
[1,"נקודת מוצא, נקודת יעד, ומחפשים את המסלול הזול ביותר במונחי זמן, מרחק או עלות. זה בדיוק וייז וגוגל מפות. ואגב, ייתכנו גם שני מסלולים באותו אורך בדיוק."],
[0,"ומה זה K מסלולים קצרים?","ומה זה קיי מסלולים קצרים?"],
[1,"במקום מסלול אחד — סט של קיי מסלולים חלופיים."],
[0,"וזו שאלת מרצה, נכון? מה הערך התפעולי?"],
[1,"חלופות גיבוי מוגדרות מראש. תחשבו על היערכות לחירום ותכנון נתיבי פינוי — אי אפשר לתכנן רק נתיב אחד, כי ייתכן שהוא בדיוק לא יהיה זמין. אז מכינים סט מראש, ואם הקצר ביותר חסום — עוברים מיד לבא בתור."],
[0,"תשומת לב אחת: זה לא צמצום המייל האחרון."],
[1,"נכון, וזו הסחה בשאלה. הערך הוא גיבוי וזמינות, לא ייעול המייל האחרון ולא הפיכת הבעיה לתכנון לינארי."],
[0,"עכשיו — דייקסטרה."],
[1,"פותח ב־1959 על ידי מדען המחשב ההולנדי אדסחר דייקסטרה. אלגוריתם ישן, פשוט, קל להבנה — ומשתמשים בו עד היום."],
[0,"ופה יש נקודה שמפתיעה הרבה סטודנטים."],
[1,"מאוד. דייקסטרה לא מחשב מסלול מקודקוד אחד לקודקוד שני. הוא מוצא בבת אחת את אוסף המסלולים הקצרים מקודקוד המוצא לכל שאר הקודקודים."],
[0,"כלומר אין בכלל הגדרת יעד."],
[1,"אין. בגרף עם שישה קודקודים תקבלו חמישה מסלולים. הוא פותר לכל היעדים האפשריים בבת אחת. זה נקרא מקור יחיד."],
[0,"מה הצעדים?"],
[1,"אתחול — לקודקוד המוצא מרחק אפס, ולכל השאר אינסוף, כי עדיין לא יודעים איך להגיע אליהם. בחירה — מבין הקודקודים שטרם טופלו בוחרים את זה שהמרחק אליו הקצר ביותר, וזה הצעד החמדני. עדכון — בוחנים את השכנים שלו: אם המרחק החדש קטן מהרשום, מוחקים ורושמים את החדש. ואם גדול — לא נוגעים. וחוזרים."],
[0,"ואיך מסמנים על הגרף?"],
[1,"ליד כל קודקוד רושמים מרחק לוכסן קודקוד־אב. למשל שבע לוכסן וי־שש: המרחק המינימלי הוא שבע, והגענו לכאן מקודקוד וי־שש. ואת המסלול עצמו משחזרים בהליכה אחורה לפי קודקודי האב."],
[0,"עכשיו המגבלה — וזו שאלת מרצה."],
[1,"דייקסטרה לא מתמודד עם משקלים שליליים. וחשוב לדעת להסביר למה, כי זה מה שהשאלה בודקת."],
[0,"אז למה?"],
[1,"כי הוא חמדני. ברגע שקודקוד סומן כקבוע, האלגוריתם מניח שהמרחק אליו סופי ומינימלי — ולא חוזר אליו יותר. אם בהמשך הרשת יש קשת עם משקל שלילי שהייתה יכולה לפתוח מסלול קצר יותר, האלגוריתם כבר לא יעדכן אותו."],
[0,"אז הוא נועל מוקדם מדי."],
[1,"בדיוק. וזה בדיוק הניסוח שרוצים לראות: הוא נועל קודקוד כקבוע, ולא מעדכן אותו אחר כך."],
[0,"אבל בפועל זה לא ממש מפריע לנו."],
[1,"נכון, והמרצה אמר את זה במפורש: בעולם שלנו נדיר להיתקל במשקל שלילי — זמן, מהירות ומרחק אינם שליליים. ולכן האלגוריתם רלוונטי למרות המגבלה."],
[0,"בוא נדבר על ״חמדני״ כמושג."],
[1,"זו משפחה של אלגוריתמים, לא אלגוריתם ספציפי. עובדים בצעדים, ובכל צעד עושים את הפעולה שנותנת את מירב התועלת באותו רגע — בלי להסתכל על ההשפעה העתידית."],
[0,"והתוצאה?"],
[1,"תלויה בבעיה, וזו הנקודה. בדייקסטרה, כשאין משקלים שליליים, חמדני נותן אופטימום מלא. בסוכן הנוסע — רק פתרון מקורב. אותה גישה, שתי תוצאות."],
[0,"והיתרון?"],
[1,"מהיר, ולא צריך לסרוק את כל הפתרונות."],
[0,"עכשיו הסוכן הנוסע."],
[1,"משאית צריכה לעבור במספר נקודות ולחזור לנקודת המוצא, שזה המרלו״ג. בהינתן שאין אילוצים של עיתוי או סדר — מה סדר הקודקודים שייתן את המסלול הקצר ביותר?"],
[0,"וההגדרה הפורמלית?"],
[1,"מציאת מעגל המילטוני בעל משקל מינימלי. ושווה להפריד: מסלול המילטוני עובר בכל קודקודי הגרף פעם אחת בלבד. מעגל המילטוני — גם חוזר לקודקוד ההתחלה."],
[0,"ולמה זה קשה?"],
[1,"הבעיה שייכת ל־אן־פי־קשה. במדעי המחשב לא מצליחים למצוא אלגוריתם יעיל שפותר אותה. מספר האפשרויות גדל בקצב עצרתי — כבר בעשר ערים יש מיליוני מסלולים, והמעבר ממאה למאה ואחת הוא הכפלה במאה ואחת."],
[0,"אז הדרך היחידה לאופטימום היא לנסות הכל."],
[1,"וזה לא מעשי. זה נקרא כוח גס — המחשב מייצר את כל המסלולים, מחשב כל אחד ובוחר את הקצר. מבטיח אופטימום, ובלתי אפשרי בפועל."],
[0,"ולכן היוריסטיקות."],
[1,"והמפורסמת היא השכן הקרוב ביותר. היוריסטיקה חמדנית: בוחרים קודקוד התחלה, ובכל צעד עוברים לקודקוד הקרוב ביותר שטרם ביקרנו בו, עד שמסיימים."],
[0,"ומה מובטח לגבי האיכות?"],
[1,"יש חסם, וכדאי לזכור אותו: הפתרון של האלגוריתם לעולם לא גרוע מפי שניים מהאופטימום. הוא לא מובטח כאופטימלי — אבל הוא גם לא יכול להיות אסון."],
[0,"ויש נקודה יפה על נקודת ההתחלה."],
[1,"מאוד. מכיוון שזה מסלול מעגלי, אפשר להתחיל בכל נקודה. אבל שינוי נקודת ההתחלה יכול להוביל לתוצאה שונה לחלוטין — אף שהמסלול מבקר בדיוק באותן נקודות."],
[0,"אז זו גם דרך לשפר בפועל."],
[1,"בדיוק — מריצים מכמה נקודות התחלה ולוקחים את הטוב ביותר."],
[0,"עכשיו מחלק הדואר הסיני."],
[1,"וזו ההבחנה שהכי קל לפספס במבחן. בסוכן הנוסע חיפשנו מסלול שעובר בכל הקודקודים. כאן מחפשים מסלול שעובר בכל הקשתות."],
[0,"תגיד את זה שוב, זה חשוב."],
[1,"מחלק הדואר — כל הקשתות. סוכן נוסע — כל הקודקודים."],
[0,"ואיך מזהים בשאלה?"],
[1,"תשאלו את עצמכם מה צריך לכסות. אם צריך לעבור בכל הרחובות — טאטוא רחובות, איסוף אשפה, חלוקת דואר — אלה קשתות, אז זה מחלק הדואר. אם צריך להגיע לכל הלקוחות — אלה קודקודים, אז זה סוכן נוסע."],
[0,"ומה השאלה האמיתית במחלק הדואר?"],
[1,"לא בכל גרף אפשר לעבור בכל קשת בדיוק פעם אחת — וזוכרים למה, מהפרק על אויילר. ולא רוצים לעבור פעמיים כי זה עולה זמן וכסף. אז השאלה היא: על אילו קשתות צריך לעבור פעם נוספת, כך שהתוספת תהיה מינימלית."],
[0,"נסגר המעגל עם קניגסברג."],
[1,"בדיוק — אותה תורת גרפים, מאתיים ושמונים שנה אחר כך."],
[0,"ועכשיו VRP.","ועכשיו ניתוב רכבים."],
[1,"בסוכן הנוסע אין אילוצים מלבד פונקציית המטרה. אבל אם יש משאית והרבה לקוחות — ייתכן שפשוט לא יהיה מספיק מקום במשאית לכל הסחורה. ואז מוציאים עוד משאית."],
[0,"וזו שאלת המרצה: מה האילוץ שמתווסף במעבר מסוכן נוסע לניתוב רכבים?"],
[1,"קיבולת הרכב. וזו התשובה בשתי מילים."],
[0,"תן את ההיגיון."],
[1,"בסוכן הנוסע סוכן אחד עובר בין כל הלקוחות, ואין שום דבר שמונע זאת. בניתוב רכבים הקיבולת מאלצת אותנו לפצל — כמה רכבים, כמה מסלולים. וזה בדיוק מה שהופך את הבעיה לקשה יותר."],
[0,"וגם היא לא פתירה אופטימלית."],
[1,"לא. ולכן — וזו שאלת מרצה נוספת — כשיש מאה וחמישים לקוחות מעדיפים היוריסטיקה. פתרון מדויק ידרוש זמן חישוב עצום, בעוד שהיוריסטיקה נותנת פתרון קרוב תוך שניות."],
[0,"מה מאפיין בעיות ניתוב רכבים?"],
[1,"גודל הצי — רכב בודד או צי שלם. סוג הצי — הומוגני או הטרוגני, כולל רכבים מיוחדים כמו קירור, דלק או חומרים מסוכנים. מיקום כלי הרכב — מחסן אחד זה קל, כמה מחסנים זה כבר בעיה."],
[0,"למה כמה מחסנים זו בעיה?"],
[1,"כי אם רכב מסיים את היום במחסן השני, ייתכן שבמחסן הראשון לא יהיו רכבים למחר בבוקר. צריך לתכנן גם את החזרה."],
[0,"ועוד?"],
[1,"אופי הביקוש — דטרמיניסטי או סטוכסטי. סוג הרשת, ופה יש נקודה יפה: כביש דו־סטרי מכפיל את הרשת, כי ההלוך שונה מהחזור — וזה מקשה יותר מרשת חד־סטרית. מגבלות זמן ומרחק, כי לא רוצים משאית שנוסעת שעה לצד אחרת שנוסעת עשר. ועלויות — קבועות, משתנות, וקנסות."],
[0,"מה ההרחבות?"],
[1,"חלונות זמן — פרק הזמן שבו צריך להגיע ללקוח, ויכול להיות קשיח, גמיש או מרובה. בעיות דינמיות — ההזמנות נכנסות תוך כדי הנסיעה ואי אפשר לבנות מסלול מראש, כמו פיצרייה. דיאל־א־רייד, שזה שילוב של דינמי עם חלונות זמן, כלומר הסעות לפי דרישה. ואי־וי־אר־פי — ניתוב לרכבים חשמליים."],
[0,"ומה מיוחד ברכבים חשמליים?"],
[1,"שני דברים: צריך להתחשב במיקום תחנות הטעינה, והטעינה עצמה אורכת הרבה יותר זמן מתדלוק. זה כבר לא ״עצירה קצרה״ — זה חלק מהמסלול."],
[0,"ולפני שנסיים — יש משהו שירד מהמיקוד."],
[1,"כן, שווה לומר את זה במפורש כדי לחסוך לכם זמן. אלגוריתם הסייווינגס של קלארק וורייט הופיע במצגת הישנה, אבל נחתך מהגרסה המעודכנת שהמרצה מסר כחומר למבחן. תכירו את השם כדי לא להיבהל — אל תשקיעו בו זמן לימוד."],
[0,"סיכום הפרק?"],
[1,"דייקסטרה — מקור יחיד, חמדני, נכשל במשקלים שליליים כי הוא נועל קודקוד ולא מעדכן. סוכן נוסע — כל הקודקודים, אן־פי־קשה. שכן קרוב — לא גרוע מפי שניים. מחלק הדואר — כל הקשתות. מסוכן נוסע לניתוב רכבים — מתווסף אילוץ הקיבולת. וקיי מסלולים קצרים — חלופות גיבוי."],
[0,"בפרק האחרון נעבור על שמונה שאלות המרצה ועל המלכודות."]
]},

{n:6,u:6,title:"שמונה שאלות המרצה והמלכודות",tag:"מיקוד · חזרה לפני המבחן",lines:[
[0,"פרק אחרון. רועי, זה הפרק לשמוע בדרך למבחן."],
[1,"בדיוק. לא נלמד פה חומר חדש — נעבור על מה שהמרצה סימן, ועל המלכודות שחוזרות."],
[0,"קודם — פורמט המבחן."],
[1,"מבחן אמריקאי, בין עשרים לעשרים וחמש שאלות, בחומר פתוח."],
[0,"והסגנון?"],
[1,"וזה הדבר החשוב ביותר להבין: שאלות יישום והבנה, לא הגדרות יבשות. נותנים תרחיש ושואלים מה קורה או מה עושים."],
[0,"אז לשנן הגדרות זו לא האסטרטגיה."],
[1,"לא מספיקה. צריך לדעת לזהות — ״התרחיש הזה הוא בעיה מסוג איקס״. וזה מה שאימנו בכל הפרקים."],
[0,"ומה לא יהיה?"],
[1,"אין חישובים. אין שאלות אקסל או סולבר — המרצה אמר את זה במפורש. ובלשונו: צריך רק להבין איך זה עובד."],
[0,"מה פחות קריטי?"],
[1,"חקר ביצועים ואלגוריתמים לחישוב. משקלים שליליים בדייקסטרה — ברמת ההרצה, לא ברמת ההסבר. ונושאים שהם ״רק להכיר״: הנדסת תעבורה, תכנון תחבורה וכלכלת תחבורה."],
[0,"טוב. שמונה השאלות. נעבור אחת אחת, ואחרי כל תשובה — ההיגיון."],
[1,"קדימה. אחת: תובלה לא מאוזנת. אם ההיצע גדול מהביקוש — מה עושים?"],
[0,"מוסיפים יעד או לקוח פיקטיבי, בעלות אפס."],
[1,"ואם הביקוש גדול מההיצע — מוסיפים מקור או ספק פיקטיבי, גם בעלות אפס. ההיגיון: מוסיפים בדיוק את מה שחסר. חסר מי שיקלוט — תוסיפו קולט. חסר מי שיספק — תוסיפו ספק."],
[0,"ושתי הסחות שכדאי לפסול מיד?"],
[1,"״המודל לא פתיר״ — לא נכון. ו״פונקציית המטרה הופכת לשלילית״ — גם לא."],
[0,"שתיים: תובלה מול שיטעון."],
[1,"בשיטעון יש קודקודי מעבר שבהם סך הזרימה הנכנסת שווה ליוצאת — שימור זרימה. בתובלה הזרימה ישירה ממקור ליעד."],
[0,"וההסחה?"],
[1,"״שיטעון מתעלם מאילוצי קיבולת ומניח אחסון אינסופי״. זו הנחת מודל טכנית שקיימת — אבל היא לא ההבדל המהותי. ההבדל הוא קודקודי המעבר."],

/* =============== PODCAST — player =============== */
const SPK=[
  {n:"נועה",cls:"a",pitch:1.14,rate:1.00},
  {n:"רועי",cls:"b",pitch:0.86,rate:0.97}
];
const podState={ep:0,i:-1,k:0,playing:false,rate:1,gen:0,voice:"",wd:0};

function podHeVoices(){
  let v=[]; try{v=speechSynthesis.getVoices()||[];}catch(e){v=[];}
  return v.filter(x=>/^(he|iw)\b|^(he|iw)-/i.test(x.lang||""));
}
function podPickVoice(){
  const hv=podHeVoices();
  if(!hv.length)return null;
  return hv.find(v=>v.name===podState.voice)||hv[0];
}
function podWords(t){return (String(t).match(/\S+/g)||[]).length;}
function podLen(ep){let w=0;for(const l of ep.lines)w+=podWords(l[2]||l[1]);return w/2.45;}
function podFmt(sec){const m=Math.floor(sec/60),s=Math.round(sec%60);return m+":"+String(s).padStart(2,"0");}

/* Chrome silently truncates utterances longer than ~15s, so each line is spoken
   as a few sentence-sized chunks instead of one long one. */
function podChunks(t){
  const sents=String(t).match(/[^.!?…]+[.!?…]*\s*/g)||[String(t)];
  const out=[]; let cur="";
  for(let s of sents){
    s=s.trim(); if(!s)continue;
    if(cur&&podWords(cur)+podWords(s)>26){out.push(cur);cur=s;}
    else cur=cur?cur+" "+s:s;
  }
  if(cur)out.push(cur);
  return out.length?out:[String(t)];
}

/* ---- transport ---- */
function podHalt(){ podState.gen++; clearTimeout(podState.wd); try{speechSynthesis.cancel();}catch(e){} }
function podKick(fn){ const g=podState.gen; setTimeout(()=>{ if(g===podState.gen)fn(); },70); }
function podStop(){ podHalt(); podState.playing=false; podState.i=-1; podState.k=0; podPaint(); }
function podPause(){ podHalt(); podState.playing=false; podPaint(); }
function podPlay(){
  if(!podPickVoice())return;
  podHalt(); podState.playing=true; podPaint();
  const i=podState.i<0?0:podState.i, k=podState.k;
  podKick(()=>podStart(i,k));
}
function podRestart(){ /* rate / voice changed mid-play */
  if(!podState.playing)return;
  const i=podState.i,k=podState.k;
  podHalt(); podState.playing=true;
  podKick(()=>podStart(i<0?0:i,k));
}
function podJump(i,keepPlaying){
  const ep=POD[podState.ep];
  if(i<0||i>=ep.lines.length)return;
  const wasPlaying=podState.playing;
  podHalt(); podState.i=i; podState.k=0;
  if(keepPlaying&&wasPlaying&&podPickVoice()){ podState.playing=true; podPaint(); podKick(()=>podStart(i,0)); }
  else{ podState.playing=false; podPaint(); }
}

function podStart(i,k){
  const ep=POD[podState.ep];
  if(i>=ep.lines.length){ podState.playing=false; podState.i=-1; podState.k=0; podPaint(); return; }
  podState.i=i; podPaint();
  const L=ep.lines[i];
  podChunk(i,podChunks(L[2]||L[1]),k||0,SPK[L[0]]);
}

function podChunk(i,chunks,k,sp){
  if(k>=chunks.length){ podState.k=0; podStart(i+1,0); return; }
  podState.k=k;
  const g=podState.gen, txt=chunks[k];
  const u=new SpeechSynthesisUtterance(txt);
  const v=podPickVoice(); if(v)u.voice=v;
  u.lang=(v&&v.lang)||"he-IL";
  u.rate=Math.max(.1,Math.min(2,podState.rate*sp.rate));
  u.pitch=sp.pitch;
  let fired=false;
  /* advance on the speech event itself — events are not throttled in background tabs */
  const done=()=>{ if(fired||g!==podState.gen)return; fired=true; clearTimeout(podState.wd); podChunk(i,chunks,k+1,sp); };
  u.onend=done; u.onerror=done;
  /* safety net: some browsers drop an utterance and never fire onend */
  const est=(podWords(txt)/2.45)/u.rate*1000+3000;
  podState.wd=setTimeout(()=>{
    if(fired||g!==podState.gen)return;
    fired=true;
    try{speechSynthesis.cancel();}catch(e){}
    setTimeout(()=>{ if(g===podState.gen)podChunk(i,chunks,k+1,sp); },70);
  },est*2.5);
  try{speechSynthesis.speak(u);}catch(e){done();}
}

/* ---- painting (targeted updates — never a full re-render while playing) ---- */
function podPaint(){
  if(view!=="pod")return;
  const ep=POD[podState.ep];
  document.querySelectorAll(".pod-line").forEach(n=>n.classList.toggle("is-now",+n.dataset.i===podState.i));
  if(podState.i>=0&&podState.playing){
    const cur=document.querySelector('.pod-line[data-i="'+podState.i+'"]');
    if(cur)cur.scrollIntoView({block:"center",behavior:"smooth"});
  }
  const bar=document.getElementById("podbar");
  if(bar)bar.style.width=(podState.i<0?0:((podState.i+1)/ep.lines.length*100))+"%";
  const pb=document.getElementById("podplay");
  if(pb){pb.textContent=podState.playing?"⏸":"▶";pb.title=podState.playing?"השהה":"נגן";}
  const pos=document.getElementById("podpos");
  if(pos)pos.textContent=podState.i<0?("· "+ep.lines.length+" שורות"):("שורה "+(podState.i+1)+" מתוך "+ep.lines.length);
}

function renderPod(){
  const ep=POD[podState.ep];
  const hv=podHeVoices();
  const has=hv.length>0;
  const voiceSel=hv.length>1
    ? '<select class="pod-sel" id="podvoice" title="קול">'+hv.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===podState.voice?" selected":"")+'>'+esc(v.name.replace(/\s*-\s*.*$/,""))+'</option>').join("")+'</select>'
    : "";
  const note = has ? "" :
    '<div class="pod-note"><b>לא נמצא קול עברי בדפדפן הזה</b> — ההשמעה מושבתת, אבל התמליל המלא זמין לקריאה ולהדפסה למטה. להפעלת ההקראה ב־Windows: הגדרות ← שעה ושפה ← שפה ואזור ← הוספת שפה ← עברית, לוודא שסומן ״דיבור״, ואז לרענן את הדף.</div>';

  main.innerHTML=`<div class="wrap">
  <div class="page-head">
    <div>
      <h1>🎧 פודקאסט הקורס</h1>
      <p>שישה פרקים — כל יחידה כשיחה בין נועה לרועי. אפשר להאזין דרך הדפדפן, לקרוא את התמליל, או שניהם יחד.</p>
    </div>
    <div class="actions"><button class="btn btn-ghost" id="podprint">הדפס תמליל</button></div>
  </div>

  <div class="pod-eps">${POD.map((e,i)=>`<button class="pod-ep${i===podState.ep?" is-on":""}" data-ep="${i}"><span class="dot" style="background:${UNITS[e.u].hex}"></span>${e.n}. ${esc(e.title)}</button>`).join("")}</div>

  <div class="pod-card">
    <div class="pod-top">
      <div class="kicker">פרק ${ep.n} · ${esc(ep.tag)}</div>
      <h2>${esc(ep.title)}</h2>
      <p>${ep.lines.length} שורות · כ־${podFmt(podLen(ep))} דקות האזנה</p>
    </div>
    <div class="pod-ctl">
      <button class="pod-btn" id="podprev" title="שורה קודמת"${has?"":" disabled"}>⏮</button>
      <button class="pod-play" id="podplay" title="נגן"${has?"":" disabled"}>▶</button>
      <button class="pod-btn" id="podnext" title="שורה הבאה"${has?"":" disabled"}>⏭</button>
      <button class="pod-btn" id="podstop" title="עצור"${has?"":" disabled"}>⏹</button>
      <div class="pod-meta">
        <span id="podpos">· ${ep.lines.length} שורות</span>
        ${voiceSel}
        <select class="pod-sel" id="podrate" title="מהירות דיבור"${has?"":" disabled"}>
          ${[["0.8","0.8×"],["0.9","0.9×"],["1","1×"],["1.1","1.1×"],["1.25","1.25×"],["1.5","1.5×"]].map(r=>`<option value="${r[0]}"${(+r[0])===podState.rate?" selected":""}>${r[1]}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="pod-prog"><i id="podbar" style="width:0"></i></div>
    ${note}
  </div>

  <div class="pod-tr" id="podtr">
    ${ep.lines.map((l,i)=>`<div class="pod-line" data-i="${i}"><span class="pod-who ${SPK[l[0]].cls}">${SPK[l[0]].n}</span><p>${esc(l[1])}</p></div>`).join("")}
  </div>

  <p class="foot">התמליל נכתב על בסיס החוברת והמיקוד של הקורס. ההקראה מתבצעת מקומית בדפדפן — לא נשלח מידע לשום שרת.</p>
</div>`;

  document.querySelector(".pod-eps").addEventListener("click",e=>{
    const b=e.target.closest(".pod-ep"); if(!b)return;
    const i=+b.dataset.ep; if(i===podState.ep)return;
    podHalt(); podState.playing=false; podState.i=-1; podState.k=0; podState.ep=i; renderPod();
  });
  document.getElementById("podtr").addEventListener("click",e=>{
    const l=e.target.closest(".pod-line"); if(!l)return;
    podJump(+l.dataset.i,true);
  });
  document.getElementById("podplay").addEventListener("click",()=>{podState.playing?podPause():podPlay();});
  document.getElementById("podstop").addEventListener("click",podStop);
  document.getElementById("podprev").addEventListener("click",()=>podJump(Math.max(0,podState.i-1),true));
  document.getElementById("podnext").addEventListener("click",()=>podJump(podState.i<0?0:podState.i+1,true));
  document.getElementById("podrate").addEventListener("change",e=>{podState.rate=+e.target.value;podRestart();});
  const vs=document.getElementById("podvoice");
  if(vs)vs.addEventListener("change",e=>{podState.voice=e.target.value;podRestart();});
  document.getElementById("podprint").addEventListener("click",()=>window.print());
  podPaint();
}

/* voices load asynchronously in Chrome — refresh once they arrive */
if(typeof speechSynthesis!=="undefined"&&speechSynthesis.addEventListener){
  speechSynthesis.addEventListener("voiceschanged",()=>{ if(view==="pod"&&!podState.playing)renderPod(); });
}

/* =============== ROUTER =============== */
function show(v){
  view=v;
  if(v!=="pod"){ podHalt(); podState.playing=false; podState.i=-1; }
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("is-on",t.dataset.view===v));
  if(v==="quiz")renderStart();
  else if(v==="pod")renderPod();
  else if(v==="book")renderBooklet();
  else if(v==="cheat")renderCheat();
  else if(v==="past")renderPast();
  else renderBank();
  window.scrollTo({top:0});
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(b)show(b.dataset.view);
});
show("quiz");
