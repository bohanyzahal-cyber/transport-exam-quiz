{u:5,bank:true,s:"ניתוב רכבים.",q:"מהי מטרת בעיית ניתוב הרכבים (VRP)?",o:["לתכנן מסלולים אופטימליים לרכבים תוך מזעור עלות, זמן או מרחק","למקסם את מספר הלקוחות לכל רכב","להקצות רכבים לפי רמות שירות","להפחית את מספר המרכזים הלוגיסטיים"],a:0,e:"VRP מחפש את קבוצת המסלולים הזולה ביותר שמשרתת את כל הלקוחות בכפוף לאילוצים (קיבולת, חלונות זמן). מקסום לקוחות לרכב אינו המטרה — הוא לכל היותר תוצאה."},
{u:5,bank:true,s:"מחלק הדואר הסיני.",q:"מה מהבאים אינו שימוש נפוץ לבעיית מחלק הדואר הסיני (CPP)?",o:["תכנון סיור תיירותי שמבקר בכל אתר בדיוק פעם אחת","איסוף אשפה בשכונות מגורים","ניקוי רחובות בלילה","חלוקת מכתבים ע״י דוורים"],a:0,e:"CPP עובר בכל הקשתות (הרחובות) לפחות פעם אחת — לכן איסוף אשפה, טאטוא וחלוקת דואר. סיור שמבקר בכל אתר (קודקוד) בדיוק פעם אחת הוא TSP, לא CPP. זו בדיוק ההבחנה קשתות מול קודקודים."},
{u:5,bank:true,s:"דייקסטרה.",q:"מתי ניתן להפעיל את אלגוריתם דייקסטרה?",o:["רק כאשר כל הקשתות בעלות משקל חיובי או אפס","רק בגרפים שאינם מכילים מעגלים","רק על רשתות ליניאריות","כאשר זמני השירות שווים בין כל התחנות"],a:0,e:"דייקסטרה חמדני: ברגע שקודקוד ננעל כקבוע הוא לא מתעדכן. משקל שלילי מאוחר יכול לפתוח מסלול קצר יותר, והאלגוריתם כבר לא יחזור — ולכן נדרשים משקלים אי-שליליים. מעגלים כן מותרים."},
{u:5,bank:true,cut:true,s:"אלגוריתם Savings.",q:"מהו עקרון הפעולה של אלגוריתם Savings?",o:["חיבור בין מסלולים קיימים לפי חיסכון מצטבר במרחק","הפרדה של מסלולים לניצול קיבולת","סידור לקוחות לפי סדר אלפביתי","איתור עומסים לפי מהירות תנועה"],a:0,e:"⬜ מחוץ לגזרת המבחן — Savings (Clarke & Wright) נחתך מהמצגת המעודכנת. לידיעה בלבד: מתחילים ממסלול נפרד לכל לקוח, מחשבים Sij = Ci0 + C0j − Cij, ומחברים זוגות מהחיסכון הגבוה לנמוך כל עוד הקיבולת מאפשרת."},
{u:5,bank:true,s:"TSP מול VRP.",q:"מה ההבדל העיקרי בין בעיית TSP לבעיית VRP?",o:["TSP עוסק במסלול של סוכן אחד; VRP כולל מספר רכבים ואילוצים כמו קיבולת","TSP כולל גם טעינה ופריקה ו-VRP לא","VRP לא כולל מעגלים סגורים","TSP עוסק במרחקים ריאליים בלבד"],a:0,e:"זו בדיוק שאלת המרצה: האילוץ שמתווסף במעבר ל-VRP הוא קיבולת הרכב, והיא מאלצת לפצל לכמה רכבים ולכמה מסלולים."},
{u:2,bank:true,s:"תורת הגרפים.",q:"מהו תנאי לקיום מעגל אוילרי בגרף?",o:["כל קודקוד בגרף מחובר למספר זוגי של קשתות","מספר אי-זוגי של קודקודים","לפחות קודקוד אחד מבודד","כל קודקוד מחובר לקודקוד שכנו"],a:0,e:"מעגל אוילרי (מתחילים ומסיימים באותה נקודה, עוברים בכל קשת בדיוק פעם אחת) קיים כשכל הדרגות זוגיות. אם יש בדיוק שני קודקודים בדרגה אי-זוגית — קיים מסלול אוילרי, אך לא מעגלי: מתחילים באחד ומסיימים בשני."},
{u:5,bank:true,s:"סיווג בעיות ניתוב.",q:"איזו בעיה מתארת מסלול שעובר בכל קודקוד בדיוק פעם אחת?",o:["בעיית הסוכן הנוסע (TSP)","בעיית מיקום מתקן","בעיית חתך מינימלי","בעיית ניתוח חציון"],a:0,e:"מעבר בכל הקודקודים פעם אחת = מסלול המילטוני; אם גם חוזרים לנקודת ההתחלה — מעגל המילטוני, וזו הגדרת TSP. מעבר בכל הקשתות הוא מחלק הדואר."},
{u:5,bank:true,cut:true,s:"אלגוריתם Savings.",q:"מהי מטרת פונקציית החיסכון באלגוריתם Savings?",o:["לחשב את החיסכון באורך המסלול כאשר מאחדים שני מסלולים ללקוחות","להעריך את זמן ההפצה המרבי","למדוד קיבולת רכב","לקבוע אילו לקוחות יקבלו שירות ראשון"],a:0,e:"⬜ מחוץ לגזרת המבחן. לידיעה: החיסכון מודד כמה מרחק נחסך כשמחברים שני מסלולים נפרדים למסלול אחד במקום לצאת ולחזור למחסן פעמיים."},
{u:5,bank:true,s:"דייקסטרה.",q:"באיזה שלב באלגוריתם דייקסטרה נבחר הקודקוד הבא לעיבוד?",o:["כאשר הוא הקרוב ביותר מבין הקודקודים שטרם ביקרנו בהם","כאשר זמני השירות שלו קצרים","כאשר הוא שייך למרכז ההפצה","כאשר כל שאר הצמתים כבר עובדו"],a:0,e:"זהו הצעד החמדני של האלגוריתם: בכל סיבוב בוחרים מבין הקודקודים שטרם טופלו את זה שהמרחק הזמני אליו הוא הקטן ביותר, נועלים אותו כקבוע, ומעדכנים את שכניו."},
{u:5,bank:true,s:"היוריסטיקה ל-TSP.",q:"מהי מטרת אלגוריתם ״השכן הקרוב ביותר״ ל-TSP?",o:["לבנות מסלול ע״י מעבר בכל פעם לצומת הקרוב ביותר שטרם ביקרנו בו","לעבור בכל קשת לפחות פעם אחת","לבחור את הקודקוד הרחוק ביותר בכל שלב","לבדוק התאמה של משקל מסלול לחוקי הרשת"],a:0,e:"היוריסטיקה חמדנית שנותנת פתרון מהיר וסביר. החסם הידוע: הפתרון לעולם אינו גרוע מפי 2 מהאופטימום. שינוי נקודת ההתחלה עשוי לתת מסלול שונה לגמרי."},
{u:5,bank:true,s:"הרחבות VRP.",q:"מה מייחד את בעיית EVRP (ניתוב רכבים חשמליים)?",o:["יש צורך בתכנון מסלול הכולל טעינות בהתאם לטווח הנסיעה ולמיקום תחנות הטעינה","מדובר בבעיית ניתוב ללא מגבלת קיבולת","הרכב חייב לבקר בכל צומת פעמיים","מתחשבים רק בעלויות דלק"],a:0,e:"ברכב חשמלי הטעינה אורכת הרבה יותר מתדלוק ומיקום התחנות מוגבל, ולכן הטעינה הופכת לחלק מתכנון המסלול עצמו ולא לעצירה שולית."},
{u:5,bank:true,s:"הרחבות VRP.",q:"מהו הגורם הקובע בחלונות זמן (Time Windows) בבעיית VRP?",o:["עמידה בזמני הגעה מוקדמים ומאוחרים לכל לקוח","מיקום תחנת היעד","מספר הלקוחות הכללי","מספר הכלים הזמינים להפצה"],a:0,e:"חלון זמן הוא פרק הזמן שבו מותר או נדרש להגיע ללקוח. הוא יכול להיות קשיח, גמיש או מרובה, והוא מגביל את סדר הביקורים ולא רק את אורך המסלול."},
{u:5,bank:true,s:"סיווג אלגוריתמים.",q:"איזה פתרון נחשב מקורב (היוריסטי) ולא מדויק לבעיית TSP?",o:["אלגוריתם השכן הקרוב ביותר (Nearest Neighbor)","אלגוריתם פורד-פולקרסון","פתרון ליניארי מדויק","פתרון Branch & Bound"],a:0,e:"השכן הקרוב הוא היוריסטיקה חמדנית. פורד-פולקרסון בכלל פותר זרימה מקסימלית, ולא TSP."},
{u:5,bank:true,s:"וריאנטים של VRP.",q:"מה מאפיין את בעיית VRP מרובת מרכזים (Multi-Depot VRP)?",o:["קיום מספר מרכזים שמהם יוצאים רכבים, ולא רק מרכז אחד","קיבולת אחידה לכל רכבי ההפצה","רכב אחד מבצע את כל המסלולים","כל הלקוחות מקבלים שירות מאותו המרכז"],a:0,e:"מחסן אחד הוא המקרה הקל. עם כמה מחסנים מתווספת החלטה לאיזה מחסן משויך כל לקוח, וגם שאלת החזרה: אם רכב מסיים במחסן אחר, ייתכן שלמחרת לא יהיו רכבים במחסן המקורי."},
{u:5,bank:true,s:"וריאנטים של VRP.",q:"מהו העיקרון המנחה של VRP סטוכסטי?",o:["הביקוש של הלקוחות אינו ודאי — הוא מבוסס על הסתברויות","זמני טעינה ארוכים","מספר רכבים בלתי מוגבל","תכנון ללא מגבלות של זמן או מרחק"],a:0,e:"בבעיה דטרמיניסטית הנתונים ידועים וקבועים. בסטוכסטית יודעים רק התפלגות — הסתברות וסטיית תקן — ולכן ייתכן מחסור או עודף קיבולת בפועל."},
{u:5,bank:true,s:"למה היוריסטיקה.",q:"מהי מטרת השימוש באלגוריתמים מקורבים לבעיות כמו TSP או VRP?",o:["השגת פתרון טוב במהירות כאשר פתרון אופטימלי אינו אפשרי או אינו יעיל חישובית","חישוב גיאוגרפי של זמני טעינה","לבדוק את דרגת האי-ריאליות של גרף","לוודא שוויון בין מרכזים לוגיסטיים"],a:0,e:"זו שאלת המרצה על 150 לקוחות: הבעיה NP-קשה, מספר האפשרויות גדל בקצב עצרתי, ולכן פתרון מדויק אינו מעשי והיוריסטיקה נותנת פתרון קרוב תוך שניות."},
{u:5,bank:true,cut:true,s:"הרחבות VRP.",q:"מהו אחד היתרונות של שילוב רחפנים במערכות הפצה?",o:["קיצור זמני משלוח לאזורים שקשה להגיע אליהם ברכב רגיל","הפחתת הוצאות דלק","חיזוק מערך שירות הלקוחות","ביטול הצורך במרכזים לוגיסטיים"],a:0,e:"⬜ מחוץ לגזרת המבחן — הרחפנים והרכבים האוטונומיים נחתכו מהמצגת המעודכנת. מובא לזיהוי בלבד."},
{u:4,bank:true,s:"מיקום מתקנים.",q:"מהי מטרת בעיית מיקום מתקנים (Facility Location)?",o:["קביעת מיקום אופטימלי למתקנים בהתאם ליעדים ולאילוצים","קביעת קיבולת המחסנים לפי ביקוש","בחירת מיקום לפי גובה המבנה","הקצאת שטחים למחסנים קיימים"],a:0,e:"היעד משתנה לפי המודל: מזעור סכום משוקלל (P-Median), מזעור המרחק ללקוח הרחוק (Min-Max), או מקסום כיסוי בטווח נתון. הקיבולת היא אילוץ, לא המטרה."},
{u:4,bank:true,s:"סוגי מתקנים.",q:"מה ההבדל בין מחסן למרכז הפצה?",o:["מרכז הפצה כולל גם מיון, אריזה ואיחוד משלוחים — לא רק אחסון","אין הבדל תפקודי","מחסן יושב תמיד ליד הנמל","מרכז הפצה משמש רק לאחסון מוצרים מסוכנים"],a:0,e:"מחסן — אחסון בלבד. מרכז הפצה — אחסון ועוד פעולות משלימות. וקרוס-דוקינג הוא הקצה השני: מעבר ישיר מעמדת פריקה לעמדת טעינה, בלי אחסון בכלל."},
{u:4,bank:true,s:"תהליך בחירת מיקום.",q:"מה נדרש לבצע בשלב הסינון בתהליך מיקום מתקן?",o:["לצמצם את רשימת המיקומים האפשריים לפי קריטריונים כמו נגישות, עלויות ותשתיות","לבחור את האתר עם הארנונה הנמוכה ביותר","לבחור מיקום במרחק קבוע מהמפעל","לבדוק רק שיקולי גובה מבנה"],a:0,e:"שלבי התהליך: תכנון ואסטרטגיה ← עיצוב רשת ← סינון אתרים ← בדיקת שטח וניתוח כספי ← משא ומתן ובחירה. הסינון מצמצם מרשימה ארוכה למועמדים בודדים."},
{u:4,bank:true,s:"שיקולי מיקום.",q:"איזה מהשיקולים הבאים נחשב לשיקול תחבורתי במיקום מתקן?",o:["נגישות לרשת תחבורה כמו כבישים, מסילות או נמלים","קרבה למוסדות חינוך","עלות העסקת עובדים","זמינות מיזוג אוויר"],a:0,e:"נגישות לרשת התחבורה היא שיקול תחבורתי מובהק. כוח אדם ועלויות הם שיקולים כלכליים, ושניהם נשקלים — אבל השאלה מבקשת דווקא את התחבורתי."},
{u:4,bank:true,s:"לוגיסטיקה עירונית.",q:"מהו פתרון אפשרי לבעיות לוגיסטיקה עירונית?",o:["הגבלת תנועת רכבי הפצה לשעות שמחוץ לשעות העומס","בניית חניונים רק בשכונות חדשות","ביטול תנועת משאיות בכבישים מהירים","הארכת שעות פעילות של מחסנים"],a:0,e:"הפתרונות המקובלים: הגבלת תנועה בשעות מסוימות, אספקה מחוץ לשעות הפעילות, חלונות זמן שהעירייה מגדירה, ופריקה יעילה יותר."},
{u:4,bank:true,s:"סיווג מודלים.",q:"מהי תכונה של בעיית מיקום בדידה?",o:["יש רשימה סופית של מיקומים אפשריים לבחירה","יש מרחב רציף של פתרונות","כל מיקום אפשרי אם יש לו תשתית","הפתרון תמיד יחיד"],a:0,e:"בדיד = בוחרים מתוך אתרים מוגדרים מראש, ולכן ייתכן שאין פתרון שעומד באילוץ. רציף = כל נקודה במרחב אפשרית."},
{u:4,bank:true,s:"מדידת מרחק.",q:"מהו ההבדל בין מרחק אוקלידי למרחק קווי (Rectilinear)?",o:["אוקלידי הוא קו ישר; קווי הוא סכום המרחקים בצירים האופקי והאנכי","קווי תמיד קצר יותר","אוקלידי מבוסס על זמני שירות","קווי אינו מתאים לשימוש במפות"],a:0,e:"אוקלידי (קו אווירי) קצר מהמציאות ולכן הוא הערכת חסר. רקטילינארי, לאורך צירים, ארוך מהמסלול בפועל ולכן הוא הערכה מחמירה. מפורש ב-GIS הוא המדויק."},
{u:4,bank:true,s:"מיקום מתקן יחיד.",q:"מהו היתרון העיקרי של שימוש בחציון משוקלל במיקום מתקן?",o:["נותן משקל גבוה יותר ללקוחות עם ביקוש גבוה","חישוב מהיר","מתאים לכל סוגי הלקוחות","מבטל השפעת לקוחות עם משקל נמוך"],a:0,e:"החציון המשוקלל ממזער את סך המרחק כפול הביקוש. הפתרון הוא חציון ולא ממוצע ולא מרכז גיאומטרי — זו המלכודת הנפוצה."},
{u:4,bank:true,s:"גבול הפצה.",q:"באיזה מקרה נעדיף פתרון גרפי לקביעת גבולות הפצה?",o:["כאשר יש מספר מצומצם של מתקנים ולקוחות במרחב דו-ממדי","כשאין נתונים על מיקומים","כשנרצה לבדוק רק את עלות ההפצה","כשעובדים עם מפעל יחיד"],a:0,e:"גבול ההפצה הוא נקודת שוויון העלויות בין שני מקורות אספקה. במרחב קטן אפשר לשרטט אותו; כשהמספרים גדלים עוברים לחישוב."},
{u:4,bank:true,s:"תהליך בחירת מיקום.",q:"באיזה שלב נערכת בדיקת התאמת שטח?",o:["כחלק מתהליך בחירת מיקום המתקן","רק לאחר ההקמה","לאחר סגירת חוזה שכירות","במקביל לבדיקות שכר עובדים"],a:0,e:"בדיקת השטח היא שלב בתוך התהליך, לפני המשא ומתן והבחירה הסופית — לא אחריהם."},
{u:4,bank:true,s:"רב-מטרתיות.",q:"אילו שני שיקולים מנוגדים נבחנים בחזית פארטו?",o:["מזעור עלות מול מזעור פגיעה באוכלוסייה","מינימום שטח ומקסימום קיבולת","מהירות מול נגישות","חיסכון באנרגיה מול אורך מסלול"],a:0,e:"חזית פארטו היא אוסף הפתרונות הלא-נשלטים בבעיה רב-מטרתית: אי אפשר לשפר מטרה אחת בלי לפגוע באחרת. כל נקודה על החזית לגיטימית, והארגון בוחר לפי העדפותיו."},
{u:4,bank:true,s:"מודלי מיקום.",q:"מהו עיקרון מודל Min-Max?",o:["מציאת מיקום שממזער את המרחק ללקוח הרחוק ביותר","חישוב ממוצע זמנים מינימלי","הקצאה לפי מספר ביקורים","אופטימיזציה של מסלול לכל רכב"],a:0,e:"Min-Max הוא מודל הוגנות ורמת שירות — הוא ״דואג לגרוע ביותר״. P-Median לעומתו ממזער את הסכום המשוקלל, וזו מטרת עלות כוללת. אותם נתונים יכולים לתת שתי תשובות הפוכות."},
{u:4,bank:true,s:"שיקולי מיקום.",q:"כיצד משפיע מיסוי על מיקום מתקן?",o:["אזורים עם הטבות מס הופכים לאטרקטיביים יותר","אין לו השפעה ישירה","מיסוי משפיע רק על עובדים","רק במתקנים תעשייתיים"],a:0,e:"תקנות, מיסוי וסיוע ציבורי הם שיקול מוכר בבחירת מיקום, לצד נגישות לשווקים, לרשת התחבורה, לכוח אדם ולתשתיות."},
{u:4,bank:true,s:"שיקולי מיקום.",q:"באיזו סיטואציה יש עדיפות למיקום מתקן בינלאומי?",o:["כשקיימים יתרונות כלכליים, רגולטוריים או גיאוגרפיים במדינות אחרות","כשיש צורך בשפה משותפת","כשאין מקום בארץ","כאשר מדובר במתקן ציבורי בלבד"],a:0,e:"השיקולים זהים לשיקולים המקומיים — עלויות, רגולציה, נגישות לשווקים ולרשת התחבורה — רק שהם נבחנים בין מדינות."},
{u:4,bank:true,s:"מודלי מיקום.",q:"איזה פתרון מתאים לבעיית שני מוקדי הפצה המרוחקים מהמפעל?",o:["רשת הפצה היררכית (Hub & Spokes)","איחוד המוקדים","הקמת מחסן קצה","מיקוד לפי אזורי מיקוד בלבד"],a:0,e:"Hub & Spokes מרכז את הזרימה דרך מרכזי-על ומשם מחלק בחישורים. זה מאפשר קונסולידציה ויעילות — המודל של חברות תעופה וחברות שילוח."},
{u:4,bank:true,s:"סיווג מודלים.",q:"מהי תרומתו של ניתוח דינמי לבעיית מיקום מתקנים?",o:["מאפשר להביא בחשבון שינויים עתידיים בביקוש, בעלויות ובסביבה","מתחשב רק בעלויות הנוכחיות","מבטל את הצורך בבדיקות נוספות","מתאים רק למתקנים זמניים"],a:0,e:"מודל סטטי מניח שמיקומי הלקוחות, הכמויות והזהות קבועים — וזה מקל מאוד. מודל דינמי מניח שהם משתנים לאורך הזמן, ולכן הוא מורכב יותר אך קרוב יותר למציאות."},
{u:4,bank:true,s:"מודל כיסוי מקסימלי.",q:"איזה משתנה בינארי מציין האם לקוח מכוסה במודל כיסוי מקסימלי?",o:["ערך 1 אם הלקוח מכוסה ע״י מתקן כלשהו בטווח, ו-0 אם לא","משקל הלקוח","רדיוס השירות","רמת הביקוש"],a:0,e:"המודל ממקסם את סך הביקוש המכוסה בתוך טווח כיסוי נתון (Dc) במספר מתקנים מוגבל (P). משתנה בינארי לכל לקוח מסמן אם הוא נכנס לטווח, והביקוש שלו נספר רק אם כן."},

{u:3,bank:true,s:"בעיית התובלה.",q:"מהו עקרון הפעולה של בעיית התובלה?",o:["מציאת כמויות סחורה להעברה בין מקורות ללקוחות במזעור עלות","הקצאת רכבים לרשת","מיקום תחנות תדלוק","איזון בין מספר רכבים"],a:0,e:"ספקים ולקוחות, אותו מוצר, עלות לכל שילוח. השאלה היא כמה להעביר מכל ספק לכל לקוח כך שסך העלות מינימלי. אין כאן נקודות ביניים — זה כבר שיטעון."},
{u:3,bank:true,s:"זרימה מקסימלית.",q:"מהי מטרת בעיית הזרימה המקסימלית?",o:["מציאת הכמות המקסימלית שניתן להעביר ברשת בין מקור ליעד","חלוקת רכבים לפי אזורים","איחוד מסלולים","פתרון תכנון עבור גרף לא ממושקל"],a:0,e:"כאן לא מחפשים עלות מינימלית אלא כמות מקסימלית, ומשתמשים בכל הרשת בו-זמנית ולא במסלול אחד. המספרים על הקשתות הם קיבולת."},
{u:3,bank:true,s:"פורד-פולקרסון.",q:"מה תפקידו של אלגוריתם פורד-פולקרסון?",o:["חישוב זרימה מקסימלית ברשת","פתרון בעיות TSP","חישוב חציון משוקלל","תכנון תחנות טעינה"],a:0,e:"האלגוריתם מוצא מסלול אוגמנטי, מזהה את צוואר הבקבוק שלו, מעדכן את הקשתות הישרות וההפוכות, וחוזר עד שאין יותר מסלולים."},
{u:3,bank:true,s:"פורד-פולקרסון.",q:"מהם התנאים להפסקת אלגוריתם פורד-פולקרסון?",o:["כאשר לא נותרו מסלולים אוגמנטיים להעברת זרימה נוספת","כאשר כל המסלולים זהים","כאשר כל הלקוחות שורתו","כאשר זמן השירות גבוה מהממוצע"],a:0,e:"עוצרים כשאין יותר מסלול מהמקור ליעד שבו הזרימה השיורית בכל הקשתות גדולה מאפס. הזרימה המקסימלית היא סכום כל הכמויות שהועברו."},

{u:3,bank:true,s:"בעיית התובלה.",q:"מה מתאר משתנה בבעיית תובלה?",o:["את כמות הסחורה שמועברת ממקור לנקודת ביקוש","משקל כולל של המסלול","מספר רכבים פעילים","משך זמן השירות"],a:0,e:"משתנה ההחלטה Xij הוא הכמות שעוברת מקודקוד i לקודקוד j. פונקציית המטרה מכפילה כל משתנה בעלות הקשת שלו וסוכמת."},

{u:3,bank:true,s:"זרימת עלות מינימלית.",q:"מה מציין משתנה במודל זרימת עלות?",o:["את הכמות שעוברת בקשת מסוימת","את סך העלות הכוללת של הזרימות ברשת","את סוג הרכב","את הטווח הגיאוגרפי של הבעיה"],a:0,e:"אל תתבלבלו: המשתנה הוא הכמות בקשת. סך העלות הוא פונקציית המטרה, שמורכבת מכל המשתנים כפול העלויות שלהם."},

{u:3,bank:true,s:"בעיית התובלה.",q:"איזה שימוש אופייני לבעיית התובלה בשרשרת אספקה?",o:["הקצאת משלוחים ממספר מקורות למספר יעדים תוך מזעור עלות ההובלה","שיבוץ עובדים למוקדים","בניית מסלולי הפצה אישיים","חיזוי ביקושים לפי עונות"],a:0,e:"בניית מסלול לרכב היא ניתוב רכבים, לא תובלה. שיבוץ עובדים הוא בעיית השיבוץ — שהיא אמנם מקרה פרטי של תובלה, אך לא השימוש האופייני שנשאל כאן."},
{u:3,bank:true,s:"זרימה ברשת.",q:"באיזה תנאי יכולה הזרימה ברשת להיות שווה ל-0?",o:["אם אין מסלול תקף מהמקור ליעד","כשהרשת עגולה","כאשר אין תחנות טעינה זמינות","כשהזרימה מתבצעת בלילה בלבד"],a:0,e:"אם כל חתך אפשרי כולל קשת בקיבולת אפס, או שהגרף מנותק בין המקור ליעד, הזרימה המקסימלית היא אפס — והחתך המינימלי גם הוא אפס."},
{u:3,bank:true,s:"זרימת עלות מינימלית.",q:"מהי המטרה הראשית במודל זרימת עלות מינימלית עם אילוצים?",o:["מזעור העלות הכוללת של הזרימה תוך עמידה באילוצי קיבולת, ביקוש והיצע","איזון בין כמות לדרישות איכות","בניית מסלולים מעגליים","הפחתת כמות הלקוחות"],a:0,e:"בלי אילוצים אפשר להציב אפס בכל המשתנים ולקבל עלות אפס — אבל אז לא עבר כלום. האילוצים הם מה שמחייב לספק בפועל."},
{u:2,bank:true,s:"תורת הגרפים.",q:"מהי אחת התרומות המרכזיות של אוילר בתורת הגרפים?",o:["הגדרת התנאים לקיום מסלול אוילרי (בעיית גשרי קניגסברג)","חישוב מהיר של עלויות","פתרון בעיות הפצה","ניתוח תנועה ליניארית"],a:0,e:"אוילר לא ניסה עוד מסלולים — הוא תרגם את העיר לגרף (יבשות כקודקודים, גשרים כקשתות) והוכיח מהו התנאי הכללי: זוגיות הדרגות."},
{u:2,bank:true,s:"מידע מרחבי.",q:"מה מאפיין נתון גאוגרפי לעומת נתון לא-מרחבי?",o:["כתובת היא נתון גאוגרפי; שם של חנות הוא לא גאוגרפי","שם עיר הוא לא גאוגרפי","טמפרטורה היא תמיד לא גאוגרפית","רק נתוני GPS הם גאוגרפיים"],a:0,e:"נתון גאוגרפי מיוחס למיקום על פני כדור הארץ. נתון מרחבי מיוחס למרחב כלשהו. כל נתון גאוגרפי הוא מרחבי — אך לא כל מרחבי הוא גאוגרפי."},
{u:2,bank:true,s:"GIS.",q:"מה מייחד מערכת GIS לעומת מאגרי מידע רגילים?",o:["יכולת לנתח ולהציג מידע מרחבי ולשלב שכבות של מידע גאוגרפי","ניהול טבלאות בלבד","שימוש בקבצי Excel","ניתוח רק לפי זמן"],a:0,e:"היתרון הוא שהנתונים נשמרים עם ייחוס גאוגרפי, ולכן אפשר להציגם על מפה ולשאול שאלות מרחביות — לא רק לסנן טבלה."},
{u:2,bank:true,s:"GIS.",q:"מה מהבאים הוא יישום של GIS?",o:["תכנון מיקום תחנות כיבוי אש לפי פיזור גאוגרפי של אוכלוסייה ובניינים","הפקת חשבוניות","מדידת לחץ דם","הקצאת סיסמאות לעובדים"],a:0,e:"זה בדיוק החיבור ליחידה 4: ניתוח GIS יוצר מפת חום של זמני הגעה, ומזהה את האזורים שבהם רמת השירות נמוכה — ושם ממקמים את המתקן החדש."},
{u:2,bank:true,s:"ייצוג נתונים.",q:"מהו ייצוג ״וקטורי״ במידע מרחבי?",o:["ייצוג של עצמים ע״י נקודות, קווים ופוליגונים עם קואורדינטות","ייצוג באמצעות תאים צבעוניים","קידוד לפי רמות שירות","הצגה גרפית של תורים"],a:0,e:"שלוש הישויות: נקודות (אנטנות, עמודי תאורה), קווים (כבישים, נהרות, צינורות) ופוליגונים (מגרשים, מבנים, יערות). היתרון — אפשר לבצע חישובים ולשנות קנה מידה בלי לאבד דיוק."},
{u:2,bank:true,s:"ייצוג נתונים.",q:"כיצד מוגדר פורמט ״ראסטר״ במידע גאוגרפי?",o:["רשת של תאים (פיקסלים) שכל אחד מייצג ערך גאוגרפי כלשהו","קווים המחברים בין צמתים","שיטת הצבעה לפי אזור","בסיס נתונים של GPS"],a:0,e:"הרזולוציה נקבעת לפי גודל התא. מתאים לתצלומי אוויר ולוויין ולמפות סרוקות — מהיר לקליטה, אך התמונה קבועה וקשה לשנות בה פירוט."},
{u:2,bank:true,s:"GIS.",q:"מהו תהליך Georeferencing (עיגון תמונה)?",o:["התאמת תמונות או מפות סרוקות למערכת קואורדינטות גאוגרפית ידועה","חישוב GPS לפי לוויינים","ייבוא קבצים ממאגר חיצוני","המרה של קואורדינטות לשמות"],a:0,e:"תמונת ראסטר בדרך כלל אינה נושאת מידע גאוגרפי, ולעיתים צולמה בזווית לא מתאימה. העיגון מסובב, מקנה מידה ומתאים אותה למציאות."},
{u:2,bank:true,s:"קנה מידה.",q:"מה מבטא קנה מידה קטן במפה?",o:["ייצוג של שטח גדול מאוד עם מעט פרטים","יותר פרטים לכל אזור","רק מדידה של גובה","רק מפת שכונות"],a:0,e:"זה הפוך מהאינטואיציה: מספר קטן במכנה = קנה מידה גדול = יותר פירוט. באחד לחמש מאות עיר תופיע כפוליגון; באחד למאתיים חמישים אלף אותה עיר תהיה נקודה."},
{u:2,bank:true,s:"GPS.",q:"מה מאפשרת טכנולוגיית GPS?",o:["קביעת מיקום מדויק בכל זמן ובכל מקום שיש בו קליטה","חישוב מסלולים לפי מרחק","תכנון לפי שעות עומס","ניתוח כמות מבקרים"],a:0,e:"24 לוויינים, 6 מישורי מסלול, גובה כ-20,200 ק״מ. כל לוויין נושא שעון אטומי ומשדר את השעה ואת מיקומו; המקלט מחשב מרחק לפי זמן ההגעה של האות."},
{u:2,bank:true,s:"GPS.",q:"איזו טכנולוגיה משמשת להאצת קבלת מיקום במכשירים ניידים?",o:["A-GPS (Assisted GPS)","Bluetooth","Wi-Fi","NFC"],a:0,e:"במקום להוריד את נתוני מיקומי הלוויינים מהלוויין עצמו (איטי), המכשיר מוריד אותם משרת אינטרנט. זה מזרז את הנעילה הראשונה — TTFF, Time To First Fix."},

  "<b>משתמשים</b> (נהג, נוסע) — מהימנות הנהג, הכשרות שעבר."
 ]},
 {t:"box",v:"כל המרכיבים משפיעים זה על זה, ולכן <b>אי אפשר לבחון תנועה כגורם מבודד</b>. מהירות וזמני נסיעה מושפעים גם מהתשתית וגם מהחוקים."},

 {t:"h",v:"רמת מינוע"},
 {t:"p",v:"מדד המציין את <b>מספר כלי הרכב המנועיים לכל 1,000 תושבים</b>. חשוב כי הוא מדד יחסי שאינו תלוי בגודל האוכלוסייה, ומאפשר השוואה לאורך זמן ובין מדינות."},
 {t:"ex",v:"<b>דוגמה היסטורית:</b> בשנות ה-50 (תקופת הצנע) היו מעט רכבים. בשנות ה-80–90 הגיעו כמיליון עולים מברית המועצות ללא רכבים — ולכן <b>רמת המינוע ירדה</b> (כי המדד הוא לכל 1,000 איש). כעבור כשנתיים הם נקלטו, קנו רכבים, והמדד עלה."},
 {t:"p",v:"<b>למה זה משמש:</b> להבין את רמת החיים וההתפתחות הכלכלית · להשוות בין מדינות · להסיק על עומסי תנועה ולתכנן תשתיות עתידיות. רמת מינוע גבוהה קשורה לתאונות, עומסים, זיהום אוויר וצריכת משאבים."},
 {t:"box",v:"<b>המספרים מהמצגת:</b> בישראל עלתה רמת המינוע מ-<b>6.1</b> (1951) ל-<b>276</b> (2011) כלי רכב ל-1,000 תושבים — בשיעור ממוצע של <b>7% בשנה</b>.<br><b>השוואה בין-לאומית 2009:</b> איטליה 521 · גרמניה 510 · ספרד 478 · בריטניה 460 · יוון 457 · יפן 455 · ארה״ב 439 · צרפת 420 · <b>ישראל ~265</b> · טורקיה ~95."},
 {t:"ex",v:"<b>אמצעים לוויסות עומסים:</b> כביש 6 — גביית תשלום כדי לשמור על כביש לא עמוס. נתיב מהיר — תשלום גבוה יותר בשעות העומס."},

 {t:"h",v:"אינטר-מודליות (Inter-modality)"},
 {t:"p",v:"שינוע רב-אמצעי — שילוב של כמה אמצעי הובלה לאורך אותו מסלול, כדי לייעל את ההפצה."},
 {t:"ex",v:"מלגזה מוציאה פריטים מהמחסן ← משאית ← תחנת רכבת ← קרונות ← יעד ← חו״ל. החלופה: כל המסלול במשאית — לא בטוח שכדאי, בגלל כבישי אגרה, תשלום על אוכל ולינה לנהגים וכו׳."},
 {t:"box",v:"<b>הדגש של המרצה:</b> אינטר-מודליות = הפצה <b>יעילה</b> יותר — <b>לא בהכרח זולה או מהירה</b> יותר."},
 {t:"p",v:"<b>שלבי המודל:</b> COMPOSITION (איסוף / First mile) ← INTERCHANGE (מעבר / TRANSFER) ← DECOMPOSITION (פירוק וחלוקה / Last mile)."},

 {t:"h",v:"סיווג דרכים"},
 {t:"tbl",head:["סוג דרך","מאפיינים","קיבולת (יר״מ/נתיב/שעה)"],rows:[
  ["מהירה","מהירות גבוהה, כמות רכבים גבוהה, זרימה גבוהה; קשה להגיע אליה (נגישות נמוכה)","2,000"],
  ["עורקית","מהירות גבוהה אך זרימה נמוכה יותר; מחברת דרכים מאספות לדרכים מהירות","1,500"],
  ["מאספת","מחברת מהדרך המקומית לעירונית (בד״כ ~70 קמ״ש)","750"],
  ["מקומית","רחובות ליד הבית — הכי נגישים, מהירות איטית ומוגבלת","250"]
 ]},
 {t:"box",v:"שני פרמטרים מאפיינים: <b>נגישות</b> (כמה קשה להגיע לכביש) ו<b>זרימה</b>. ככל שעולים בהיררכיה (מקומית ← מאספת ← עורקית ← מהירה) <b>הזרימה עולה והנגישות יורדת</b>."},
 {t:"ex",v:"כביש 4 ממורשה עד גן יבנה — מהיר, הרבה נתיבים, זרימה גבוהה. מגן יבנה דרומה — רמזורים ופחות נתיבים, זרימה נמוכה יותר, אף שמהירות הנסיעה המוגדרת זהה (90 קמ״ש)."},
 {t:"p",v:"<b>גיאומטריה:</b> לכל כלי רכב מאפיינים פיזיים שיש להתחשב בהם בתכנון — משאית צריכה כבישים רחבים יותר בגלל רדיוס הפנייה; במחסן צריך מקום למלגזה להסתובב."},

 {t:"h",v:"המייל האחרון (Last Mile)"},
 {t:"p",v:"הזמנה מחו״ל מגיעה במטוס לחברת הפצה שיש לה מרכזים בארץ, ומשם צריכה להגיע ללקוח. אפשר להביא לנקודת חלוקה (פשוט — מסלולים ונקודות קבועות) או להביא ללקוח עצמו, שמפוזר ולעיתים קשה להגיע אליו. <b>בעיית המייל האחרון:</b> איך להביא מהנקודה האחרונה של הספק אל הלקוח."},

 {t:"h",v:"דפוס תנועה יומי ויר״מ"},
 {t:"p",v:"לכל כביש מאפיינים משלו. מדידה ביציאה מאיילון (קיבולת מתוכננת 2,000): בלילה כמות נמוכה; מ-5:00 עלייה עם שיא ב-7:00; ירידה 8:00–13:00; עלייה 13:00–19:00 עם שיא ב-16:00–17:00. <b>בכל כביש צריך להבין מדוע יש עומסים — הסיבה משתנה לפי מאפייניו.</b>"},
 {t:"p",v:"<b>יחידת רכב משווה (יר״מ / PCU):</b> מגדירים רכב פרטי כיחידת הבסיס, ולכל כלי רכב אחר ערך יחסי. הקיבולת מוגדרת כ<b>יר״מ לנתיב אחד לשעה</b>."},
 {t:"tbl",head:["סוג רכב","מישור","הר","צומת"],rows:[
  ["פרטי","1","1","1"],["משא","1.7","8","2"],["אוטובוס","1.5","5","1.8"],["אופנוע","—","—","0.8"]
 ]},

 {t:"h",v:"זרימת תנועה — המודל"},
 {t:"p",v:"מודל המחבר שלושה מאפיינים: <b>מהירות (S)</b> בקמ״ש, <b>זרימה/נפח (q)</b> ברכבים לשעה, ו<b>צפיפות (D)</b> ברכבים לק״מ. <b>קיבולת (C)</b> = רכבים בנתיב אחד בשעה; קיבולת × מספר נתיבים = זרימת הכביש כולו."},
 {t:"box",v:"<b>משוואה 1:</b> q = S × D &nbsp;·&nbsp; <b>משוואה 2:</b> S = Sf · (1 − D/Dj) &nbsp;·&nbsp; <b>משוואה 3:</b> q = Sf · (D − D²/Dj) &nbsp;·&nbsp; <b>משוואה 4:</b> q = Dj · (S − S²/Sf)"},
 {t:"ul",v:[
  "<b>Sf (Speed Free)</b> — המהירות החופשית: המהירות הגבוהה ביותר כשאין רכבים על הכביש (צפיפות 0).",
  "<b>Dj</b> — צפיפות הפקק: כמות הרכבים שגורמת לכך שלא ניתן לנסוע כלל (מהירות 0).",
  "ככל שכמות הרכבים עולה — המהירות יורדת, עד שמגיעה ל-0 בצפיפות Dj.",
  "אם אין רכבים — אין זרימה (q=0). מוסיפים רכבים ← הזרימה עולה עד ל<b>זרימה מקסימלית</b>. מעבר לכך כל תוספת רכב מגדילה את העומס, המהירות יורדת, ולכן הזרימה יורדת — עד ל-Dj שבו שוב אין זרימה."
 ]},
 {t:"p",v:"המודל נקרא <b>מודל גרינשילדס</b>: הקשר מהירות–צפיפות הוא <b>ליניארי יורד</b>, ולכן הקשר זרימה–צפיפות הוא <b>פרבולי</b>."},
 {t:"box",v:"<b>הזרימה המקסימלית (qmax)</b> מתקבלת ב-<b>Dq = Dj/2</b> וב-<b>Sq = Sf/2</b> (האמצע)."},
 {t:"ex",v:"<b>שאלה לדוגמה (מהשיעור):</b> נתון Sf=96 ו-Dj=88. qmax מתקבל ב-D=88/2=44 וב-S=96/2=48 ← qmax = 48×44 = 2,112.<br>אם נתון q=1000 — מציבים במשוואה 3, מקבלים <b>משוואה ריבועית</b> (מעבירים אגפים ומשווים ל-0, נוסחת השורשים) ומקבלים <b>שני</b> פתרונות של הפרבולה, ואז מוצאים את המהירויות במשוואה 1."},
 {t:"box",v:"<b>שאלה אמריקאית שהמרצה ציין:</b> אם הזרימה המקסימלית 1000 והזרימה הנוכחית 500 — <b>לכל ערך זרימה (למעט זרימת השיא) יש שתי צפיפויות ושתי מהירויות מתאימות</b>. אם אין אף רכב על הכביש — המהירות שווה ל-Sf."}
]},

{u:2,title:"מידע מרחבי",lessons:"שיעורים 3–5 · 12.5 · 19.5 · 26.5",blocks:[
 {t:"h",v:"בעיית הגשרים של קניגסברג"},
 {t:"p",v:"הבעיה הראשונה שנפתרה בתורת הגרפים. בעיר קניגסברג עבר נהר ובה 7 גשרים; התושבים חיפשו מסלול מעגלי שעובר בכל גשר פעם אחת בלבד ולא מצאו. <b>אויילר</b> (מתמטיקאי, 1735) הוכיח שאי אפשר, והראה מהם התנאים שכן מאפשרים מסלול כזה."},
 {t:"p",v:"אויילר תרגם את המציאות לגרף: כל יבשת = <b>קודקוד</b>, כל גשר = <b>קשת</b>. <b>דרגה</b> = מספר הקשתות המחוברות לקודקוד."},
 {t:"box",v:"<b>התנאי למסלול אוילר</b> (מעבר בכל קשת בדיוק פעם אחת) בגרף קשיר:<br>• <b>כל הקודקודים בדרגה זוגית</b> ← קיים מסלול <b>מעגלי</b> (מתחילים ומסיימים באותה נקודה).<br>• <b>בדיוק 2 קודקודים בדרגה אי-זוגית</b> ← מתחילים באחד ומסיימים בשני.<br>בקניגסברג היו קודקודים בדרגה 3, 3 ו-5 ← לא מתקיים."},
 {t:"ex",v:"<b>ציור הבית הקלאסי</b> (ריבוע עם ״איקס״ וגג משולש): שתי הפינות התחתונות בדרגה 3 (אי-זוגית), השאר זוגיות ← יש בדיוק 2 אי-זוגיים ← <b>אפשר</b> לצייר בלי להרים עיפרון, אך <b>חייבים להתחיל באחת הפינות התחתונות ולסיים בשנייה</b>. אם מתחילים בראש הגג (זוגי) — לא ניתן להשלים."},

 {t:"h",v:"מערכות מידע גאוגרפיות (GIS)"},
 {t:"p",v:"<b>GIS = Geographic Information System</b> (ממ״ג). מערכת ממוחשבת לקליטה, אחסון, עדכון, תפעול, תשאול והצגה של נתונים גאוגרפיים, המאפשרת גם <b>ניתוח</b> ליצירת מידע חדש. היתרון הבולט: הנתונים נשמרים עם ייחוס גאוגרפי וניתן להציגם על מפות ולא רק בטבלאות."},
 {t:"p",v:"<b>שימושים:</b> תכנון רשתות מים, חשמל, תקשורת, מבנים ודיור; ניהול נכסים; מציאת מסלול קצר לכוחות כיבוי אש."},
 {t:"box",v:"<b>5 מרכיבי GIS:</b> נתונים · חומרה · תוכנה · פרוצדורות · כח אדם.<br><b>אל תתבלבל עם שלבי התהליך:</b> איסוף ← אחסון ← תשאול ← ניתוח ← תצוגה ← פלט."},
 {t:"ul",v:[
  "<b>נתונים</b> — מתוכניות שתוכננו, איסוף מהשטח (כמו Waze שבנה מפות מנתוני נהגים), או סריקת תצלומי אוויר/לוויין.",
  "<b>חומרה</b> — מחשבים ורשתות תקשורת. <b>תוכנה</b> — מה שרץ עליהם.",
  "<b>פרוצדורות</b> — תוכניות קטנות שכותבים בתוך המערכת ומוסיפות פונקציות שאינן מובנות בה.",
  "<b>כח אדם</b> — מי שמשתמש, מנתח, מוציא שאילתות ומחליט לאן להפנות משאבים."
 ]},
 {t:"p",v:"<b>ציוני דרך:</b> יישומים ראשונים בשנות ה-50–60 · 1963 CGIS (קנדה) · <b>1969 הקמת ESRI</b> (חברת ה-GIS הגדולה בעולם) · 1972 LandSat 1 · 1981 ArcInfo · <b>1985 GPS מבצעי</b> · <b>2005 Google Maps</b> · <b>2006 Google Earth</b>."},
 {t:"p",v:"<b>שכבות (Layers):</b> לוקחים את העולם האמיתי ומחלקים אותו לשכבות שכל אחת עוסקת בתחום אחר (לקוחות, צמחייה, מבנים, כבישים). המערכת עונה על שאלות <b>ע״י השוואת שכבות שונות באותו מרחב</b>."},

 {t:"h",v:"אחסון נתונים — ראסטר מול וקטור"},
 {t:"tbl",head:["","ראסטר (Raster)","וקטור (Vector)"],rows:[
  ["עיקרון","תמונה המפורקת לתאים (פיקסלים)","ייצוג מספרי בקואורדינטות"],
  ["רזולוציה","ככל שהתאים קטנים — פירוט גבוה יותר","דינמי; ניתן לשנות תצוגה בכל קנה מידה"],
  ["מתאים ל","תצלומי אוויר, תצלומי לוויין, מפות סרוקות","כבישים, מבנים, אנטנות, גבולות"],
  ["מגבלה","התמונה קבועה — קשה לשנות פירוט או להוסיף נתונים","—"],
  ["יתרון","מהיר לקליטה (סריקה)","ניתן לבצע חישובים ומניפולציות"]
 ]},
 {t:"p",v:"<b>3 הישויות הבסיסיות במידע וקטורי:</b>"},
 {t:"ul",v:[
  "<b>נקודות</b> — מידע נקודתי: עמודי תאורה, אנטנות, בארות, חנויות.",
  "<b>קווים</b> — סדרת נקודות מחוברות לפי סדר: כבישים, נהרות, פסי רכבת, צינורות, קווי חשמל.",
  "<b>שטחים / פוליגונים</b> — סדרת קווים הסוגרת שטח: מבנים, מגרשים, ייעודי קרקע, יערות."
 ]},
 {t:"h",v:"3 מרכיבי המידע הגאוגרפי"},
 {t:"ul",v:[
  "<b>גיאומטריה</b> — המיקום והצורה במרחב (מאיפה מתחיל הכביש ואיפה נגמר).",
  "<b>מאפיינים (Attributes)</b> — נתונים בטבלה: שם רחוב, מספר נתיבים, אוכלוסייה במחוז, עומק באר.",
  "<b>חוקים / התנהגות</b> — יחסים מרחביים וכללי היגיון: רחובות וכבישים מהירים שלא אמורים להצטלב, באר שצריכה להיות בעומק מסוים."
 ]},
 {t:"h",v:"עיגון תמונה (Georeferencing)"},
 {t:"p",v:"תמונות ראסטר בד״כ אינן מכילות מידע גאוגרפי, ולעיתים לא צולמו בזווית התואמת את המערכת. <b>עיגון תמונה</b> = לסובב, להגדיל ולהתאים את התמונה למערכת הקואורדינטות של העולם האמיתי. ייצוג העיגון כולל גודל תא ב-X וב-Y, סיבוב, ונקודת ייחוס (Easting/Northing)."},

 {t:"h",v:"סוגי עבודה במערכת"},
 {t:"ul",v:[
  "<b>תשאול (Query)</b> — שאלות פשוטות על הנתונים. לדוגמה: ״הצג מחוזות בפלורידה עם מעל 300 אלף תושבים״. לכל אובייקט מספר מזהה, סוג (פוליגון) ומאפיינים.",
  "<b>ניתוח (Analysis)</b> — הפעלת אלגוריתמים וכלים חישוביים על הנתונים."
 ]},
 {t:"p",v:"<b>3 סוגי ניתוח:</b>"},
 {t:"ul",v:[
  "<b>קרבה (Proximity)</b> — אילו חלקות בטווח 50 מ׳ מהכביש? אילו אזורים בסכנת שיטפון לפי קרבה לנהרות?",
  "<b>שכבות-על (Overlay)</b> — הצלבת מספר שכבות: ״כל הבארות מסוג מסוים, בקרקע חולית, עם מבנה מסוים״.",
  "<b>רשת (Network)</b> — ניתוח לאורך רשת קווית: מסלול קצר מבית חולים לתאונה, תוך התחשבות בגובה גשרים ומשקל מותר."
 ]},
 {t:"p",v:"<b>תצוגה ופלט:</b> טבלאות, גרפים, מפות ודוחות. הפצה: שמירת פרויקט, שליחת תמונה (לא צריך את המערכת אצל המקבל), מפות נייר לשטח, או העלאה לאינטרנט."},

 {t:"h",v:"מושגים נוספים"},
 {t:"box",v:"<b>קנה מידה:</b> מספר קטן במכנה = קנה מידה <b>גדול</b> = יותר פירוט. ב-1:500 עיר עשויה להופיע כ<b>פוליגון</b>; ב-1:250,000 (קנ״מ קטן) אותה עיר תופיע כ<b>נקודה</b>. הכל נמצא במערכת — זה רק עניין של תצוגה."},
 {t:"p",v:"<b>יחסים מרחביים:</b> חיבור (כביש מחבר בין ערים), הכלה (סן פרנסיסקו בתוך קליפורניה), כיוון ואורך, וסמיכות."},
 {t:"p",v:"<b>יישומי תחבורה:</b> בניית מסלולים לסוגי כלי רכב שונים (משאיות, רכבות, אוטובוסים, הולכי רגל, מלגזות) · <b>Linear Referencing</b> — מיקום נקודות לאורך כביש: מיקומי תאונות, נקודות בעייתיות, תקלות ותשתיות · מחלפים וכבישים חד-סטריים · נתוני זרימת תנועה ועומסים · המחשה מרחבית בצבעים · <b>שילוב עם מערכות ארגוניות</b> כמו SAP, כדי לא לנהל מידע פעמיים."},

 {t:"h",v:"טכנולוגיות איכון — GPS"},
 {t:"p",v:"רוצים לאכן כדי שתהיה שליטה — לדעת איפה הדברים נמצאים ומה קורה. מבחינים בין איכון מחוץ למבנים ובתוכם."},
 {t:"box",v:"<b>השיטה האמריקאית (GPS):</b> 24 לוויינים · 6 מסלולים סביב כדור הארץ (4 בכל מסלול) · גובה ~20,200 ק״מ · נטייה 55°. הוקמה ע״י משרד ההגנה האמריקאי ומתופעלת ע״י חיל האוויר."},
 {t:"p",v:"<b>מנגנון הפעולה:</b> כל לוויין נושא <b>שעון אטומי</b> מדויק ומשדר אות הכולל את השעה ואת מיקומו. המקלט מחשב את המרחק מהלוויין לפי זמן הגעת האות."},
 {t:"box",v:"<b>טריאנגולציה:</b> חישוב נקודה במרחב ע״י הצלבת מרחקים מכמה מקורות. נדרשים <b>לפחות 4 לוויינים</b> — כי יש 4 נעלמים: x, y, z (מיקום וגובה) <b>והזמן t</b> (סטיית שעון המקלט)."},
 {t:"box",v:"⚠ <b>שני ניסוחים לאותו מספר — שווה להכיר את שניהם.</b><br><b>המצגת:</b> 4 נעלמים (x, y, z, t) ← 4 משוואות ← 4 לוויינים.<br><b>סיכום ההרצאה:</b> ״נדרשים לפחות <b>3 לוויינים</b> לקביעת מיקום דו-ממדי (חיתוך רדיוסים), ו<b>לוויין רביעי לקביעת גובה</b>״ — בלי להזכיר את הזמן.<br>שתי הדרכים מגיעות ל-<b>4 לוויינים</b>; ההבדל הוא רק בהסבר. אם במבחן תוצע אפשרות שמנסחת ״3 + רביעי לגובה״ — זה הניסוח מהסיכום, ולא טעות."},
 {t:"p",v:"מערכות לוויין נוספות: <b>Galileo</b> (אירופה), <b>Glonass</b> (רוסיה), <b>Beidou</b> (סין)."},

 {t:"h",v:"AGPS ו-AVL"},
 {t:"p",v:"<b>הבעיה:</b> ה-GPS צריך לטעון את כל הנתונים לפני שמתחיל לעבוד — וזה איטי, במיוחד כשהאות חלש."},
 {t:"box",v:"<b>AGPS (Assisted GPS):</b> במקום להוריד את נתוני מיקומי הלוויינים <b>מהלוויין</b> (איטי), המכשיר מוריד אותם <b>משרת אינטרנט</b> שמתעדכן כל הזמן. מאיץ את ה״נעילה״ הראשונה (<b>TTFF — Time To First Fix</b>). מתאים למכשירים סלולריים שיכולים להתחבר לאינטרנט, ובעיקר באזורים עירוניים."},
 {t:"box",v:"<b>AVL (Automatic Vehicle Location) = GPS + GIS.</b> קופסה שמתחברת לרכב, קולטת נתוני GPS ומעבירה למוקד החברה."},
 {t:"ul",v:[
  "ניהול והצגת כלי הרכב על מפה.",
  "<b>שילוח דינמי</b> — לבדוק מי פנוי וקרוב ולשלוח אותו (למשל אמבולנס).",
  "<b>אזורים מגודרים (geofencing)</b> — התראות על כניסה/יציאה.",
  "תקשורת עם כלי הרכב; מעקב מלאי בשילוב <b>RFID</b>."
 ]},

 {t:"h",v:"איכון בתוך מבנים (Indoor Positioning)"},
 {t:"p",v:"ב-GPS האותות חלשים ולא זמינים בתוך מבנים (למשל ממ״ד עם גוף מתכת), ולעיתים נדרש דיוק גבוה יותר. לכן משתמשים בכלים אחרים שזמינים בטלפון: <b>מצפן, מד תאוצה, ג׳ירוסקופ, מד צעדים ומד גובה</b>."},
 {t:"ul",v:[
  "<b>Wi-Fi</b> — הטלפון דוגם את הרשת וקולט נקודות גישה ממופות; לפי <b>עוצמת האות</b> מבצעים מעין טריאנגולציה.",
  "<b>Bluetooth / BLE</b> — קולט תדרים ועוצמות ומחשב מרחקים. <b>היתרון על Wi-Fi: צריכת אנרגיה נמוכה בהרבה</b> (טווח ~50 מ׳).",
  "<b>ברקוד</b> — החיסרון: צריך לגשת פיזית לקרוא אותו, הוא קבוע ומכיל רק מידע אחד."
 ]},
 {t:"box",v:"<b>צריכת חשמל (מהנמוך לגבוה):</b> BLE (~100 ימי סוללה) ← Bluetooth 2.1 ← INS ← WLAN ← <b>GPS</b> (1–2.5 שעות בלבד)."}
]},

{u:3,title:"זרימה ברשתות",lessons:"שיעורים 5–7 · 26.5 · 2.6 · 9.6",blocks:[
 {t:"h",v:"מבנה הרשת"},
 {t:"p",v:"ברשת יש כבישים, מפעלים, לקוחות ומחסנים. לכל <b>קשת</b> מספר המייצג את הקיבולת (למשל 10 משאיות לשעה), וכן אורך ועלות נסיעה. לכל לקוח <b>דרישה (Demand)</b> ולכל ספק <b>כמות שהוא יכול לספק</b>."},
 {t:"tbl",head:["רכיב","תפקיד","סימון מאזן"],rows:[
  ["מקור / ספק / מפעל","מספק את ההיצע","<b>חיובי</b> (יוצא)"],
  ["יעד / לקוח","מייצג את הביקוש","<b>שלילי</b> (נכנס)"],
  ["נקודת ביניים / מעבר","מחסן, מרלו״ג, מתקן טיהור","<b>0</b> (נכנס = יוצא)"]
 ]},
 {t:"p",v:"<b>מאפייני בעיות זרימה:</b> <b>קיבולת</b> — המקסימום שניתן להעביר · <b>חסם תחתון</b> — לעיתים אסור לרדת מכמות מסוימת (למשל חוזים; תעלה שלא רוצים שתתייבש) · <b>עלויות</b> — קבועות (הקמה) ומשתנות (היקף שימוש)."},
 {t:"box",v:"<b>למה הקיבולת חשובה?</b> היא משפיעה על הכמות ועל הזמן. קריטי בפינוי חירום: דרכי מילוט, נקודות פינוי ברעידות אדמה, צונאמי, ובעתות מלחמה — לקיבולת הכביש חשיבות רבה לקצב הפינוי."},
 {t:"tbl",head:["שימוש","מקור (היצע)","מעבר","יעד (ביקוש)"],rows:[
  ["תפעול רשת הפצה","מקור המוצרים","אתרי אחסון","לקוחות"],
  ["טיפול באשפה מוצקה","מקור האשפה","מתקני טיהור","מטמנות"],
  ["תפעול רשת הספקה","ספקים","מחסנים","מפעלים"],
  ["תיאום תמהיל מוצרים","מפעלים","ייצור מוצרים","שווקים למוצרים"],
  ["ניהול תזרים מזומנים","מקורות","חלופות להשקעה","שימושים"]]},

 {t:"h",v:"בעיית התובלה (Transportation)"},
 {t:"p",v:"<b>הבעיה הפשוטה ביותר.</b> קיימים ספקים ולקוחות (נניח אותו מוצר); כל ספק יכול לספק לכל לקוח, ולכל שילוח יש עלות. <b>השאלה:</b> כמה להעביר מכל ספק לכל לקוח כך שסך עלות ההובלה תהיה מינימלית."},
 {t:"box",v:"<b>הערה חשובה:</b> מרחק אינו שקול ב-100% לעלות. יש עלויות שדה תעופה, דלק וכו׳ — טיסה לקפריסין יכולה להיות יקרה מטיסה לפריז; נסיעה דרך כביש 6 יכולה להגדיל עלויות."},
 {t:"ex",v:"<b>דוגמת P&T Co.:</b> 3 מפעלי שימורים ו-4 מחסנים. <b>סה״כ היצע 300 = סה״כ ביקוש 300</b> — בעיה מאוזנת. טבלת עלויות המשלוח למשאית:"},
 {t:"tbl",head:["מפעל \\ מחסן","W1","W2","W3","W4","היצע"],rows:[
  ["C1 (Bellingham)","464","513","654","867","<b>75</b>"],
  ["C2 (Eugene)","352","416","690","791","<b>125</b>"],
  ["C3 (Albert Lea)","995","682","388","685","<b>100</b>"],
  ["<b>ביקוש</b>","<b>80</b>","<b>65</b>","<b>70</b>","<b>85</b>","300"]]},
 {t:"p",v:"<b>פתרון א׳ — אלגוריתם חמדן:</b> מתחילים מהשינוע בעלות הנמוכה ביותר, מספקים כמה שאפשר, ועוברים לעלות הבאה. מהיר, אך <b>לא תמיד נותן את הפתרון האופטימלי</b> (לרוב קרוב אליו)."},
 {t:"p",v:"<b>פתרון ב׳ — תכנון לינארי:</b> פונקציית מטרה = סכום (כמות × עלות) על כל הקשתות, ורוצים <b>מינימום</b>."},
 {t:"box",v:"<b>אילוצים:</b> הכמות שיוצאת מכל ספק ≤ הכמות שיש לו (אי אפשר להוציא יותר ממה שיש) · הכמות שמגיעה לכל לקוח = הדרישה שלו · אי-שליליות (x ≥ 0) · לעיתים שלמות (INT) — כשמובילים פריטים בודדים ולא נוזלים."},

 {t:"h",v:"מאזן — היצע מול ביקוש"},
 {t:"box",v:"בעיה <b>מאוזנת</b>: סך ההיצע = סך הביקוש. כאשר אין שוויון — הבעיה <b>לא מאוזנת</b>, ומאזנים אותה:<br>• <b>היצע > ביקוש</b> ← מוסיפים <b>לקוח/יעד פיקטיבי</b> שקולט את העודף, בעלות 0.<br>• <b>ביקוש > היצע</b> ← מוסיפים <b>ספק/מקור פיקטיבי</b> שמספק את החוסר, בעלות 0.<br>המודל <b>אינו</b> הופך ללא-פתיר, ופונקציית המטרה אינה הופכת לשלילית."},

 {t:"h",v:"בעיית השיטעון (Transshipment)"},
 {t:"p",v:"בעיה מורכבת יותר: עדיין מעבירים סחורה מספקים ללקוחות עם עלויות שינוע, אך <b>יש נקודות ביניים (Transshipment points)</b> — מחסנים ומרלו״גים שדרכם הסחורה עוברת בדרך ליעד."},
 {t:"ul",v:[
  "<b>ספקים (Suppliers)</b> — מקור הסחורה.",
  "<b>לקוחות (Customers)</b> — יעד הסחורה.",
  "<b>נקודות ביניים</b> — מחסנים / מרכזים לוגיסטיים."
 ]},
 {t:"box",v:"<b>ההבדל המהותי מתובלה:</b> בתובלה הזרימה <b>ישירה</b> ממקור ליעד; בשיטעון יש <b>קודקודי ביניים</b> שבהם סך הזרימה הנכנסת חייבת להיות שווה ליוצאת (<b>שימור זרימה</b>). בנוסף, בנקודות שיטעון ייתכן שנדרש להשאיר מלאי מסוים."},
 {t:"p",v:"<b>המטרה:</b> לספק את דרישות הלקוחות תוך עמידה במגבלות המלאי של הספקים ומינימום עלויות הובלה כוללות. <b>הפתרון:</b> תיאור כבעיית תכנות לינארי ופתרון בסולבר."},

 {t:"h",v:"תכנות לינארי ופתרון בסולבר"},
 {t:"p",v:"מאחר שקשה לפתור בעיות שיטעון ידנית, מגדירים שלושה מרכיבים:"},
 {t:"ul",v:[
  "<b>פונקציית מטרה</b> — ביטוי המייצג את העלות הכוללת: סכום של (כמות × עלות ליחידה) על כל קשת. השאיפה: <b>מינימום</b>.",
  "<b>משתני החלטה</b> — X<sub>ij</sub>: כמות הסחורה שעוברת מקודקוד i לקודקוד j.",
  "<b>אילוצים</b> — היצע, ביקוש, שימור זרימה, אי-שליליות ולעיתים שלמות."
 ]},
 {t:"ex",v:"<b>דוגמה מהשיעור:</b> סנדוויל = −45 (יוצאת ממנו כמות), אמרילו = 80 (נכנסת אליו). על הקשת עלות 250 להובלת פריט אחד. הכמות מסומנת X<sub>16</sub> (מקודקוד 1 לקודקוד 6) ומוכפלת ב-250. כך סוכמים את כל הקשתות: כל עלות × משתנה ההחלטה שלה."},
 {t:"box",v:"<b>למה צריך אילוצים?</b> בלי אילוצים אפשר להציב 0 בכל המשתנים ולקבל עלות 0 — אבל אז לא יעבור כלום, ואנחנו חייבים לספק סחורה."},
 {t:"p",v:"<b>שלבי העבודה בסולבר (Excel):</b> מפעילים את תוספת ה-Solver (קובץ ← אפשרויות ← תוספות) ← מופיע בלשונית <b>DATA</b> ← מסמנים את תא <b>פונקציית המטרה</b> ← מסמנים את תאי <b>משתני ההחלטה</b> לשינוי ← בוחרים <b>מינימום</b> ← מוסיפים אילוצים (ADD; אפשר להגדיר טווח שלם במקום אילוץ-אילוץ) ← מוסיפים אילוץ <b>INT</b> ואילוץ ≥ 0 ← <b>Solve</b>."},
 {t:"box",v:"<b>הערה:</b> ניתן להגדיר בסולבר <b>רק פונקציית מטרה אחת</b>. שימושי: <b>SUMPRODUCT</b> — מכפילה איבר-איבר בין שני טווחים וסוכמת."},
 {t:"box",v:"<b>המרצה אמר במפורש:</b> ״לא תהיה לכם שאלה כזאת במבחן [של אקסל/סולבר]. אתם לא יכולים לפתור את זה.״ — הסולבר נדרש רק לתרגיל ההגשה."},

 {t:"h",v:"בעיית הזרימה המקסימלית (Max Flow)"},
 {t:"p",v:"בגרף שמייצג רשת, המספרים על הקשתות הם <b>הקיבולת</b> של כל קשת. השאלה: <b>כמה ניתן להעביר מ-O ל-T אם משתמשים בכל הרשת בו-זמנית?</b> (לא מחפשים מסלול אחד)."},
 {t:"ex",v:"<b>חסם ראשוני:</b> אם מ-O יוצאות קשתות בקיבולת 5+7+4 = 16, ואל T נכנסות 9+6 = 15 — הזרימה המקסימלית <b>לא יכולה לעבור 15</b> (המינימום מביניהם)."},
 {t:"p",v:"<b>רשת שיורית (Residual Network):</b> לכל קשת בגרף המקורי בונים גם <b>קשת בכיוון ההפוך</b> עם ערך התחלתי 0. אפשר לרשום שני מספרים על כל קשת במקום לצייר גרף נוסף."},
 {t:"box",v:"<b>אלגוריתם פורד-פולקרסון:</b><br>1. מצא <b>מסלול אוגמנטי</b> כלשהו מהמקור ליעד, שבו הזרימה השיורית בכל הקשתות > 0.<br>2. זהה את <b>f</b> = הקיבולת <b>המינימלית</b> באותו מסלול (צוואר הבקבוק).<br>3. <b>הפחת f</b> מהקשתות הישרות ו<b>הוסף f</b> לקשתות ההפוכות.<br>4. חזור עד שאין יותר מסלולים אפשריים.<br><b>הזרימה המקסימלית = סכום כל ערכי f.</b>"},
 {t:"box",v:"<b>למה צריך קשתות חוזרות?</b> הן מאפשרות ״לבטל״ זרימה שהוקצתה בטעות בצעד קודם ולנתב אותה מחדש — מגדילות את האופציות ומאפשרות להגיע לאופטימום."},
 {t:"ex",v:"<b>ההמחשה מהמצגת (שקף 20):</b> רשת קטנה S→V1, S→V2, V2→V1, V1→T, V2→T שבה <b>כל הקיבולות = 1</b>. בחירת המסלול S→V2→V1→T ״חוסמת״ את הרשת — והקשת החוזרת היא שמאפשרת לתקן ולהגיע לזרימה המקסימלית."},
 {t:"ex",v:"<b>דוגמה פתורה (שקפים 14–15):</b> ברשת O–A–B–C–D–E–T עם קיבולות O→A=5, O→B=7, O→C=4, A→B=1, A→D=3, B→C=2, B→D=4, B→E=5, C→E=4, E→D=1, D→T=9, E→T=6 — הזרימה בפועל: O→A=4, O→B=7, O→C=3, A→B=1, A→D=3, B→D=4, B→E=4, C→E=3, E→D=1, D→T=8, E→T=6.<br><b>הזרימה המקסימלית = 14</b> (4+7+3 יוצא מהמקור = 8+6 נכנס ליעד)."},
 {t:"p",v:"<b>ריבוי מקורות ויעדים:</b> מוסיפים <b>סופר-מקור</b> ו<b>סופר-יעד</b> דמיוניים בקיבולת <b>אינסופית</b>, המחוברים לכל הנקודות הרלוונטיות. זה לא משנה את הזרימה (שנקבעת לפי הערך המינימלי) ומאפשר להשתמש באותו אלגוריתם."},

 {t:"h",v:"החתך המינימלי (Min Cut)"},
 {t:"p",v:"<b>חתך</b> = מחיקת קבוצת קשתות כך שלא נותר מסלול מ-S ל-T. <b>ערך החתך</b> = סך הקיבולות של הקשתות שבו. מחפשים חתך בעל ערך <b>מינימלי</b>."},
 {t:"box",v:"<b>משפט Max-Flow / Min-Cut:</b> החתך המינימלי הוא הבעיה <b>הדואלית</b> של הזרימה המקסימלית — <b>ערך הזרימה המקסימלית = ערך החתך המינימלי</b>. כדי למצוא את החתך פותרים תחילה את הזרימה המקסימלית; הקשתות של החתך הן אלו ש<b>הזרימה בהן שווה לקיבולת</b> (הקשתות הרוויות — צוואר הבקבוק)."},
 {t:"p",v:"<b>אילוצי קיבולת בתכנון לינארי:</b> בנוסף לאילוצי המאזן, מוסיפים אילוץ שהכמות בקשת לא תעלה על הקיבולת. גם אם העלות נמוכה — ייתכן שנהיה מוגבלים בקיבולת הקשת."},
 {t:"h",v:"בעיית מינימום עלות (Minimum Cost Flow) — דוגמה פתורה"},
 {t:"p",v:"זו הבעיה הכללית שממנה תובלה ושיטעון הן מקרים פרטיים. הדוגמה מהמצגת (שקפים 26–27):"},
 {t:"box",v:"<b>פונקציית מטרה:</b> min Z = 2x<sub>AB</sub> + 4x<sub>AC</sub> + 9x<sub>AD</sub> + 3x<sub>BC</sub> + x<sub>CE</sub> + 3x<sub>DE</sub> + 2x<sub>ED</sub>"},
 {t:"ul",v:[
  "<b>A [50]:</b> x<sub>AB</sub> + x<sub>AC</sub> + x<sub>AD</sub> = 50 — מקור (מאזן חיובי)",
  "<b>B [40]:</b> −x<sub>AB</sub> + x<sub>BC</sub> = 40",
  "<b>C [0]:</b> −x<sub>AC</sub> − x<sub>BC</sub> + x<sub>CE</sub> = 0 — <b>קודקוד מעבר</b>",
  "<b>D [−30]:</b> −x<sub>AD</sub> + x<sub>DE</sub> − x<sub>ED</sub> = −30 — יעד (מאזן שלילי)",
  "<b>E [−60]:</b> −x<sub>CE</sub> − x<sub>DE</sub> + x<sub>ED</sub> = −60 — יעד",
  "<b>אילוצי קיבולת:</b> x<sub>AB</sub> ≤ 10 · x<sub>CE</sub> ≤ 80 · אי-שליליות: x<sub>ij</sub> ≥ 0"]},
 {t:"box",v:"<b>הפתרון האופטימלי:</b> x<sub>AD</sub> = 10 · x<sub>AC</sub> = 40 · x<sub>BC</sub> = 40 · x<sub>CE</sub> = 80 · x<sub>ED</sub> = 20 · x<sub>AB</sub> = 0 &nbsp;←&nbsp; <b>Z = 490</b>"}
]},

{u:4,title:"מיקום מתקנים",lessons:"שיעורים 8 · 16.6",blocks:[
 {t:"h",v:"הבעיה"},
 {t:"p",v:"הצורך למצוא <b>מיקום אופטימלי למתקן</b> — מרלו״ג, מפעל, תחנת כיבוי אש, מוקד שילוח — כשלכל אחד המטרות והאילוצים שלו."},
 {t:"ex",v:"<b>דוגמת סן פרנסיסקו:</b> ניתוח GIS יוצר <b>מפת חום</b> של זמני הגעה לבתי חולים קיימים (5 / 10 / 20 דקות). המטרה <b>אינה</b> להתחרות בבתי חולים קיימים, אלא לזהות את ה״אזורים הצהובים״ — בעלי רמת שירות נמוכה וזמני הגעה ארוכים — ולמקם שם את המתקן החדש כדי להרחיב את הכיסוי."},

 {t:"h",v:"סוגי מתקנים"},
 {t:"ul",v:[
  "<b>מרכז הפצה</b> — אחסון והפצה ליעד הסופי + פעולות משלימות (איחוד, אריזה).",
  "<b>מחסן</b> — לאחסון בלבד.",
  "<b>שטעון / Cross-docking</b> — מעבר סחורה <b>ללא אחסון</b>: מעמדת פריקה ישירות לעמדת טעינה.",
  "<b>נמלים</b> — הובלה ארוכת טווח, יבוא/יצוא, ממשק לאמצעי תובלה נוספים (כולל אזור סחר חופשי ונמל עורפי).",
  "<b>מסופים</b> — Intermodal (רב-אמצעי), מסוף צובר (למשל צינורות גזים), מסוף רכזת (Hub), מסוף עירוני.",
  "<b>מרכז לוגיסטי משולב</b> — פארק תעשייתי / ״עיר״ לוגיסטית."
 ]},
 {t:"box",v:"<b>שני סוגים עיקריים:</b> מרלו״גים גדולים מחוץ לעיר באזורי תעשייה · מרכזי הפצה מקומיים קטנים יותר לשירות אזורי."},

 {t:"h",v:"שלבים בבחירת מיקום"},
 {t:"p",v:"1. תכנון ואסטרטגיה ← 2. עיצוב רשת ← 3. סינון אתרים ← 4. בדיקת שטח וניתוח כספי ← 5. משא ומתן ובחירת אתר."},
 {t:"h",v:"לוגיסטיקה עירונית"},
 {t:"box",v:"<b>הבעיות:</b> תאונות · רעש (נסיעה ופריקה) · זיהום. מרלו״ג מחוץ לעיר יוצר גם בעיית נגישות.<br><b>הפתרונות:</b> הגבלת תנועה · הספקה מחוץ לשעות הפעילות · <b>חלונות זמן</b> שהרשות מגדירה · פריקה יעילה (ניצול עמדות, קיצור משך הפריקה) · מערכות מידע · הבחנה סינכרוני/אסינכרוני."},

 {t:"h",v:"השפעות של מיקום מתקן"},
 {t:"tbl",head:["השפעות תחבורתיות","השפעות כלכליות"],rows:[
  ["תנועת כלי רכב (עירוני או לא, תח״צ או רכב פרטי)","פיתוח תשתיות (אזורי תעשייה חדשים)"],
  ["עלויות נסיעה","פעילות כלכלית במתקן"],
  ["שרשרת ההספקה","פיתוח כלכלי של האזור"],
  ["סביבה, זיהום ורעש (למשל רמת חובב)","משיכת עסקים"],
  ["אנרגיה · בטיחות ובטחון",""]
 ]},

 {t:"h",v:"גורמים המשפיעים על הבחירה"},
 {t:"ul",v:[
  "<b>נגישות לשווקים</b> — קרבה לשווקים שאיתם עובדים, להוזלת עלויות שינוע (מרחק וזמן).",
  "<b>נגישות לרשת התחבורה</b> — קישור לכבישים ארציים, שדות תעופה.",
  "<b>אמצעי הובלה</b> — האם קיימים רכבות, מטוסים וכו׳.",
  "<b>עבודה וכוח אדם</b> — קרבה למקומות עירוניים שיש בהם כח אדם.",
  "<b>תשתיות</b> ו<b>מתקנים מתאימים</b> — האם קיימים או שצריך להקים מחדש.",
  "<b>תקנות וחוקים · מיסוי · סיוע ציבורי</b>.",
  "<b>מזג אוויר</b> — רלוונטי בעיקר בארה״ב (אזורי הוריקן/טורנדו)."
 ]},

 {t:"h",v:"לוגיסטיקה עירונית"},
 {t:"p",v:"<b>בעיות המרכזים הלוגיסטיים:</b> רעש · עבודה 24 שעות ביממה · תנועת כלי רכב רבה (תאונות וזיהום) · מרלו״ג מחוץ לעיר יוצר בעיית נגישות וזמינות. לכן בונים מרכזים קטנים יותר לשירות האזור הקרוב."},
 {t:"p",v:"<b>פתרונות לעומסי חלוקה בעיר:</b> הגבלת תנועה ברחובות מסוימים בשעות מסוימות · אספקה מחוץ לשעות הפעילות (מוקדם בבוקר / מאוחר בערב) · <b>חלונות זמן</b> שהעירייה מגדירה לכניסה לעיר · שיטות פריקה יעילות."},
 {t:"box",v:"<b>חלון זמן</b> = פרק הזמן שבו אמורים לתת שירות ללקוח. למשל סופר שמקבל סחורה מהמון ספקים — מחלקים אותם לחלונות זמנים."},

 {t:"h",v:"עלות מול מרחק — ה-Trade-off"},
 {t:"box",v:"ככל שמתרחקים מאזורים עירוניים <b>עלויות הקרקע יורדות</b>, אך <b>השינוע מתרחק מהשווקים</b> ומתייקר. מחברים את שתי העלויות ומקבלים <b>עקומת U</b> — העלות הכוללת המינימלית מתקבלת ב<b>נקודת ביניים</b>, לא בקצוות."},

 {t:"h",v:"סיווג מודלים"},
 {t:"tbl",head:["סיווג","הסבר"],rows:[
  ["<b>בדיד מול רציף</b>","בדיד — אפשר להתמקם רק ממקומות מוגדרים שצריך לבחור ביניהם. רציף — אפשר לבחור כל נקודה במרחב."],
  ["<b>סטטי מול דינמי</b>","סטטי — מיקום הלקוחות, הכמויות וזהות הלקוחות קבועים (מקל על ההחלטה). דינמי — משתנים כל הזמן."],
  ["<b>דטרמיניסטי מול סטוכסטי</b>","דטרמיניסטי — הנתונים ידועים. סטוכסטי — יש אקראיות; יודעים רק הסתברות וסטיית תקן, לא כמות מדויקת."],
  ["<b>אופן חישוב מרחק</b>","מפורש (ברשת בפועל ב-GIS — מדויק) · אוקלידי (קו אווירי) · Rectilinear (לאורך צירי X ו-Y)."]
 ]},
 {t:"ex",v:"<b>דוגמת מוכר הגלידה בחוף:</b> אם מותר לו לעמוד בכל נקודה בחוף — <b>מודל רציף</b>. אם רק ממקומות מוגדרים מראש — <b>מודל בדיד</b>."},
 {t:"ex",v:"<b>דוגמה בדיד מול רציף:</b> נדרש מרלו״ג במרחק שלא יעלה על 100 ק״מ מכל לקוח, עם אפשרויות A, B, C. אם A רחוק 120 ק״מ מ-C — <b>אין פתרון בדיד</b> שעומד באילוץ. במודל רציף היה ניתן למקם בדיוק בנקודת 100 ק״מ."},
 {t:"box",v:"<b>הערכת מרחק:</b> <b>קו אווירי</b> קצר מהמציאות ← הערכת <b>חסר</b> (אפשר לפצות: להגדיר 40 ק״מ אווירי כדי לקבל ~50 בפועל). <b>מדידה לאורך צירים</b> (לנוע ב-Y ואז ב-X) ← הערכה <b>מחמירה</b>, בד״כ ארוכה מהמסלול המפורט."},

 {t:"h",v:"ריבוי פונקציות מטרה וחזית פארטו"},
 {t:"p",v:"בשנים האחרונות מדברים על בעיות אופטימיזציה עם יותר ממטרה אחת — למשל <b>מינימום עלות</b> מול <b>מקסימום שביעות רצון לקוחות</b>. בד״כ הן פוגעות זו בזו: הורדת עלויות פוגעת בשירות."},
 {t:"box",v:"פותרים את שתי הבעיות <b>בו-זמנית</b> ומקבלים <b>סט של פתרונות</b> — <b>חזית פארטו (Pareto Front)</b>: אוסף הפתרונות ה<b>לא-נשלטים</b>, שבהם אי אפשר לשפר מטרה אחת בלי לפגוע באחרת. כולם ״טובים באותה מידה״, והארגון בוחר לפי המשקלים וההעדפות שלו. נקודה שנשלטת (נחותה) אינה על החזית."},

 {t:"h",v:"מודלי מיקום"},
 {t:"tbl",head:["מודל","המטרה"],rows:[
  ["<b>P-Median</b>","מזעור <b>סכום המרחקים המשוקלל בביקוש</b> (מרחק × ביקוש) — מטרת עלות כוללת."],
  ["<b>Min-Max</b>","מזעור המרחק/הזמן אל <b>הלקוח המרוחק ביותר</b> — מטרת הוגנות ורמת שירות."],
  ["<b>כיסוי מקסימלי</b>","מקסום סך <b>הביקוש המכוסה</b> בתוך טווח כיסוי נתון (D<sub>c</sub>), במספר מתקנים מוגבל (P)."],
  ["<b>Hub &amp; Spokes</b>","רשת היררכית — מרכזי-על (Hubs) וחישורים (Spokes). יעיל לקונסולידציה (קווי תעופה, שילוח)."]
 ]},
 {t:"box",v:"<b>שים לב — המודל שבוחרים משנה את התוצאה!</b> חלופה א׳: 5+10+20 = 35 · חלופה ב׳: 15+10+15 = 40. לפי <b>P-Median</b> עדיפה א׳ (35 < 40); לפי <b>Min-Max</b> עדיפה ב׳ (מקסימום 15 מול 20)."},

 {t:"h",v:"מיקום מתקן יחיד — שיטת החציון המשוקלל"},
 {t:"p",v:"כאשר יש לקוחות במיקומים ידועים ולכל אחד <b>משקל</b> (למשל כמות סטודנטים), משתמשים בשיטת החציון כדי למזער את סך מרחקי ההליכה/ההובלה:"},
 {t:"ul",v:[
  "<b>1. מיון</b> — ממיינים את הנקודות לפי ציר X בנפרד ולפי ציר Y בנפרד.",
  "<b>2. משקל מצטבר</b> — מחשבים את סך המשקלים ומוצאים את החציון (סך המשקל ÷ 2).",
  "<b>3. מציאת המיקום</b> — המיקום האופטימלי בציר הוא הנקודה שבה המשקל המצטבר <b>עובר לראשונה</b> את ערך החציון. חוזרים על התהליך לציר השני."
 ]},
 {t:"ex",v:"<b>דוגמת הספרייה:</b> הנדסה (0,0)=190 · מנע״ס (5,13)=310 · חינוך (8,18)=280 · מדעי הרוח (6,3)=530 · משפטים (14,20)=320 · מדעים (10,12)=410. <b>סה״כ 2,040 ← חציון 1,020.</b><br><b>ציר X:</b> 0(190) ← 5(500) ← <b>6(1030)</b> ✔ חוצה את 1,020 ← X* = 6.<br><b>ציר Y:</b> 0(190) ← 3(720) ← <b>12(1130)</b> ✔ ← Y* = 12.<br><b>המיקום: (6, 12)</b> — ואז בודקים אם אין שם בניין קיים."},
 {t:"box",v:"<b>קריטי:</b> הפתרון הוא <b>חציון משוקלל</b> — <b>לא ממוצע</b> ולא מרכז גיאומטרי!"},

 {t:"h",v:"גבול הפצה (Delivery Boundary)"},
 {t:"p",v:"כאשר לקוח יכול להיות משורת מהמפעל או ממרכז הפצה, <b>גבול ההפצה</b> הוא <b>נקודת שוויון העלויות</b> — המקום שממנו ואילך זול יותר לספק מהמקור השני."},
 {t:"ex",v:"עלות מהמפעל: 1 + 0.06x. עלות ממרכז ההפצה (במרחק 200 ק״מ): 2.5 + 0.4 + 0.04·(200−x). משווים ← <b>x = 99 ק״מ</b>."}
]},

{u:5,title:"ניתוב רכבים",lessons:"שיעורים 9–10 · 23.6 · 30.6 · 7.7",blocks:[
 {t:"h",v:"מבוא"},
 {t:"p",v:"ניתוב רכבים הוא <b>סדרה של בעיות</b> שבהן צריך לקבוע מסלולים — לרכב אחד או יותר. לכל בעיה האילוצים והמטרות שלה. הנקודה המרכזית: <b>לדעת להבחין בין הבעיות</b>."},
 {t:"p",v:"<b>ייצוג ברשת:</b> משתמשים ב<b>גרף</b> — קודקודים מייצגים צמתים, קשתות מייצגות כבישים. לכל קשת אפשר לשייך מספר שמייצג מה שרוצים: מהירות, קיבולת, זמן נסיעה, עומס או עלות. המספרים נקראים <b>משקלים</b>."},
 {t:"box",v:"כשאומרים ״מסלול קצר ביותר״ — <b>זה לא תמיד באמת הקצר</b>; תלוי במה שהמספרים מייצגים (זמן, מרחק, עלות)."},

 {t:"h",v:"בעיית המסלול הקצר ביותר"},
 {t:"p",v:"יש נקודת מוצא ונקודת יעד, ומחפשים את המסלול הזול ביותר במונחי זמן, מרחק או עלות (Waze / Google Maps). ייתכנו <b>שני מסלולים בעלי אותו אורך או זמן</b>."},
 {t:"box",v:"<b>K-Shortest Paths:</b> K המסלולים הקצרים ביותר. כשנערכים לתרחיש חירום וצריך נתיבי פינוי, <b>אי אפשר לתכנן רק נתיב אחד</b> — ייתכן שלא יהיה זמין. לכן מכינים מראש סט מסלולים, ואם הקצר ביותר חסום עוברים לבא בתור."},
 {t:"box",v:"<b>האלגוריתם (שקף 7) — 5 שלבים:</b><br>1. מצא את המסלול הקצר ביותר, N=1.<br>2. צרף לרשימת המועמדים את כל <b>ההטיות</b> של מסלול N.<br>3. מיין את הרשימה לפי אורכי המסלולים, N=N+1.<br>4. המסלול הקצר ביותר ברשימה הוא המסלול ה-N הקצר ביותר.<br>5. אם N=K — סיים; אחרת חזור לשלב 2."},

 {t:"h",v:"אלגוריתם דייקסטרה (Dijkstra)"},
 {t:"p",v:"פותח ב-<b>1959</b> ע״י מדען המחשב ההולנדי <b>אדסחר דייקסטרה</b>. אלגוריתם ישן, פשוט וקל להבנה — ומשתמשים בו עד היום."},
 {t:"box",v:"<b>מה הוא עושה:</b> הוא <b>אינו</b> מחשב מסלול מקודקוד אחד לקודקוד שני בלבד — אלא מוצא <b>בבת אחת</b> את אוסף המסלולים הקצרים <b>מקודקוד המוצא לכל שאר הקודקודים</b> (Single-source). בגרף עם 6 קודקודים נקבל 5 מסלולים. <b>אין הגדרת יעד</b> — הוא פותר לכל היעדים האפשריים."},
 {t:"p",v:"<b>שלבי האלגוריתם:</b>"},
 {t:"ul",v:[
  "<b>אתחול</b> — לקודקוד המוצא מרחק 0; לכל השאר <b>אינסוף</b> (עדיין לא יודעים איך להגיע אליהם).",
  "<b>בחירה</b> — בוחרים מבין הקודקודים שטרם טופלו את זה שהמרחק אליו <b>הקצר ביותר</b> (הצעד ה״חמדני״).",
  "<b>עדכון (Relaxation)</b> — בוחנים את שכניו: אם המרחק החדש קטן מהרשום — מוחקים ורושמים את החדש; אם גדול — לא נוגעים.",
  "<b>חזרה</b> — ממשיכים תמיד מהקודקוד עם המרחק הקטן ביותר שנותר, עד שמסיימים."
 ]},
 {t:"box",v:"<b>הסימון על הגרף:</b> ליד כל קודקוד רושמים <b>מרחק/קודקוד-אב</b> — למשל <b>7/v6</b> פירושו: המרחק המינימלי הוא 7, והגענו לכאן מ-v6. <b>שחזור המסלול</b> נעשה ע״י הליכה אחורה לפי קודקודי האב."},
 {t:"box",v:"<b>הגרף בדוגמה (שקף 8):</b> V1→V2=8 · V1→V4=4 · V2→V3=2 · V2→V4=6 · V2→V6=4 · V6→V2=2 · V6→V3=7 · V4→V6=1 · V4→V5=4 · V5→V6=4 · V6→V5=5.<br><b>סדר העיבוד:</b> V1(0) ← V4(4) ← V6(5) ← V2(7 — עודכן מ-8) ← V5(8) ← V3(9 — עודכן מ-12). המצגת מקדישה לכך <b>9 שקפים של הרצה צעד-אחר-צעד</b> — סימן שזה נושא מרכזי."},
 {t:"ex",v:"<b>התוצאה הסופית (מוצא V1):</b><br>V1→V2 = <b>7</b> (V1-V4-V6-V2) · V1→V3 = <b>9</b> (V1-V4-V6-V2-V3) · V1→V4 = <b>4</b> (V1-V4) · V1→V5 = <b>8</b> (V1-V4-V5) · V1→V6 = <b>5</b> (V1-V4-V6)."},
 {t:"box",v:"<b>המגבלה (שאלת מבחן!):</b> דייקסטרה <b>אינו מתמודד עם משקלים שליליים</b>. הסיבה: הוא חמדני — ברגע שקודקוד סומן כ<b>קבוע</b>, מניחים שהמרחק אליו מינימלי; אם בהמשך הרשת יש משקל שלילי שעשוי להציע מרחק קצר יותר, האלגוריתם <b>כבר לא יעדכן</b> אותו.<br><b>הערת המרצה:</b> ״בעולם שלנו במקרים נדירים ניתקל במשקל שלילי (זמן/מהירות/מרחק אינם שליליים), ולכן האלגוריתם רלוונטי לנו למרות המגבלה.״"},

 {t:"h",v:"אלגוריתם חמדני (Greedy)"},
 {t:"p",v:"<b>משפחה של אלגוריתמים</b>, לא אלגוריתם ספציפי. עובדים בצעדים, ובכל צעד עושים את הפעולה שנותנת את מירב התועלת <b>באותו רגע</b> — בלי להסתכל על ההשפעה העתידית."},
 {t:"box",v:"ייתכן שבחירה שנראית הכי טובה כרגע <b>לא תהיה טובה בהמשך</b>. לכן חמדני יכול לעבוד באופן מושלם (דייקסטרה — אופטימלי) או לתת רק <b>פתרון מקורב</b> (TSP). היתרון: מהיר, לא צריך לסרוק את כל הפתרונות."},

 {t:"h",v:"בעיית הסוכן הנוסע (TSP)"},
 {t:"p",v:"משאית צריכה לעבור במספר נקודות ולחזור לנקודת המוצא (המרלו״ג). <b>בהינתן שאין אילוצים</b> (עיתוי או סדר) — מה הסדר של הקודקודים שייתן את המסלול הקצר ביותר?"},
 {t:"box",v:"<b>הגדרה:</b> מציאת <b>מעגל המילטוני בעל משקל מינימלי</b>. <b>מסלול המילטוני</b> = עובר בכל קודקודי הגרף פעם אחת בלבד; <b>מעגל המילטוני</b> = גם חוזר לקודקוד ההתחלה. מוגדרת עבור <b>גרף שלם</b> (קשת בין כל זוג קודקודים)."},
 {t:"box",v:"<b>הבעיה שייכת ל-NP-Hard</b> — במדעי המחשב לא מצליחים למצוא אלגוריתם יעיל שפותר אותה. מספר האפשרויות גדל בקצב <b>עצרתי</b>: ב-10 ערים כבר ~מיליוני מסלולים; המעבר מ-100! ל-101! הוא הכפלה ב-101. <b>הדרך היחידה למצוא אופטימום היא לנסות את כל האפשרויות — וזה לא מעשי.</b> (לא הוכח ש-NP היא בעיה ללא פתרון.)"},
 {t:"p",v:"<b>Brute Force (״כוח גס״):</b> הדרך הפשוטה והנאיבית — המחשב מייצר את כל המסלולים האפשריים, מחשב את המרחק של כל אחד ובוחר את הקצר. מבטיח אופטימום אך בלתי מעשי."},
 {t:"box",v:"<b>אלגוריתם השכן הקרוב ביותר (Nearest Neighbor)</b> — היוריסטיקה <b>חמדנית</b>: בוחרים קודקוד התחלה, ובכל צעד עוברים לקודקוד <b>הקרוב ביותר שטרם ביקרנו בו</b>, עד שמסיימים.<br><b>חסם הביצועים:</b> S<sub>opt</sub> ≤ S<sub>alg</sub> ≤ <b>2 · S<sub>opt</sub></b> — לעולם לא גרוע מפי 2 מהאופטימום, אך לא מובטח אופטימלי."},
 {t:"box",v:"<b>נקודה חשובה:</b> מכיוון שזה מסלול מעגלי, אפשר להתחיל בנקודה אחרת — <b>ושינוי נקודת ההתחלה יכול להוביל לתוצאה שונה לחלוטין</b>, אף שהמסלול עדיין מבקר באותן נקודות."},
 {t:"p",v:"<b>הערת המרצה:</b> ״AI לא יכול לחשוב במקומנו, ולא יכול לעשות דברים שאנחנו לא יודעים לעשות.״"},

 {t:"h",v:"בעיית מחלק הדואר הסיני"},
 {t:"p",v:"בסוכן הנוסע חיפשנו מסלול שעובר בכל <b>הקודקודים</b>; כאן מחפשים מסלול שיעבור בכל <b>הקשתות</b> של הגרף."},
 {t:"box",v:"<b>ההבחנה המרכזית:</b> מחלק הדואר = כל ה<b>קשתות</b> · סוכן נוסע = כל ה<b>קודקודים</b>."},
 {t:"p",v:"לא בכל גרף ניתן לעבור בכל קשת בדיוק פעם אחת. לא רוצים לעבור פעמיים על קשת — זה עולה זמן וכסף. <b>השאלה:</b> על אילו קשתות צריך לעבור פעם נוספת כך שהתוספת תהיה <b>מינימלית</b>?"},
 {t:"p",v:"<b>שימושים:</b> חלוקת דואר · איסוף אשפה · טאטוא רחובות · תכנון מסלול הליכה במוזיאון."},

 {t:"h",v:"בעיית ניתוב רכבים (VRP)"},
 {t:"p",v:"בסוכן הנוסע אין אילוצים מלבד פונקציית המטרה. אבל אם יש משאית והרבה לקוחות — <b>ייתכן שלא יהיה מספיק מקום במשאית</b> לספק את כל הסחורה, ואז נוציא עוד משאית."},
 {t:"box",v:"<b>המעבר מ-TSP ל-VRP — האילוץ שמתווסף הוא קיבולת הרכב.</b> בסוכן נוסע סוכן אחד עובר בין כל הלקוחות; ב-VRP לא ניתן — צריך <b>מספר רכבים ומספר מסלולים</b>. גם בעיה זו <b>בלתי פתירה אופטימלית</b> ← פתרונות מקורבים."},
 {t:"p",v:"<b>מאפייני הבעיה:</b>"},
 {t:"ul",v:[
  "<b>גודל הצי</b> — רכב בודד או צי; האם המסלול מאפשר כמה נסיעות ביום.",
  "<b>סוג הצי</b> — הומוגני או הטרוגני (משאיות קטנות/גדולות), רכבים מיוחדים (קירור, דלק, חומ״ס).",
  "<b>מיקום כלי הרכב</b> — מחסן אחד (קל) או כמה. אם רכב מסיים במחסן השני, ייתכן שבראשון לא יהיו רכבים למחר.",
  "<b>אופי הביקוש</b> — דטרמיניסטי (קבוע, קל לתכנן) או סטוכסטי (אקראי — לא יודעים כמה ייקחו; ייתכן מחסור או עודף).",
  "<b>סוג הרשת</b> — <b>כביש דו-סטרי מכפיל את הרשת</b> (ההלוך שונה מהחזור) ומקשה יותר מרשת חד-סטרית.",
  "<b>מגבלות זמן ומרחק</b> — לא רוצים משאית שנוסעת שעה לצד אחרת שנוסעת 10 שעות.",
  "<b>תפעול</b> — אספקה, איסוף או שניהם; סידור המשאית שתהיה מאוזנת במשקל.",
  "<b>עלויות</b> — קבועות (תפעול, רכש, פחת), משתנות (דלק), וקנסות."
 ]},
 {t:"p",v:"<b>פונקציות מטרה אפשריות:</b> מינימום עלות ניתוב · מינימום עלויות כולל · מינימום מספר רכבים · מקסימום תועלת למפעיל או ללקוח."},

 {t:"h",v:"⬜ אלגוריתם Savings (Clarke & Wright) — ירד מהמיקוד"},
 {t:"box",v:"⬜ <b>מחוץ לגזרת המבחן.</b> האלגוריתם (S<sub>ij</sub> = C<sub>i0</sub> + C<sub>0j</sub> − C<sub>ij</sub>) הופיע במצגת הישנה של יחידה 5, אך <b>נחתך מהגרסה המעודכנת</b> שהמרצה מסר כחומר למבחן. מובא כאן לזיהוי בלבד — <b>אל תשקיעו בו זמן לימוד</b>."},

 {t:"h",v:"הרחבות של VRP"},
 {t:"ul",v:[
  "<b>חלונות זמן (Time Windows)</b> — פרק הזמן שבו צריך להגיע ללקוח. יכול להיות קשיח, גמיש או מרובה.",
  "<b>בעיות דינמיות</b> — ההזמנות נכנסות תוך כדי הנסיעה ולא ניתן לבנות מסלול מראש (למשל פיצרייה).",
  "<b>Dial-A-Ride</b> — שילוב של דינמי עם חלונות זמן (הסעות לפי דרישה).",
  "<b>סטטי מול דינמי</b> · <b>MOP</b> — מספר פונקציות מטרה בו-זמנית.",
  "<b>MOP (Multi-Objectives Programming)</b> — מספר פונקציות מטרה בו-זמנית.",
  "<b>E-VRP</b> — תכנון מסלול ל<b>רכבים חשמליים</b>; מחייב התייחסות ל<b>מיקום תחנות הטעינה</b>, וטעינה אורכת יותר זמן מתדלוק. ⬜ (ענפי Green-VRP הנוספים, הרחפנים והרכבים האוטונומיים <b>נחתכו מהמיקוד</b>.)"
 ]},

 {t:"h",v:"⬜ מערך התובלה — רקע ניהולי (ירד מהמיקוד)"},
 {t:"box",v:"⬜ <b>מחוץ לגזרה.</b> מרכיבי מערך השילוח ושלבי התכנון נחתכו מהמצגת המעודכנת."}
]}
];

function blockHTML(b){
  if(b.t==="h")   return `<h3>${b.v}</h3>`;
  if(b.t==="p")   return `<p>${b.v}</p>`;
  if(b.t==="ul")  return `<ul>${b.v.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.t==="box") return `<div class="bk-box">${b.v}</div>`;
  if(b.t==="ex")  return `<div class="bk-ex">${b.v}</div>`;
  if(b.t==="tbl") return `<div class="tb-scroll"><table class="tb"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}

let bankAnswers=true;
function renderBank(){
  const byUnit={};
  QUESTIONS.forEach((q,i)=>{(byUnit[q.u]=byUnit[q.u]||[]).push({...q,i});});
  let n=0;
  const sections=Object.keys(byUnit).sort().map(u=>{
    const list=byUnit[u].sort((a,b)=>(a.prof?0:1)-(b.prof?0:1));
    return `<div class="sheet">
      <h2 style="color:${UNITS[u].hex};border-color:${UNITS[u].hex}">${u==6?esc(UNITS[u].name):"יחידה "+u+" — "+esc(UNITS[u].name)} <span style="font-weight:600;font-size:12px;color:#5b6675">(${list.length} שאלות)</span></h2>
      ${list.map(q=>{n++;return `<div class="bank-q">
        <div><span class="bank-n">שאלה ${n}</span>${q.prof?'<span class="bank-star">⭐ שאלת מרצה</span>':''}${q.past?'<span class="bank-past">📎 ממבחן קודם</span>':''}${q.cut?'<span class="bank-cut">⬜ ירד מהמיקוד</span>':''}${q.bank?'<span class="bank-bank">📚 מאגר חיצוני</span>':''}</div>
        ${q.s?`<div class="bank-s">${esc(q.s)}</div>`:''}
        <div class="bank-qt">${esc(q.q)}</div>
        ${q.o.map((o,j)=>`<div class="bank-o ${j===q.a?'is-ans':''}">${LETTERS[j]}. ${esc(o)}${j===q.a?' ✔':''}</div>`).join("")}
        <div class="bank-e"><b>הסבר:</b> ${esc(q.e)}</div>
      </div>`;}).join("")}
    </div>`;
  }).join("");
  main.innerHTML=`<div class="wrap">
    <div class="page-head">
      <div><h1>כל השאלות</h1><p>${QUESTIONS.length} שאלות · מתוכן ${PROF_COUNT} שאלות מרצה (⭐) · תשובות מסומנות ✔ עם הסבר</p></div>
      <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="toggleAns">${bankAnswers?"הסתר תשובות":"הצג תשובות"}</button>
        <button class="btn btn-primary" onclick="window.print()">🖨️ הדפס שאלות</button>
      </div>
    </div>
    <div id="bankBody" class="${bankAnswers?'':'hide-ans'}">${sections}</div>
  </div>`;
  document.getElementById("toggleAns").addEventListener("click",()=>{bankAnswers=!bankAnswers;renderBank();});
}

  const chips=Object.entries(UNITS).map(([u,info])=>{
    const on=state.selectedUnits.has(+u);
    return `<button class="chip" aria-pressed="${on}" data-unit="${u}"><span class="dot" style="background:${info.hex}"></span>${info.name} <span style="color:var(--muted);font-weight:600">(${counts[u]||0})</span></button>`;
  }).join("");
  const total=state.profOnly?PROF_COUNT
    :QUESTIONS.filter(q=>state.selectedUnits.has(q.u)&&(state.inclBank||!q.bank)).length;
  main.innerHTML=`<div class="wrap">
    <div class="hero">
      <div class="hero-top">
        <div class="kicker">בר-אילן · ד״ר אורן נחום</div>
        <h1>תרגול למבחן — תובלה ושינוע</h1>
        <p class="hero-sub">${QUESTIONS.length} שאלות יישום · משוב מיידי והסבר לכל שאלה</p>
      </div>
      <div class="hero-body">
        <label class="toggle-row" for="prof" style="border-color:#f0cf9a;background:#fff9f0">
          <span class="t-txt"><b>⭐ רק שאלות המרצה (${PROF_COUNT})</b>השאלות המדויקות שהוצגו בכיתה</span>
          <span class="switch"><input type="checkbox" id="prof" ${state.profOnly?"checked":""}><span class="slider"></span></span>
        </label>
        <div style="${state.profOnly?'opacity:.4;pointer-events:none':''}">
          <p class="field-label">בחר יחידות לתרגול</p>
          <div class="chips" id="chips">${chips}</div>
        </div>
        <label class="toggle-row" for="inclbank" style="border-color:#bcdedd;background:#f4fbfb">
          <span class="t-txt"><b>📚 כלול שאלות מהמאגר החיצוני (${BANK_COUNT})</b>שאלות הגדרה, לא תרחישים — כבו כדי לתרגל רק את שאלות האתר</span>
          <span class="switch"><input type="checkbox" id="inclbank" ${state.inclBank?"checked":""}><span class="slider"></span></span>
        </label>
        <label class="toggle-row" for="shf">
          <span class="t-txt"><b>ערבוב שאלות ותשובות</b>סדר אקראי בכל סבב</span>
          <span class="switch"><input type="checkbox" id="shf" ${state.shuffle?"checked":""}><span class="slider"></span></span>
        </label>
        <div class="start-meta">
          <span class="count">${total} שאלות נבחרו</span>
          <button class="btn btn-primary" id="startBtn" ${total?"":"disabled"}>התחל תרגול ←</button>
        </div>
      </div>
    </div>
    <p class="foot">מבחן: 13.8.26 · אמריקאי · חומר פתוח <b>מודפס בלבד</b> (אין מחשבים) · ללא חישובים</p>
  </div>`;
  document.getElementById("chips").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b)return;
    const u=+b.dataset.unit;
    state.selectedUnits.has(u)?state.selectedUnits.delete(u):state.selectedUnits.add(u);
    renderStart();
  });
  document.getElementById("prof").addEventListener("change",e=>{state.profOnly=e.target.checked;renderStart();});
  document.getElementById("inclbank").addEventListener("change",e=>{state.inclBank=e.target.checked;renderStart();});
  document.getElementById("shf").addEventListener("change",e=>{state.shuffle=e.target.checked;});
  document.getElementById("startBtn").addEventListener("click",startQuiz);
}
function startQuiz(){
  let pool=state.profOnly?QUESTIONS.filter(q=>q.prof)
    :QUESTIONS.filter(q=>state.selectedUnits.has(q.u)&&(state.inclBank||!q.bank));
  if(!pool.length)return;
  if(state.shuffle)pool=shuffle(pool);
  pool=pool.map(shuffleOptions);
  state.pool=pool;state.idx=0;state.score=0;state.answered=false;state.log=[];
  renderQuestion();
}
function renderQuestion(){
  const q=state.pool[state.idx], info=UNITS[q.u];
  const pct=Math.round(state.idx/state.pool.length*100);
  main.innerHTML=`<div class="wrap">
    <div class="qhead"><div class="qhead-in">
      <span class="counter">שאלה ${state.idx+1}/${state.pool.length}</span>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <span class="score-chip">✓ ${state.score}</span>
    </div></div>
    <div class="card">
      <span class="badge" style="background:${info.hex}">${q.u===6?esc(info.name):"יחידה "+q.u+" · "+esc(info.name)}</span>${q.prof?'<span class="badge badge-prof">⭐ שאלת מרצה</span>':''}${q.past?'<span class="badge badge-past">📎 ממבחן קודם</span>':''}${q.cut?'<span class="badge badge-cut">⬜ ירד מהמיקוד</span>':''}${q.bank?'<span class="badge badge-bank">📚 מאגר חיצוני</span>':''}
      <div class="scenario">${esc(q.s)}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lt">${LETTERS[i]}</span><span class="ot">${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <div class="nav" id="nav"><span class="hint">בחר/י תשובה</span></div>
    </div>
  </div>`;
  document.getElementById("opts").addEventListener("click",onAnswer);
}
function onAnswer(e){
  if(state.answered)return;
  const btn=e.target.closest(".opt"); if(!btn)return;
  const chosen=+btn.dataset.i, q=state.pool[state.idx];
  state.answered=true;
  const ok=chosen===q.a; if(ok)state.score++;
  state.log.push({u:q.u,correct:ok});
  document.querySelectorAll(".opt").forEach(o=>{
    const i=+o.dataset.i; o.disabled=true;
    if(i===q.a){o.classList.add("correct");o.insertAdjacentHTML("beforeend",'<span class="mark">✓</span>');}
    else if(i===chosen){o.classList.add("wrong");o.insertAdjacentHTML("beforeend",'<span class="mark">✗</span>');}
  });
  document.getElementById("fb").innerHTML=`<div class="explain ${ok?'ok':'no'}"><b>${ok?"נכון!":"לא נכון — התשובה הנכונה: "+LETTERS[q.a]}</b>${esc(q.e)}</div>`;
  const last=state.idx===state.pool.length-1;
  document.getElementById("nav").innerHTML=`<span class="hint">${state.score} מתוך ${state.idx+1} עד כה</span><button class="btn btn-primary" id="nextBtn">${last?"סיום וסיכום ←":"הבא ←"}</button>`;
  const nb=document.getElementById("nextBtn");
  nb.addEventListener("click",()=>{
    if(last)renderResults();
    else{state.idx++;state.answered=false;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
  });
  nb.focus();
}
function renderResults(){
  const total=state.pool.length, pct=Math.round(state.score/total*100);
  const msg=pct>=85?"מצוין! אתה מוכן למבחן 💪":pct>=65?"יפה מאוד — עוד חזרה קטנה ואתה שם":"כדאי לחזור על החומר ולנסות שוב";
  const byU={}; state.log.forEach(l=>{(byU[l.u]=byU[l.u]||{c:0,t:0});byU[l.u].t++;if(l.correct)byU[l.u].c++;});
  const rows=Object.keys(byU).sort().map(u=>{
    const d=byU[u],p=Math.round(d.c/d.t*100),info=UNITS[u];
    return `<div class="bd-row"><div class="bd-name"><span class="dot" style="background:${info.hex}"></span>יחידה ${u} · ${esc(info.name)}</div><div class="bd-val">${d.c}/${d.t}</div><div class="bd-bar"><i style="width:${p}%;background:${info.hex}"></i></div></div>`;
  }).join("");
  main.innerHTML=`<div class="wrap">
    <div class="result">
      <div class="result-top"><div class="ring" style="--v:${pct}"><i>${pct}%</i></div><h2>${state.score} מתוך ${total}</h2><p>${msg}</p></div>
      <div class="breakdown"><p class="field-label" style="text-align:right">פירוט לפי יחידה</p>${rows}</div>
      <div class="result-actions">
        <button class="btn btn-primary" id="again">תרגול חדש ←</button>
        <button class="btn btn-ghost" id="home">מסך הפתיחה</button>
      </div>
    </div>
    <p class="foot">בהצלחה במבחן! 📚</p>
  </div>`;
  document.getElementById("again").addEventListener("click",startQuiz);
  document.getElementById("home").addEventListener("click",renderStart);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* =============== ROUTER =============== */
function show(v){
  view=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("is-on",t.dataset.view===v));
  if(v==="quiz")renderStart();
  else if(v==="book")renderBooklet();
  else if(v==="cheat")renderCheat();
  else if(v==="past")renderPast();
  else renderBank();
  window.scrollTo({top:0});
}
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(b)show(b.dataset.view);
});
show("quiz");
</script>

</body>
</html>
