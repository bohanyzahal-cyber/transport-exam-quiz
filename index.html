<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תרגול למבחן — ניהול מערכות תובלה ושינוע</title>
<meta name="description" content="חוברת סיכום, דף עזר, תרגול ובנק שאלות למבחן ניהול מערכות תובלה ושינוע — בר אילן">
</head>
<body>
<div id="app" dir="rtl">
  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <div class="brand">
        <span class="brand-mark">🚚</span>
        <span class="brand-txt"><b>תובלה ושינוע</b><i>ד״ר אורן נחום · בר-אילן</i></span>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab is-on" data-view="quiz">תרגול</button>
        <button class="tab" data-view="book">📘 חוברת</button>
        <button class="tab" data-view="cheat">דף מהיר</button>
        <button class="tab" data-view="bank">כל השאלות</button>
      </nav>
    </div>
  </header>
  <main id="main"></main>
</div>

<style>
  :root{
    --ink:#16233a; --primary:#1f4e79; --primary-2:#2f6ca8;
    --accent:#e0842c; --good:#1e7a33; --good-bg:#e8f5ec; --bad:#b01a1a; --bad-bg:#fbeaea;
    --ground:#eef1f5; --surface:#fff; --line:#d9dfe7; --muted:#5b6675;
    --u1:#1f4e79; --u2:#0f8b8b; --u3:#6a4bb0; --u4:#c9781f; --u5:#1e7a33;
    --shadow:0 1px 2px rgba(22,35,58,.06), 0 8px 24px rgba(22,35,58,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  #app{
    font-family:"Segoe UI",-apple-system,"Rubik","Heebo",Arial,sans-serif;
    color:var(--ink); background:
      radial-gradient(1200px 500px at 100% -10%, rgba(31,78,121,.06), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(224,132,44,.06), transparent 55%),
      var(--ground);
    min-height:100vh; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:18px 16px 60px}
  .btn{font:inherit; cursor:pointer; border:1px solid transparent; border-radius:10px; padding:11px 18px; font-weight:600; transition:transform .08s, background .15s, box-shadow .15s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(31,78,121,.28)}
  .btn-primary:hover{background:var(--primary-2)}
  .btn-ghost{background:var(--surface); color:var(--primary); border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--primary-2)}
  .btn:focus-visible{outline:3px solid rgba(224,132,44,.5); outline-offset:2px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .topbar-in{max-width:820px; margin:0 auto; padding:9px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:9px}
  .brand-mark{font-size:21px}
  .brand-txt{display:flex; flex-direction:column; line-height:1.15}
  .brand-txt b{font-size:14.5px}
  .brand-txt i{font-style:normal; font-size:11px; color:var(--muted)}
  .tabs{display:flex; gap:4px; margin-inline-start:auto; flex-wrap:wrap}
  .tab{font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; background:transparent; color:var(--muted); border-radius:9px; padding:7px 13px; transition:.15s}
  .tab:hover{color:var(--primary); background:rgba(31,78,121,.06)}
  .tab.is-on{background:var(--primary); color:#fff}
  .tab:focus-visible{outline:3px solid rgba(224,132,44,.5); outline-offset:2px}

  /* ---------- doc pages (cheat / guide / bank) ---------- */
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px}
  .page-head h1{margin:0 0 4px; font-size:24px; font-weight:800; letter-spacing:-.01em}
  .page-head p{margin:0; color:var(--muted); font-size:13.5px}
  .sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px}
  .sheet + .sheet{margin-top:14px}
  .sheet h2{margin:0 0 10px; font-size:16px; font-weight:800; color:var(--primary); padding-bottom:5px; border-bottom:2px solid var(--primary)}
  .sheet h2.warn{color:var(--bad); border-color:var(--bad)}
  .sheet h2.ok{color:var(--good); border-color:var(--good)}
  .sheet h2.amber{color:#9a5a0f; border-color:#9a5a0f}
  .sheet h3{margin:13px 0 5px; font-size:14px; font-weight:700; color:var(--primary)}
  .sheet h3:first-of-type{margin-top:4px}
  .ln{margin:0 0 5px; font-size:13.7px}
  .ln b{color:#143355}
  .ln.hot b{color:var(--bad)}
  .ln.cool b{color:var(--good)}
  table.tb{width:100%; border-collapse:collapse; font-size:13px; margin:2px 0 4px}
  table.tb th{background:var(--primary); color:#fff; text-align:right; padding:7px 9px; font-weight:700; font-size:12.5px}
  table.tb td{border:1px solid var(--line); padding:6px 9px; vertical-align:top}
  table.tb tr:nth-child(even) td{background:#f7f9fb}
  .tb-scroll{overflow-x:auto}
  .unit-line{border-inline-start:3px solid var(--line); padding-inline-start:9px; margin-bottom:9px}

  /* ---------- booklet ---------- */
  .bk-toc{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px}
  .bk-toc a{text-decoration:none; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:999px; padding:7px 13px; color:var(--ink); display:flex; align-items:center; gap:7px; background:#fff}
  .bk-toc a:hover{border-color:var(--primary-2)}
  .bk-toc .dot{width:9px;height:9px;border-radius:50%}
  .bk-unit{scroll-margin-top:64px}
  .bk-unit + .bk-unit{margin-top:14px}
  .bk-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-bottom:6px; margin-bottom:10px; border-bottom:3px solid}
  .bk-head h2{margin:0; font-size:19px; font-weight:800; border:0; padding:0}
  .bk-head span{font-size:12px; color:var(--muted); font-weight:600}
  .bk h3{margin:14px 0 6px; font-size:15px; font-weight:800; color:#143355}
  .bk h3:first-child{margin-top:0}
  .bk p{margin:0 0 7px; font-size:14px; line-height:1.62}
  .bk ul{margin:0 0 8px; padding-inline-start:20px}
  .bk li{font-size:14px; line-height:1.6; margin-bottom:4px}
  .bk-box{background:#eef4fa; border:1px solid #cfe0ef; border-inline-start:4px solid var(--primary); border-radius:8px; padding:10px 13px; margin:0 0 9px; font-size:13.8px; line-height:1.6}
  .bk-ex{background:#fff8ee; border:1px solid #f2ddbd; border-inline-start:4px solid var(--accent); border-radius:8px; padding:10px 13px; margin:0 0 9px; font-size:13.6px; line-height:1.6}
  .bk-ex::before{content:"דוגמה · "; font-weight:800; color:#9a5a0f}
  .bk table.tb{margin-bottom:9px}
  .unit-line.u1{border-color:var(--u1)} .unit-line.u2{border-color:var(--u2)} .unit-line.u3{border-color:var(--u3)}
  .unit-line.u4{border-color:var(--u4)} .unit-line.u5{border-color:var(--u5)}

  /* ---------- quiz ---------- */
  .hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .hero-top{background:linear-gradient(135deg,#1b3a5c,#1f4e79 55%,#2f6ca8); color:#fff; padding:28px 26px 24px}
  .kicker{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#bcd4ec; font-weight:700; margin-bottom:7px}
  .hero-top h1{margin:0; font-size:27px; font-weight:800; text-wrap:balance}
  .hero-sub{margin:7px 0 0; color:#d5e4f2; font-size:14px}
  .hero-body{padding:20px 24px 24px}
  .field-label{font-size:12.5px; font-weight:700; color:var(--muted); margin:0 0 8px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink); display:flex; align-items:center; gap:7px; transition:.15s}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip[aria-pressed="true"]{border-color:var(--primary); background:rgba(31,78,121,.08); color:var(--primary)}
  .chip:focus-visible{outline:3px solid rgba(224,132,44,.5); outline-offset:2px}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 15px; border:1px solid var(--line); border-radius:11px; margin-bottom:16px; background:#fbfcfd}
  .toggle-row .t-txt{font-size:13px}
  .toggle-row .t-txt b{display:block; font-size:14px}
  .switch{position:relative; width:48px; height:27px; flex:none}
  .switch input{opacity:0; width:0; height:0}
  .slider{position:absolute; inset:0; background:#c3ccd6; border-radius:999px; transition:.2s; cursor:pointer}
  .slider::before{content:""; position:absolute; height:21px; width:21px; right:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider::before{transform:translateX(-21px)}
  .start-meta{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .start-meta .count{color:var(--muted); font-size:13.5px}
  .qhead{position:sticky; top:52px; z-index:6; background:rgba(238,241,245,.9); backdrop-filter:blur(8px); padding:11px 16px; border-bottom:1px solid var(--line); margin:-18px -16px 16px}
  .qhead-in{max-width:820px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .progress{flex:1; height:8px; background:#dbe2ea; border-radius:999px; overflow:hidden}
  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--primary),var(--accent)); border-radius:999px; transition:width .35s cubic-bezier(.4,0,.2,1)}
  .counter{font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .score-chip{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--good)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; animation:pop .25s ease}
  @keyframes pop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .badge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:#fff; padding:4px 11px; border-radius:999px; margin-bottom:13px}
  .badge-prof{background:#fff4e2 !important; color:#a35a12; border:1px solid #f0cf9a; margin-inline-start:7px}
  .scenario{background:#f4f7fa; border:1px solid #e5ebf1; border-right:3px solid var(--primary); border-radius:8px; padding:12px 14px; font-size:14.5px; color:#374559; margin-bottom:13px}
  .qtext{font-size:18px; font-weight:700; line-height:1.5; margin:0 0 15px; text-wrap:balance}
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:flex-start; gap:11px; text-align:right; width:100%; background:#fff; border:1.5px solid var(--line); border-radius:11px; padding:13px 14px; font:inherit; font-size:15px; cursor:pointer; transition:.14s; color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--primary-2); background:#f7fafd}
  .opt:disabled{cursor:default}
  .opt:focus-visible{outline:3px solid rgba(224,132,44,.5); outline-offset:2px}
  .opt .lt{flex:none; width:26px; height:26px; border-radius:7px; background:#eef2f6; color:var(--muted); font-weight:800; font-size:14px; display:grid; place-items:center}
  .opt .ot{padding-top:2px}
  .opt.correct{border-color:var(--good); background:var(--good-bg)}
  .opt.correct .lt{background:var(--good); color:#fff}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
  .opt.wrong .lt{background:var(--bad); color:#fff}
  .mark{margin-inline-start:auto; font-weight:800; align-self:center; font-size:17px}
  .opt.correct .mark{color:var(--good)} .opt.wrong .mark{color:var(--bad)}
  .explain{margin-top:14px; border-radius:11px; padding:14px 15px; font-size:14.5px; animation:pop .3s ease; border:1px solid}
  .explain.ok{background:var(--good-bg); border-color:#bfe3c9}
  .explain.no{background:var(--bad-bg); border-color:#eecccc}
  .explain b{display:block; margin-bottom:4px; font-size:13.5px}
  .explain.ok b{color:var(--good)} .explain.no b{color:var(--bad)}
  .nav{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:17px}
  .hint{color:var(--muted); font-size:13px}
  .result{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; text-align:center}
  .result-top{padding:30px 24px 24px; color:#fff; background:linear-gradient(135deg,#1b3a5c,#1f4e79 60%,#2f6ca8)}
  .ring{--v:0; width:130px; height:130px; border-radius:50%; margin:6px auto 13px; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--v)*1%), rgba(255,255,255,.22) 0)}
  .ring i{width:102px; height:102px; border-radius:50%; background:#1c3f61; display:grid; place-items:center; font-size:29px; font-weight:800; font-variant-numeric:tabular-nums; font-style:normal}
  .result-top h2{margin:0; font-size:22px; font-weight:800}
  .result-top p{margin:6px 0 0; color:#d5e4f2; font-size:14px}
  .breakdown{padding:20px 24px}
  .bd-row{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; margin-bottom:12px}
  .bd-name{font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px}
  .bd-name .dot{width:10px;height:10px;border-radius:50%}
  .bd-val{font-size:13px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
  .bd-bar{grid-column:1 / -1; height:8px; background:#e5eaf0; border-radius:999px; overflow:hidden}
  .bd-bar > i{display:block; height:100%; border-radius:999px}
  .result-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:4px 24px 24px}
  .foot{text-align:center; color:var(--muted); font-size:12.5px; margin-top:20px}

  /* ---------- question bank (printable) ---------- */
  .bank-q{padding:11px 0; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid}
  .bank-q:last-child{border-bottom:0}
  .bank-n{font-weight:800; color:var(--primary); font-size:13.5px}
  .bank-star{color:#a35a12; font-size:11.5px; font-weight:700; margin-inline-start:6px}
  .bank-s{color:var(--muted); font-size:13px; margin:3px 0}
  .bank-qt{font-weight:700; font-size:14px; margin:3px 0 5px}
  .bank-o{font-size:13.3px; margin:0 0 2px; padding-inline-start:16px}
  .bank-o.is-ans{font-weight:700; color:var(--good)}
  .bank-e{font-size:12.8px; color:#3d4a5c; background:#f5f8fa; border-inline-start:3px solid var(--good); padding:6px 9px; border-radius:6px; margin-top:5px}
  .hide-ans .bank-o.is-ans{font-weight:inherit; color:inherit}
  .hide-ans .bank-e{display:none}

  /* ---------- PRINT ---------- */
  @media print{
    @page{size:A4; margin:11mm}
    #app{background:#fff !important}
    .topbar, .tabs, .btn, .page-head .actions, .qhead{display:none !important}
    .wrap{max-width:100%; padding:0}
    .sheet{box-shadow:none; border:0; border-radius:0; padding:0; margin:0 0 8px}
    .sheet + .sheet{margin-top:8px}
    .sheet h2{font-size:12.5pt; margin:8px 0 5px; break-after:avoid; page-break-after:avoid}
    .sheet h3{font-size:10.5pt; margin:7px 0 3px; break-after:avoid}
    .ln{font-size:8.6pt; margin-bottom:2px}
    table.tb{font-size:8.3pt; page-break-inside:auto}
    table.tb th{padding:3px 5px; font-size:8.3pt; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    table.tb td{padding:3px 5px}
    table.tb tr{break-inside:avoid; page-break-inside:avoid}
    .page-head h1{font-size:15pt; margin-bottom:2px}
    .page-head p{font-size:8.5pt}
    .unit-line{margin-bottom:5px}
    .bank-q{padding:6px 0; font-size:9pt}
    .bank-qt{font-size:9.4pt}
    .bank-o{font-size:9pt}
    .bank-e{font-size:8.4pt; background:transparent; padding:3px 6px}
    .bk-toc{display:none !important}
    .bk-unit{break-before:page; page-break-before:always}
    .bk-unit:first-of-type{break-before:auto; page-break-before:auto}
    .bk-head{margin-bottom:6px; padding-bottom:3px; border-bottom-width:2px}
    .bk-head h2{font-size:14pt}
    .bk-head span{font-size:8pt}
    .bk h3{font-size:10.5pt; margin:8px 0 3px; break-after:avoid; page-break-after:avoid}
    .bk p, .bk li{font-size:9pt; line-height:1.42; margin-bottom:3px}
    .bk ul{margin-bottom:4px; padding-inline-start:16px}
    .bk-box, .bk-ex{font-size:8.8pt; padding:5px 8px; margin-bottom:5px; line-height:1.42; break-inside:avoid; page-break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact}
    .print-only{display:block !important}
    a[href]:after{content:""}
  }
  .print-only{display:none}
</style>

<script>
const QUESTIONS = [
{u:1,s:"עיר גדולה סובלת מעומסי תנועה בשעות השיא. מהנדס התנועה מודד בכביש עורקי מהירות ממוצעת של 40 קמ\"ש וצפיפות של 50 רכבים לק\"מ.",q:"לפי מודל זרימת התנועה, מהי הזרימה (q) בקטע זה?",o:["2,000 רכבים לשעה — לפי q = S × D","0.8 רכבים לשעה — לפי q = S / D","90 רכבים לשעה — לפי q = S + D","לא ניתן לחשב ללא נתון הקיבולת"],a:0,e:"נוסחת היסוד של זרימת תנועה: q = S × D = 40 × 50 = 2,000 רכבים/שעה. הזרימה היא מכפלת המהירות בצפיפות."},
{u:1,s:"חברת שילוח מעבירה מכולה מסין לישראל: משאית לנמל, אונייה לנמל חיפה, ומשאית לחנות.",q:"כיצד נכנה את שלב מעבר המכולה מהאונייה למשאית בנמל היעד, במונחי אינטר-מודליות?",o:["INTERCHANGE — נקודת מעבר בין אמצעי תובלה (TRANSFER)","COMPOSITION — איסוף ראשוני (First mile)","DECOMPOSITION — פירוק וחלוקה סופית","רמת מינוע"],a:0,e:"מודל האינטר-מודליות: COMPOSITION (איסוף) ← INTERCHANGE (מעבר/TRANSFER בין אמצעים) ← DECOMPOSITION (חלוקה). המעבר מאונייה למשאית הוא INTERCHANGE."},
{u:1,s:"בכביש הררי נמדדת תנועה מעורבת של מכוניות פרטיות ומשאיות כבדות. המתכנן רוצה להעריך את העומס האמיתי על הדרך.",q:"מדוע משתמשים ביחידת רכב משווה (יר\"מ / PCU)?",o:["כדי להמיר סוגי רכב שונים ליחידה אחידה — משאית בהר \"שווה\" למספר מכוניות פרטיות בזרימה","כדי למדוד את המהירות המרבית המותרת בכל סוג דרך ולהתאים אותה לתמהיל הרכבים בפועל","כדי לחשב את רמת המינוע של המדינה, שהיא מספר כלי הרכב המנועיים לכל 1,000 תושבים","כדי לקבוע את מחיר הדלק לק\"מ לפי סוג הרכב ולתמחר בהתאם את עלויות ההובלה בפרויקט"],a:0,e:"יר\"מ ממיר רכבים שונים ליחידות אחידות לפי השפעתם על הזרימה. משאית תופסת ומאטה תנועה יותר ממכונית — בהר מקדם ההמרה שלה גבוה במיוחד."},
{u:2,s:"רשות מקומית שומרת מפה: שכבה אחת מיוצגת כפוליגונים עם קואורדינטות X,Y מדויקות; שכבה אחרת היא תצלום אוויר המחולק לרשת תאים אחידה.",q:"כיצד נכנה את שני אופני ייצוג הנתונים בהתאמה?",o:["וקטור (פוליגונים) וראסטר (תאים)","ראסטר (פוליגונים) ווקטור (תאים)","שניהם וקטור","שניהם ראסטר"],a:0,e:"וקטור מייצג ישויות בדידות בעזרת נקודות/קווים/פוליגונים עם קואורדינטות. ראסטר מייצג את המרחב ברשת תאים (הרזולוציה = גודל התא). תצלום אוויר = ראסטר."},
{u:2,s:"מקלט GPS בטלפון מנסה לקבוע את מיקומו המדויק במרחב (אורך, רוחב וגובה).",q:"מדוע נדרשים לפחות 4 לוויינים לקביעת המיקום?",o:["יש 4 נעלמים (x, y, z והזמן t) ולכן צריך 4 משוואות","כי יש 4 מישורי מסלול","כי כל לוויין מכסה רבע כדור הארץ","כדי לגבות זה את זה במקרה תקלה"],a:0,e:"המיקום נקבע בטריאנגולציה. מלבד 3 קואורדינטות המרחב (x,y,z), גם הזמן t הוא נעלם (סטיית שעון המקלט), ולכן דרושות 4 משוואות = 4 לוויינים."},
{u:2,s:"חברת הפצה רוצה לראות בכל רגע היכן נמצאות המשאיות שלה על מפה, לאתר את הקרובה ביותר ללקוח, ולקבל התראה כשמשאית יוצאת מאזור מוגדר.",q:"באיזו טכנולוגיה מדובר?",o:["AVL — שילוב של נתוני GPS (מיקום) עם מערכת GIS (מפה) לניהול ומעקב אחר צי הרכב","RFID בלבד — תגיות זיהוי אלחוטיות הנקראות בעת כניסת הרכב ויציאתו מהמחסן","ראסטר — ייצוג המפה ברשת תאים אחידה שבה גודל התא קובע את רמת הרזולוציה","Cross-docking — העברת סחורה ישירות מעמדת פריקה לעמדת טעינה ללא אחסון"],a:0,e:"AVL (Automatic Vehicle Location) = GPS + GIS: איתור אוטומטי של כלי רכב, הצגה על מפה, שילוח דינמי והתראות geofencing."},
{u:2,s:"מתכנן ערים רוצה לדעת אילו חלקות קרקע נמצאות במרחק של עד 50 מטר מכביש ראשי, כדי להעריך חשיפה לרעש.",q:"באיזה סוג ניתוח GIS מדובר?",o:["ניתוח קרבה (Proximity)","ניתוח שכבות-על (Overlay)","ניתוח רשת (Network)","תשאול (Query)"],a:0,e:"ניתוח קרבה בוחן מרחק ממאפיין (טווח/חוצץ). Overlay מצליב שכבות; Network מנתח מסלולים לאורך רשת."},
{u:3,s:"חברה מפעילה 3 מפעלים (היצע כולל 300 יח') ו-4 לקוחות (ביקוש כולל 250 יח'). מבקשים לבנות מודל תובלה למזעור עלויות.",q:"מה קורה למבנה הפתרון האופטימלי כאשר סך ההיצע גדול מסך הביקוש?",o:["המודל לא פתיר, כי היצע וביקוש חייבים להיות שווים","ערך פונקציית המטרה יהפוך לשלילי","יש להוסיף לקוח (יעד) פיקטיבי כך שהביקוש ישווה להיצע, בעלות 0","כל הספקים ישלחו את מלוא הקיבולת ללקוח הזול ביותר"],a:2,e:"בעיה לא מאוזנת (היצע>ביקוש). מוסיפים לקוח/יעד פיקטיבי שסופג את העודף (50 יח') עם עלויות הובלה 0 — וכך מאזנים. הבעיה נשארת פתירה."},
{u:3,s:"בעיה דומה, אך הפעם סך הביקוש של הלקוחות (400) גדול מסך ההיצע של הספקים (350).",q:"כיצד מאזנים את בעיית התובלה במקרה זה?",o:["מוסיפים ספק (מקור) פיקטיבי שמספק את החוסר, בעלות 0","מוסיפים לקוח פיקטיבי","מוחקים את הלקוח עם הביקוש הגבוה ביותר","מכפילים את ההיצע של כל ספק"],a:0,e:"כשהביקוש גדול מההיצע, החוסר (50) מסופק ע\"י ספק/מקור פיקטיבי בעלות 0. סימטרי למקרה ההפוך: היצע>ביקוש ← יעד פיקטיבי."},
{u:3,s:"חברה מעבירה סחורה ממפעלים ללקוחות, אך המשלוחים חייבים לעבור דרך מרכזי מיון (מרלו\"ג) שבהם הסחורה נכנסת ויוצאת בדרך ליעד.",q:"מהו ההבדל העיקרי בין בעיית תובלה לבעיית שיטעון?",o:["בשיטעון קיימים קודקודי מעבר (נקודות ביניים), בעוד שבתובלה המשלוח ישיר ממקור אל היעד","בעיית תובלה נפתרת בסולבר בלבד, ואילו בעיית שיטעון מחייבת שימוש באלגוריתם היוריסטי מקורב","בעיית שיטעון מניחה שהביקוש שלילי והתובלה חיובית, ולכן פונקציית המטרה בה הפוכה בסימנה","אין ביניהן הבדל מהותי — אלו שני שמות שונים לאותה בעיה, שנוצרו בספרות מקצועית שונה"],a:0,e:"ההבחנה המרכזית: שיטעון כולל קודקודי מעבר שבהם מתקיים שימור זרימה (נכנס=יוצא), בעוד בתובלה הסחורה עוברת ישירות מספק ללקוח."},
{u:3,s:"בבעיית שיטעון, מרלו\"ג משמש כנקודת מעבר בלבד — הסחורה לא נשארת בו אלא ממשיכה ללקוחות.",q:"איזה תנאי מתקיים בקודקוד המעבר?",o:["שימור זרימה — סך הזרימה הנכנסת שווה לסך הזרימה היוצאת, כלומר המאזן בקודקוד הוא 0","הזרימה הנכנסת גדולה תמיד פי שניים מהיוצאת, כדי להבטיח מלאי חוצץ בנקודת המעבר","הקודקוד צורך את כל הסחורה המגיעה אליו, ולכן הוא מסווג כקודקוד ביקוש לכל דבר","הקודקוד מייצר סחורה חדשה בנוסף לזו שנכנסת אליו, ולכן המאזן שלו תמיד חיובי"],a:0,e:"בקודקוד מעבר מתקיים שימור זרימה: כל מה שנכנס יוצא (מאזן = 0). מניחים גם קיבולת מעבר גדולה מאוד כדי שהסחורה תוכל לזרום דרכו."},
{u:3,s:"מפקדה צבאית צריכה להעריך כמה כוחות ניתן להעביר בו-זמנית מבסיס עורפי (S) לחזית (T) דרך רשת כבישים, כשלכל כביש קיבולת מרבית.",q:"באיזו בעיית רשת מדובר, ומהו הקשר החשוב שלה?",o:["זרימה מקסימלית (Max Flow); ערך הזרימה המקסימלית שווה לערך החתך המינימלי (Min Cut)","בעיית התובלה; מזעור עלויות ההעברה מהבסיס אל החזית בכפוף להיצע ולביקוש בכל צומת","בעיית המסלול הקצר ביותר; מריצים דייקסטרה ומוצאים את הנתיב המהיר ביותר מהבסיס לחזית","בעיית שיבוץ; מתאימים כל כוח ליעד יחיד, כאשר כל היצע וכל ביקוש שווים ליחידה אחת"],a:0,e:"מקסום כמות הזרימה בין S ל-T בכפוף לקיבולות = Max Flow. משפט Max-Flow/Min-Cut: הזרימה המקסימלית שווה לחתך המינימלי (צוואר הבקבוק של הרשת)."},
{u:3,s:"מפעל צריך לשבץ 4 מהנדסים ל-4 פרויקטים, כך שכל מהנדס יקבל פרויקט אחד וכל פרויקט יאויש ע\"י מהנדס אחד, בעלות כוללת מינימלית.",q:"איזו בעיה מתאימה, וכיצד היא קשורה לבעיית התובלה?",o:["בעיית שיבוץ (Assignment) — מקרה פרטי של בעיית התובלה שבו כל היצע שווה 1 וכל ביקוש שווה 1","בעיית מחלק הדואר — נדרש לעבור בכל הקשתות של הגרף לפחות פעם אחת בעלות מינימלית","בעיית מיקום מתקנים — קביעת המיקום האופטימלי שממנו יינתן שירות לכלל הפרויקטים","בעיית זרימה מקסימלית — חישוב מספר המהנדסים המרבי שניתן להעביר לפרויקטים בו-זמנית"],a:0,e:"בעיית השיבוץ היא מקרה פרטי של בעיית התובלה שבו כל ההיצעים וכל הביקושים שווים ל-1 (התאמה 1:1), עם משתנים בינאריים."},
{u:4,s:"רשת מזון עוברת למודל Just-In-Time (JIT): מלאי מינימלי בחנויות ואספקה תכופה במנות קטנות.",q:"כיצד משפיע המעבר ל-JIT על החלטת מיקום מרכזי ההפצה של החברה?",o:["המודל יאלץ למקם את המחסנים קרוב ללקוחות, לאספקה מהירה, תכופה ואמינה","החברה תרחיק את המחסנים מעבר לים כדי להוזיל עלויות","המחסנים ימוקמו היכן שהתנועה מגיעה למקסימום","ההחלטה תיקבע לפי קרבה לצינורות גז ונפט"],a:0,e:"ב-JIT אין מלאי חוצץ שסופג עיכובים, ולכן נדרשת אספקה מהירה ואמינה — מה שמחייב קרבה גיאוגרפית ללקוח. מרחק גדול הורס את היכולת לספק \"בדיוק בזמן\"."},
{u:4,s:"חקלאי שוקל היכן למקם מחסן בין החווה לשוק. ככל שמתרחקים מהשוק, עלות ההובלה עולה אך מחיר הקרקע יורד.",q:"היכן תהיה נקודת המיקום בעלת העלות הכוללת המינימלית?",o:["בנקודת ביניים המאזנת בין עלות התובלה לעלות הקרקע — לא הכי קרוב לשוק ולא הכי רחוק ממנו","דווקא הכי קרוב לשוק, מכיוון ששם עלות התובלה מינימלית והיא הרכיב המשמעותי בעלות הכוללת","דווקא הכי רחוק מהשוק, מכיוון ששם מחיר הקרקע הוא הזול ביותר וחוסך את עיקר ההשקעה","המיקום אינו משפיע כלל על העלות הכוללת, מכיוון ששני רכיבי העלות מתקזזים זה מול זה תמיד"],a:0,e:"עקומת העלות הכוללת בצורת U: עלות תובלה עולה עם המרחק וערך הקרקע יורד. המינימום מתקבל בנקודת ביניים, לא בקצוות."},
{u:4,s:"עירייה ממקמת תחנות כיבוי אש. חלופה א' ממזערת את סך המרחק המשוקלל לכלל השכונות; חלופה ב' ממזערת את המרחק לשכונה הרחוקה ביותר.",q:"כיצד נכנה את שני המודלים בהתאמה?",o:["P-Median (מזעור הסכום המשוקלל) ו-Max-Min (מזעור המרחק ללקוח המרוחק ביותר)","Max-Min (מזעור הסכום המשוקלל) ו-P-Median (מזעור המרחק ללקוח המרוחק ביותר)","שתי החלופות מיישמות את מודל P-Median, ונבדלות רק במספר המתקנים שנבחר להקים","שתי החלופות מיישמות מודל כיסוי מקסימלי, שממקסם את הביקוש המכוסה בתוך טווח נתון"],a:0,e:"P-Median ממזער את סך המרחק המשוקלל בביקוש (מטרת עלות כוללת). Max-Min ממזער את המרחק ללקוח הגרוע/המרוחק ביותר (מטרת שירות והוגנות)."},
{u:4,s:"רשת בתי קפה רוצה למקם מספר מוגבל של סניפים כך שכמה שיותר לקוחות (משוקלל בביקוש) יהיו בטווח הליכה של 500 מ' מסניף.",q:"איזה מודל מיקום מתאים?",o:["כיסוי מקסימלי (Maximal Covering) — מקסום סך הביקוש המכוסה בתוך טווח נתון, במספר מתקנים מוגבל","P-Median — מזעור סכום המרחקים המשוקללים בביקוש מכלל הלקוחות אל המתקנים שנבחרו","Max-Min — מזעור המרחק אל הלקוח המרוחק ביותר, כדי להבטיח רמת שירות הוגנת לכולם","גבול הפצה — קביעת קו שוויון העלויות שממנו ואילך כדאי לספק ממקור אספקה אחר"],a:0,e:"מודל הכיסוי המקסימלי ממקסם את סך הביקוש המכוסה בתוך טווח כיסוי Dc, בהינתן מספר מתקנים מוגבל P."},
{u:4,s:"חברה בוחנת מיקום מחסן לפי שתי מטרות מנוגדות: מזעור עלות הובלה ומזעור פגיעה בשכונות מגורים, ומציירת אוסף פתרונות.",q:"מהי \"חזית פארטו\" (Pareto Front) במקרה זה?",o:["אוסף הפתרונות הלא-נשלטים — שבהם אי אפשר לשפר מטרה בלי לפגוע באחרת","הפתרון היחיד שממזער את שתי המטרות בו-זמנית","הפתרון היקר ביותר","נקודת האמצע הגיאומטרית בין הלקוחות"],a:0,e:"בבעיה רב-מטרתית אין בד\"כ פתרון יחיד אופטימלי. חזית פארטו היא אוסף הפתרונות הלא-נשלטים; נקודה \"מתחת\" לחזית נשלטת (נחותה) ולכן פסולה."},
{u:5,s:"נהג משאית מחפש את הדרך הקצרה ביותר מנקודת מוצא ליעד ברשת כבישים. כל המרחקים (משקלים) חיוביים.",q:"מתי מובטח שאלגוריתם דייקסטרה ייתן פתרון אופטימלי, ומתי לא?",o:["מובטח אופטימום כל עוד אין קשתות בעלות משקל שלילי; בנוכחות משקל שלילי הוא עלול להיכשל","מובטח אופטימום בכל מקרה, גם בנוכחות משקלים שליליים, מכיוון שהאלגוריתם סורק את כל הקודקודים","מובטח אופטימום רק בגרף לא מכוון; בגרף מכוון נדרש להריץ את האלגוריתם פעמיים לכל כיוון","לעולם אינו נותן פתרון אופטימלי אלא רק קירוב, ולכן הוא מסווג כאלגוריתם היוריסטי"],a:0,e:"דייקסטרה הוא אלגוריתם חמדני המבטיח אופטימום רק כאשר כל המשקלים אי-שליליים. קשת עם משקל שלילי עלולה לשבש את הבחירה החמדנית."},
{u:5,s:"בקורס נלמד שדייקסטרה הוא אלגוריתם \"חמדני\" (Greedy).",q:"מהי משמעות גישה חמדנית, ומה תכונתה?",o:["בכל צעד בוחרים את האפשרות הטובה ביותר מקומית; לעיתים זה נותן אופטימום (דייקסטרה) ולעיתים רק קירוב (TSP)","בכל צעד בודקים את כל האפשרויות העתידיות ובוחרים את זו שתיטיב עם הפתרון הגלובלי הסופי","בוחרים בכל צעד אפשרות אקראית, ומריצים את האלגוריתם פעמים רבות עד שמתקבל פתרון טוב","בוחרים בכל צעד את האפשרות היקרה ביותר, וכך מובטח הפתרון האופטימלי בכל סוגי הבעיות"],a:0,e:"אלגוריתם חמדני בוחר אופטימום מקומי בכל צעד בלי לשקול את העתיד. במסלול קצר (דייקסטרה, ללא שליליים) זה מבטיח אופטימום; ב-TSP רק פתרון סביר."},
{u:5,s:"חברת שירות מתכננת מסלול לטכנאי שיבקר ב-15 לקוחות פעם אחת כל אחד ויחזור למשרד, בזמן נסיעה כולל מינימלי.",q:"כיצד מסווגים בעיה זו ומדוע משתמשים בהיוריסטיקה?",o:["בעיית הסוכן הנוסע (TSP), שהיא NP-Hard — אין אלגוריתם יעיל לאופטימום, ולכן משתמשים בהיוריסטיקות","בעיית מסלול קצר ביותר, שנפתרת אופטימלית בדייקסטרה תוך זמן פולינומי קצר גם ל-15 לקוחות","בעיית שיבוץ, הנפתרת בקלות על ידי התאמת אחד-לאחד בין הטכנאי לבין כל אחד מהלקוחות","בעיית זרימה מקסימלית, שבה מחשבים כמה לקוחות ניתן לשרת בו-זמנית בכפוף לקיבולת הרשת"],a:0,e:"ביקור בכל הקודקודים פעם אחת וחזרה = מעגל המילטוני מינימלי = TSP. בעיה NP-Hard (מספר מסלולים פקטוריאלי), ולכן משתמשים בהיוריסטיקות כמו \"השכן הקרוב\"."},
{u:5,s:"לפתרון TSP משתמשים באלגוריתם \"השכן הקרוב ביותר\" (Nearest Neighbor).",q:"מה ניתן להבטיח לגבי איכות הפתרון (S_alg) ביחס לאופטימום (S_opt)?",o:["S_opt ≤ S_alg ≤ 2·S_opt — הפתרון לעולם אינו גרוע מפי 2 מהאופטימום, אך אינו מובטח כאופטימלי","S_alg תמיד שווה בדיוק ל-S_opt, מכיוון שהאלגוריתם סורק את כל הקודקודים לפני שהוא בוחר","S_alg תמיד גדול פי 10 לפחות מ-S_opt, ולכן אין טעם מעשי להשתמש באלגוריתם זה","אין שום חסם ידוע על איכות הפתרון, ולכן התוצאה עשויה להיות רחוקה מהאופטימום בכל שיעור"],a:0,e:"אלגוריתם השכן הקרוב הוא היוריסטיקה חמדנית. החסם הידוע: S_opt ≤ S_alg ≤ 2·S_opt — פתרון מהיר וסביר, אך לא בהכרח אופטימלי."},
{u:5,s:"רשות מקומית מתכננת מסלול לרכב טאטוא רחובות שיעבור בכל הרחובות (הכבישים) בשכונה, במרחק כולל מינימלי.",q:"באיזו בעיה מדובר, ומה מבדיל אותה מבעיית הסוכן הנוסע?",o:["בעיית מחלק הדואר הסיני — מעבר בכל הקשתות (הכבישים); לעומת TSP שבו עוברים בכל הקודקודים","בעיית הסוכן הנוסע — זהה לחלוטין, שכן בשתיהן עוברים בכל מרכיבי הגרף וחוזרים לנקודת המוצא","בעיית שיבוץ — התאמה של אחד-לאחד בין רכבי הטאטוא לבין הרחובות שהוגדרו לניקוי","בעיית זרימה מקסימלית — חישוב מספר רכבי הטאטוא המרבי שניתן להעביר ברחובות בו-זמנית"],a:0,e:"מחלק הדואר = מעגל מינימלי העובר בכל הקשתות (כבישים). זו ההבחנה מ-TSP שעובר בכל הקודקודים. טאטוא/איסוף אשפה = קשתות ← מחלק הדואר."},
{u:5,s:"חברת הפצה מפעילה מחסן מרכזי וצי משאיות בעלות קיבולת קבועה, ומחלקת סחורה ל-40 לקוחות בעלי דרישות ידועות, בעלות מינימלית.",q:"באיזו בעיה מדובר ובאיזה עיקרון פועל אלגוריתם ה-Savings לפתרונה?",o:["ניתוב רכבים (VRP); מחברים מסלולים לפי החיסכון Sij = Ci0 + C0j − Cij, מהגבוה לנמוך, בכפוף לאילוץ הקיבולת","בעיית המסלול הקצר ביותר; מריצים את אלגוריתם דייקסטרה מהמחסן ובוחרים את היעד הקרוב ביותר בכל שלב","בעיית שיבוץ; מבצעים התאמה של אחד-לאחד בין כל משאית ללקוח יחיד, כך שכל לקוח מקבל רכב משלו","בעיית זרימה מקסימלית; מריצים את פורד-פולקרסון ומחשבים את הקיבולת המרבית בין המחסן ללקוחות"],a:0,e:"שיבוץ צי רכבים ללקוחות תחת אילוץ קיבולת = VRP. אלגוריתם Savings (Clarke & Wright) מתחיל ממסלול נפרד לכל לקוח ומחבר זוגות עם החיסכון הגבוה ביותר שעומד באילוצי הקיבולת."},
{u:5,s:"חברה נערכת לחירום ורוצה לתכנן מראש כמה מסלולי פינוי חלופיים, למקרה שהמסלול המועדף לא יהיה זמין.",q:"איזה מושג מתאר את מה שהחברה מחפשת?",o:["K-Shortest Paths — מציאת K המסלולים הקצרים ביותר, כדי שיהיו חלופות גיבוי מוכנות מראש","זרימה מקסימלית — חישוב הכמות המרבית שניתן להעביר בו-זמנית מנקודת המוצא אל היעד","חתך מינימלי — איתור קבוצת הקשתות שמחיקתן מנתקת את המקור מהיעד בעלות מינימלית","חציון משוקלל — מציאת נקודת המיקום האופטימלית לפי משקלי הביקוש של הלקוחות בכל ציר"],a:0,e:"כשרוצים לא רק את המסלול הקצר ביותר אלא גם חלופות (למקרה שהמסלול הראשי חסום), מחפשים את K המסלולים הקצרים ביותר (K-Shortest Paths)."},
{u:3,prof:true,s:"בעיות תובלה.",q:"מה קורה למבנה הפתרון האופטימלי כאשר סך ההיצע של כל הספקים גדול מסך הביקוש של כל הלקוחות?",o:["המודל הופך ללא פתיר מכיוון שהמודל מחייב שהביקוש וההיצע יהיו שווים","ערך פונקציית מטרה תהפוך לשלילית מכיוון שהעודפים מוגדרים כרווח","יש להוסיף קודקוד יעד פיקטיבי שהביקוש שלו שווה להפרש","כל הספקים ישלחו את מלוא הקיבולת שלהם ללקוח בעל העלות הנמוכה ביותר"],a:2,e:"כשיש בעיה לא מאוזנת (אין שוויון בין הדרישה להיצע) — בהתאם למה שיש יותר, מוסיפים לקוח פיקטיבי או ספק פיקטיבי בהתאם לזה שהוא קולט או מספק. כאן היצע>ביקוש → יעד (לקוח) פיקטיבי שביקושו שווה להפרש, בעלות 0."},
{u:3,prof:true,s:"בעיות תובלה.",q:"מה ההבדל המהותי בין בעיית הובלה לבעיית שיטעון?",o:["בעיית הובלה פותרים עם אלגוריתמים היוריסטיים ושיטעון עם סולבר בלבד","בעיית שיטעון פותרים עם אלגוריתמים היוריסטיים והובלה עם סולבר בלבד","בבעיית שיטעון עלויות ההובלה בין המוצא ליעד קבועות ולא תלויות בנפח","בעיית שיטעון מתעלמת מאילוצי קיבולת ומניחה שלכל מתקני הביניים יש שטח אחסון אינסופי","בבעיית הובלה הזרימה מתבצעת ישירות מקודקוד מקור לקודקוד יעד, ובבעיית שיטעון יש קודקודי ביניים שבהם סך הזרימה הנכנסת חייבת להיות שווה ליוצאת"],a:4,e:"ההבדל המהותי: בשיטעון קיימים קודקודי ביניים (מעבר) שבהם מתקיים שימור זרימה — נכנס=יוצא. בהובלה הזרימה ישירה ממקור ליעד. (הנחת שטח האחסון האינסופי בצמתי מעבר היא הנחת מודל טכנית, אך אינה ההבדל המהותי.)"},
{u:4,prof:true,s:"מיקום מתקנים.",q:"כיצד משפיע מעבר של חברה למודל אספקה מבוסס Just-In-Time על החלטת מיקום המחסנים שלה ביחס למפעלי הלקוחות?",o:["החברה תרחיק את המחסנים למדינות מעבר לים כדי לנצל עלויות אחסון זולות ולמקסם מלאי בטיחות","המודל יאלץ את מיקום המחסנים להיות קרוב גיאוגרפית ללקוחות כדי להבטיח זמינות מיידית וכמות משלוחים גבוהה","המחסנים ימוקמו בנקודות שבהן נפח התנועה בכבישים מגיע למקסימום","ההחלטה תהיה תלויה אך ורק במיקום צינורות גז ונפט לאומיים ללא קשר למיקומי הלקוחות"],a:1,e:"JIT דורש אספקה מיידית, תכופה ואמינה ללא מלאי חוצץ — ולכן מחייב מיקום מחסנים קרוב גיאוגרפית ללקוחות."},
{u:5,prof:true,s:"מסלול קצר ביותר.",q:"אלגוריתם דייקסטרה — מדוע הוא לא עובד כאשר יש קשתות בעלות משקל שלילי?",o:["האלגוריתם מבוסס על אסטרטגיה חמדנית שמניחה שברגע שקודקוד סומן כקבוע המרחק אליו מינימלי; אם קיים משקל שלילי בהמשך הרשת שעשוי להציע מרחק קצר יותר, האלגוריתם כבר לא יעדכן קודקודים כאלה","משקל שלילי גורם לאלגוריתם להיתקע בלולאה אינסופית בקודקוד המקור","האלגוריתם יהפוך את הגרף ללא כשיר ויחלק את רשת הכבישים לתתי-גרפים","מספר הקשתות יקטן וזה יגרום לחתך המינימלי להיות גדול מהזרימה המקסימלית"],a:0,e:"דייקסטרה חמדני: ברגע שקודקוד \"ננעל\" כקבוע הוא מניח שהמרחק אליו סופי ומינימלי. קשת שלילית מאוחרת יכולה לפתוח מסלול קצר יותר, אך האלגוריתם כבר לא יחזור לעדכן — ולכן עלול לטעות."},
{u:5,prof:true,s:"מסלול קצר ביותר.",q:"חברת שליחויות מעוניינת למצוא לא רק את המסלול הקצר ביותר, אלא את K המסלולים הקצרים ביותר. מה הערך התפעולי של גישה זו?",o:["צמצום שלב ה-Last Mile","הבטחה מתמטית שכל המסלולים יעברו דרך אותן קשתות בדיוק","המרת בעיית ניתוב מבעיית NP-קשה לבעיית תכנון לינארי רגילה","מתן חלופות גיבוי מוגדרות מראש למקרה של תאונות או חסימות"],a:3,e:"K-Shortest Paths נותן סט מסלולים חלופיים מוכנים מראש, כך שאם המסלול הקצר ביותר חסום (תאונה/חסימה) עוברים מיד לבא בתור."},
{u:5,prof:true,s:"סוכן נוסע מול מסלול קצר.",q:"בעיית הסוכן הנוסע ובעיית המסלול הקצר ביותר — מה ההבדל ביניהן?",o:["בבעיית הסוכן הנוסע חובה לעבור בכל קודקודי הגרף ולחזור לנקודת המוצא, ובבעיית המסלול הקצר מחפשים נתיב אופטימלי בין שני קודקודים ולא חובה לעבור בכל היתר","בעיית הסוכן הנוסע ניתנת לפתרון אופטימלי בזמן פולינומי מהיר ובעיית המסלול הקצר היא NP-קשה","בבעיית הסוכן הנוסע המשקולות מייצגות רק נפחי תנועה ויר\"מ ולא מרחקים או זמנים","בבעיית הסוכן הנוסע מניחים שכל כלי הרכב בעלי קיבולת מוגבלת ומחייבים פריקה במספר מסופי ביניים"],a:0,e:"סוכן נוסע = מעגל שעובר בכל הקודקודים פעם אחת וחוזר להתחלה (NP-קשה). מסלול קצר = נתיב אופטימלי בין שני קודקודים בלבד (נפתר בקלות בדייקסטרה)."},
{u:5,prof:true,s:"סוכן נוסע מול ניתוב רכבים.",q:"איזה אילוץ מתווסף כאשר עוברים מבעיית הסוכן הנוסע לבעיית ניתוב רכבים (VRP)?",o:["חיוב של כל משאית לעבור דרך החתך המינימלי","אילוץ שמחייב את כל כלי הרכב לנוע רק ברשת בלתי מכוונת","מגבלת הקיבולת של כלי הרכב, שמאלצת אותנו להשתמש במספר כלי רכב במספר מסלולים","ביטול כל המשתנים השלמים במודל והפיכתו למערכת משוואות לינאריות"],a:2,e:"בסוכן נוסע אין קיבולת רכב (רכב אחד יכול לבקר בכל הלקוחות). ב-VRP מתווספת מגבלת קיבולת — לא ניתן להבטיח שמשאית אחת תכסה את כל הלקוחות, ולכן צריך מספר רכבים ומספר מסלולים."},
{u:5,prof:true,s:"ניתוב רכבים.",q:"אלגוריתמים לניתוב רכבים מחולקים לשיטות מדויקות ולשיטות היוריסטיות. מדוע עבור צי המשרת 150 לקוחות מנהל הלוגיסטיקה יעדיף כמעט תמיד שיטה היוריסטית?",o:["מכיוון ששיטות מדויקות אינן מסוגלות לטפל באילוצים פשוטים כמו קיבולת ועלויות נסיעה","שיטות היוריסטיות מבטיחות להגיע לאופטימום מוחלט ב-100% מהמקרים","מכיוון ש-VRP היא בעיה NP-קשה, פתרון מדויק ל-150 לקוחות דורש זמן עצום, ואילו שיטה היוריסטית נותנת פתרון קרוב תוך שניות/דקות","שיטות מדויקות אינן ישימות לכלי רכב שנוסעים בכבישים"],a:2,e:"VRP היא בעיה NP-קשה — פתרון מדויק ל-150 לקוחות דורש זמן חישוב עצום (בלתי מעשי). היוריסטיקה מוותרת על ודאות האופטימום תמורת פתרון טוב \"מספיק\" במהירות."},
{u:1,s:"מתכנן תחבורה משווה בין כביש מהיר בין-עירוני לבין רחוב מקומי בשכונת מגורים.",q:"מהי התכונה המבחינה בין 'דרך מהירה' ל'דרך מקומית' בסיווג הדרכים?",o:["דרך מהירה = זרימה גבוהה ונגישות נמוכה; דרך מקומית = נגישות גבוהה וזרימה נמוכה","דרך מהירה מספקת גם זרימה גבוהה וגם נגישות גבוהה, ולכן היא עדיפה בכל מצב תכנוני","דרך מקומית מיועדת לתנועת משאיות בלבד, ואילו הדרך המהירה מיועדת לרכבים פרטיים","אין ביניהן הבדל תפקודי אלא רק הבדל במהירות הנסיעה המותרת על פי חוק בכל אחת"],a:0,e:"קיים trade-off בין זרימה לנגישות: דרך גבוהה בהיררכיה (מהירה) נותנת זרימה גבוהה אך נגישות נמוכה; דרך מקומית — נגישות גבוהה (כניסה לבתים) וזרימה נמוכה."},
{u:1,s:"מהנדס בוחן את הקיבולת המרבית (יר\"מ/נתיב/שעה) של סוגי דרכים שונים.",q:"לאיזה סוג דרך הקיבולת הגבוהה ביותר?",o:["דרך מהירה","דרך עורקית","דרך מאספת","דרך מקומית"],a:0,e:"סדר הקיבולת: מהירה (~2000) > עורקית (~1500) > מאספת (~750) > מקומית (~250) יר\"מ/נתיב/שעה. דרך גבוהה יותר בהיררכיה = קיבולת גבוהה יותר."},
{u:1,s:"בעקומת הזרימה-צפיפות, ככל שהצפיפות עולה מאפס הזרימה עולה, מגיעה לשיא ואז יורדת עד לפקק מלא (Dj).",q:"באיזו צפיפות מתקבלת הזרימה המקסימלית (qmax)?",o:["בצפיפות מחצית מצפיפות הפקק: D = Dj/2","בצפיפות אפס","בצפיפות הפקק המלא: D = Dj","בצפיפות המקסימלית האפשרית של הכביש"],a:0,e:"בעקומה הפרבולית q(D) הזרימה המקסימלית מתקבלת ב-D = Dj/2. בצפיפות 0 אין רכבים (q=0); בצפיפות פקק Dj המהירות 0 (q=0)."},
{u:1,s:"חברת אנרגיה צריכה להעביר נפט גולמי לאורך מאות ק\"מ בין שדה קידוח לבית זיקוק, ברציפות ובעלות נמוכה.",q:"איזה אמצעי תובלת מטען מתאים ביותר, וייחודי למטען (לא לנוסעים)?",o:["צנרת (Pipeline)","רכבת","אונייה","מטוס מטען"],a:0,e:"צנרת היא אמצעי תובלת מטען בלבד (נפט/גז/מים), להעברה רציפה בעלות נמוכה. מופיעה בסיווג המטען אך לא בסיווג הנוסעים."},
{u:2,s:"במסד נתונים שמורים שני שדות: השם 'ישראל ישראלי', והכתובת 'הרצל 23, תל אביב'.",q:"איזה מהם נחשב לנתון גאוגרפי?",o:["הכתובת — מכיוון שניתן למקם אותה על פני כדור הארץ באמצעות רשת קואורדינטות מוגדרת","השם — מכיוון שהוא מזהה ישות מסוימת במסד הנתונים ומאפשר לשייך אליה מאפיינים נוספים","שניהם גאוגרפיים, מכיוון שכל נתון השמור במערכת מידע מקבל ייחוס מרחבי אוטומטי","אף אחד מהם אינו גאוגרפי, מכיוון שנדרש שיהיו נתונים בפורמט ראסטר כדי להיחשב ככאלה"],a:0,e:"נתון גאוגרפי מיוחס למיקום על כדור הארץ (רשת קואורדינטות) — הכתובת. השם אינו מרחבי כלל. כל גאוגרפי הוא מרחבי, אך לא להפך."},
{u:2,s:"מנהל פרויקט GIS מבלבל בין 'מרכיבי המערכת' לבין 'שלבי התהליך'.",q:"מהם חמשת מרכיבי מערכת GIS?",o:["כח אדם, נתונים, תוכנה, חומרה, פרוצדורות","איסוף, אחסון, תשאול, ניתוח, תצוגה","וקטור, ראסטר, נקודה, קו, פוליגון","קרבה, שכבות-על, רשת, תשאול, פלט"],a:0,e:"5 מרכיבי GIS: כח אדם, נתונים, תוכנה, חומרה, פרוצדורות. אין לבלבל עם שלבי התהליך (איסוף→אחסון→תשאול→ניתוח→תצוגה→פלט)."},
{u:2,s:"אנליסט GIS מצליב שלוש שכבות — סוג קרקע, בעלות על המבנה, וסוג הבאר — כדי לזהות אזורים העונים על כל התנאים יחד.",q:"באיזה סוג ניתוח מדובר?",o:["ניתוח שכבות-על (Overlay)","ניתוח קרבה (Proximity)","ניתוח רשת (Network)","עיגון תמונה (Georeferencing)"],a:0,e:"Overlay מצליב מספר שכבות באותו מרחב לקבלת מידע משולב. קרבה = מרחק ממאפיין; רשת = מסלולים לאורך קווים."},
{u:2,s:"אמבולנס צריך למצוא את המסלול המהיר ביותר מבית החולים למקום התאונה לאורך רשת הכבישים.",q:"באיזה סוג ניתוח GIS מדובר?",o:["ניתוח רשת (Network)","ניתוח קרבה (Proximity)","ניתוח שכבות-על (Overlay)","תשאול (Query)"],a:0,e:"ניתוח רשת מחשב מסלולים וזמני נסיעה לאורך רשת קווית (כבישים). שונה מקרבה (טווח) ומ-Overlay (הצלבת שכבות)."},
{u:2,s:"קרטוגרף בוחר בין מפה בקנה מידה 1:500 למפה בקנה מידה 1:250,000 לאותו אזור.",q:"איזו טענה נכונה לגבי קנה המידה?",o:["1:500 הוא קנה מידה גדול יותר ומציג יותר פירוט; עיר עשויה להופיע בו כפוליגון ולא כנקודה","1:250,000 מציג יותר פירוט מכיוון שהמספר במכנה גדול יותר ולכן הוא מכיל יותר מידע","שתי המפות מציגות בדיוק את אותה רמת פירוט, וההבדל ביניהן הוא בגודל ההדפסה בלבד","קנה המידה אינו משפיע על אופן ייצוג הישויות, שנקבע מראש בעת הזנת הנתונים למערכת"],a:0,e:"מספר קטן יותר במכנה = קנה מידה גדול יותר = יותר פירוט. ב-1:500 עיר עשויה להיות פוליגון; ב-1:250,000 (קנ\"מ קטן) אותה עיר עשויה להיות נקודה."},
{u:2,s:"בעיר צפופה עם בניינים גבוהים המסתירים לוויינים, טלפון חכם מתקשה לקבל 'נעילת' GPS ראשונית מהירה.",q:"איזו טכנולוגיה נועדה לפתור זאת?",o:["AGPS (Assisted GPS) — שרת עזר באינטרנט שמספק את נתוני הלוויינים ומזרז את זמן הנעילה הראשונה (TTFF)","AVL — קופסה המותקנת ברכב, המשלבת נתוני GPS עם מפת GIS לצורך מעקב אחר צי הרכב","ראסטר — ייצוג המרחב באמצעות רשת תאים אחידה, שבה גודל התא קובע את רמת הרזולוציה","RFID — תגיות זיהוי אלחוטיות המשמשות למעקב אחר פריטי מלאי וסחורה במחסנים"],a:0,e:"AGPS משתמש בשרת-עזר (בעיקר במכשירים סלולריים) לספק נתוני לוויינים ולזרז את הנעילה הראשונה (TTFF), במיוחד באזורים עירוניים."},
{u:2,s:"רוצים להטמיע תצלום אוויר (ראסטר) שאינו מכיל מידע גאוגרפי בתוך מערכת GIS, כך שיתאים למיקום האמיתי בשטח.",q:"איזה תהליך נדרש?",o:["עיגון תמונה (Georeferencing) — התאמת התמונה למערכת הקואורדינטות בעולם האמיתי בעזרת סיבוב והגדלה","וקטוריזציה — המרת התמונה לנקודות, קווים ופוליגונים שניתן לבצע עליהם חישובים מתמטיים","ניתוח קרבה — בדיקה אילו אובייקטים נמצאים בתוך טווח מרחק מוגדר מאובייקט אחר במפה","טריאנגולציה — חישוב מיקום נקודה במרחב על ידי הצלבת מרחקים מכמה מקורות ידועים"],a:0,e:"עיגון תמונה ממקם תמונת ראסטר במערכת הקואורדינטות של העולם האמיתי (גודל תא, סיבוב, נקודת ייחוס E/N)."},
{u:3,s:"באלגוריתם פורד-פולקרסון לזרימה מקסימלית בונים רשת שיורית ומוסיפים לכל קשת גם קשת חוזרת (בכיוון הנגדי).",q:"מה מטרת הקשתות החוזרות?",o:["לאפשר 'לבטל' זרימה שהוקצתה בצעד קודם ולנתב אותה מחדש, וכך להגיע לפתרון האופטימלי","להכפיל את קיבולת הרשת, מכיוון שכל קשת חוזרת מוסיפה קיבולת זהה לקשת המקורית","למנוע מהאלגוריתם להיתקע בלולאה אינסופית בעת חיפוש מסלולים אוגמנטיים ברשת","להפוך את הגרף המכוון לגרף לא מכוון, כדי שניתן יהיה לנוע בו לשני הכיוונים בחופשיות"],a:0,e:"הקשתות החוזרות מאפשרות לתקן הקצאת זרימה שגויה מצעד קודם ולנתב מחדש. בלעדיהן האלגוריתם עלול להיתקע בפתרון לא אופטימלי."},
{u:3,s:"רוצים למצוא את החתך המינימלי (Min Cut) — קבוצת הקשתות שמחיקתן מנתקת את המקור מהיעד, בערך מינימלי.",q:"כיצד מוצאים אותו, ומהו הקשר לזרימה?",o:["פותרים תחילה את בעיית הזרימה המקסימלית; ערך החתך המינימלי שווה לה, והקשתות הרוויות מהוות את החתך","מוחקים את הקשת היקרה ביותר בגרף, וחוזרים על התהליך עד שהמקור מנותק לחלוטין מהיעד","מחפשים את המסלול הקצר ביותר בין המקור ליעד, והקשתות שעליו הן הקשתות של החתך המינימלי","סוכמים את קיבולות כל הקשתות בגרף ומחלקים במספרן, כדי לקבל את ערך החתך הממוצע"],a:0,e:"משפט Max-Flow/Min-Cut: ערך החתך המינימלי = הזרימה המקסימלית. מוצאים אותו ע\"י פתרון הזרימה המקסימלית; הקשתות הרוויות (זרימה=קיבולת) מהוות את צוואר הבקבוק = החתך."},
{u:3,s:"בבעיית זרימה מקסימלית קיימים כמה מקורות אספקה וכמה יעדים, במקום מקור יחיד ויעד יחיד.",q:"כיצד מטפלים במצב זה?",o:["מוסיפים מקור-על ויעד-על המחוברים לכל המקורות והיעדים בקשתות בעלות קיבולת אינסופית","פותרים בעיית זרימה נפרדת לכל זוג מקור-יעד, ולבסוף מסכמים את כל התוצאות שהתקבלו","מוחקים את כל המקורות פרט לזה בעל הקיבולת הגבוהה ביותר, וכך מצמצמים למקור יחיד","הופכים את הבעיה לבעיית שיבוץ, שבה כל מקור מותאם ליעד אחד בלבד בהתאמת אחד-לאחד"],a:0,e:"מוסיפים מקור-על המחובר לכל המקורות ויעד-על המחובר לכל היעדים, בקשתות קיבולת אינסופית — וכך מצמצמים לבעיית מקור/יעד יחיד."},
{u:3,s:"בבעיית זרימה כללית מסמנים לכל קודקוד ערך מאזן: חיובי, שלילי או אפס.",q:"מה משמעות הסימון?",o:["חיובי = מקור (היצע); שלילי = יעד (ביקוש); אפס = קודקוד מעבר","חיובי = יעד; שלילי = מקור; אפס = חסום","חיובי = עלות גבוהה; שלילי = עלות נמוכה","הסימן מציין רק את כיוון הקשת"],a:0,e:"מוסכמת הסימנים: מאזן חיובי = מקור/היצע, מאזן שלילי = יעד/ביקוש, מאזן 0 = קודקוד מעבר (נכנס=יוצא)."},
{u:4,s:"מרכז לוגיסטי מעביר סחורה כמעט מיד מעמדת הפריקה לעמדת הטעינה של משאיות היוצאות ללקוחות, כמעט ללא אחסון.",q:"כיצד נכנה שיטת עבודה זו?",o:["Cross-docking (שטעון) — מעבר סחורה ללא אחסון","מחסן אחסון ארוך-טווח","מלאי בטיחות","נמל עורפי"],a:0,e:"Cross-docking = מעבר סחורה ישירות מפריקה לטעינה ללא (או כמעט ללא) אחסון. שונה ממחסן שנועד לאחסון."},
{u:4,s:"חברה ממקמת מחסן יחיד המשרת לקוחות בעלי ביקושים (משקלים) שונים, ורוצה למזער את עלות השינוע. המרחקים נמדדים לאורך צירים (Rectilinear).",q:"כיצד נקבע המיקום האופטימלי?",o:["לפי החציון המשוקלל בכל ציר בנפרד (X ואז Y) — לא הממוצע!","לפי הממוצע החשבוני של מיקומי הלקוחות","לפי הלקוח עם הביקוש הגבוה ביותר בלבד","לפי מרכז הריבוע החוסם את כל הלקוחות"],a:0,e:"בפתרון מיקום מתקן יחיד ב-Rectilinear, המיקום האופטימלי לכל ציר הוא החציון המשוקלל (הנקודה שבה המשקל המצטבר עובר את מחצית סך המשקל) — ולא הממוצע."},
{u:4,s:"לקוח נמצא בין המפעל לבין מרכז הפצה. מנקודה מסוימת ואילך זול יותר לספק לו ממרכז ההפצה מאשר ישירות מהמפעל.",q:"כיצד נקבעת נקודת המעבר (גבול ההפצה)?",o:["בנקודה שבה עלות האספקה משני המקורות שווה","בנקודה האמצעית הגיאומטרית בין המפעל למרכז","תמיד במרכז ההפצה, ללא תלות בעלות","לפי הלקוח הרחוק ביותר בלבד"],a:0,e:"גבול ההפצה הוא נקודת שוויון העלויות — המקום שבו עלות האספקה מהמפעל שווה לעלות מהמרכז. משם והלאה כדאי לספק מהמקור הזול יותר."},
{u:4,s:"חברת תעופה מרכזת טיסות דרך מספר נמלי-על מרכזיים, ומהם מפעילה 'חישורים' לשדות תעופה משניים.",q:"כיצד נכנה מבנה רשת זה ומה יתרונו?",o:["Hub & Spokes — רשת היררכית עם מרכזי-על וחישורים, המאפשרת קונסולידציה (איחוד) יעילה של תנועה","רשת 'שתי וערב' מלאה — חיבור ישיר בין כל זוג צמתים, מה שמייתר לחלוטין את הצורך במרכזים","בעיית מחלק הדואר הסיני — בניית מסלול שעובר בכל קווי התעופה של החברה פעם אחת בלבד","חתך מינימלי — איתור קבוצת הקווים שביטולם ינתק את הרשת בעלות הנמוכה ביותר לחברה"],a:0,e:"Hub & Spokes = רשת היררכית עם מרכזי-על (Hubs) וחישורים (Spokes). יעילה לקונסולידציה של תנועה בתעופה ובשילוח."},
{u:4,s:"מודדים מרחק בין מתקן ללקוחות בעיר הבנויה כרשת רחובות מלבנית (כמו מנהטן), שבה אי אפשר לנסוע באלכסון בין הבניינים.",q:"איזו מדידת מרחק מתאימה?",o:["Rectilinear — מדידה לאורך הצירים (X ו-Y בנפרד), בדומה לרשת הרחובות של מנהטן","Euclidean — מדידת קו אווירי ישר בין שתי הנקודות, ללא התחשבות במבנה הרחובות","מרחק מפורש — חישוב המסלול בפועל ברשת הכבישים באמצעות מערכת GIS מדויקת","חציון משוקלל — מציאת הנקודה שבה המשקל המצטבר עובר את מחצית סך המשקלים"],a:0,e:"ברשת רחובות מלבנית נעים לאורך הצירים בלבד, ולכן המרחק הוא Rectilinear (מנהטן). Euclidean (קו ישר/אווירי) לא מתאים כי אי אפשר לחצות בניינים."},
{u:5,s:"בבעיית ניתוב מגדירים 'מעגל המילטוני'.",q:"מהו מעגל המילטוני?",o:["מסלול מעגלי העובר בכל קודקודי הגרף פעם אחת בדיוק וחוזר אל קודקוד ההתחלה","מסלול העובר בכל קשתות הגרף פעם אחת בדיוק ומסתיים בקודקוד שממנו יצא בתחילה","המסלול הקצר ביותר בין שני קודקודים נתונים, המחושב בעזרת אלגוריתם דייקסטרה","כל מסלול אפשרי בגרף שלם, מכיוון שבגרף שלם קיימת קשת בין כל זוג קודקודים"],a:0,e:"מעגל המילטוני עובר בכל הקודקודים פעם אחת וחוזר להתחלה — זו ההגדרה של פתרון TSP. (לעומת מחלק הדואר שעובר בכל הקשתות.)"},
{u:5,s:"סטודנט חושב שאלגוריתם דייקסטרה מחשב מסלול קצר רק בין קודקוד מוצא אחד לקודקוד יעד אחד.",q:"מהי התכונה הנכונה של דייקסטרה?",o:["הוא מוצא בבת אחת את המסלולים הקצרים ביותר מקודקוד המוצא אל כל שאר הקודקודים בגרף","הוא מוצא מסלול רק בין שני קודקודים ספציפיים שהוגדרו מראש כמוצא וכיעד לפני ההרצה","הוא פועל רק בגרף שלם שבו קיימת קשת בין כל זוג קודקודים, אחרת התוצאה אינה מוגדרת","הוא מוצא את המעגל הקצר ביותר שעובר בכל הקודקודים וחוזר אל נקודת המוצא ההתחלתית"],a:0,e:"דייקסטרה הוא single-source: מקודקוד מוצא אחד הוא מוצא בו-זמנית את המסלולים הקצרים לכל שאר הקודקודים (בגרף עם 6 קודקודים — 5 מסלולים)."},
{u:5,s:"חברת הפצה נדרשת לספק לכל לקוח בתוך טווח שעות מוסכם מראש, ולא בכל שעה שנוחה לה.",q:"איזו הרחבה של בעיית ניתוב הרכבים מתוארת?",o:["חלונות זמן (Time Windows)","בעיית מחלק הדואר","זרימה מקסימלית","K-Shortest Paths"],a:0,e:"חלונות זמן = אילוץ שהגעה ללקוח תהיה בטווח זמן שנקבע מראש (קשיח/גמיש/מרובה). הרחבה נפוצה של VRP."},
{u:5,s:"עיריית תל אביב מתכננת מסלול לרכב פינוי אשפה שיעבור בכל רחובות השכונה; מנהל אחר מתכנן מסלול למפקח שיבקר בכל הצמתים המסוכנים.",q:"אילו בעיות מתאימות בהתאמה?",o:["פינוי אשפה = מחלק הדואר (מעבר בכל הקשתות); ביקור בצמתים = סוכן נוסע (מעבר בכל הקודקודים)","שתי הבעיות הן בעיות סוכן נוסע, מכיוון שבשתיהן נדרש לעבור בכל הנקודות ולחזור לנקודת המוצא","שתי הבעיות הן בעיות מחלק הדואר, מכיוון שבשתיהן הרכב נע לאורך רחובות השכונה עד לסיום","פינוי אשפה = מסלול קצר ביותר בין שני רחובות; ביקור בצמתים = זרימה מקסימלית ברשת העירונית"],a:0,e:"מעבר בכל הרחובות (קשתות) = מחלק הדואר. ביקור בכל הצמתים (קודקודים) = סוכן נוסע. ההבחנה: קשתות מול קודקודים."},
{u:5,s:"חברת הפצה שוקלת להסב את צי המשאיות לרכבים חשמליים, ומגלה שעליה להתחשב במיקום תחנות הטעינה בתכנון המסלולים.",q:"איזו הרחבה של בעיית ניתוב הרכבים מתאימה?",o:["E-VRP (Electric VRP) — ניתוב רכבים חשמליים תוך התחשבות במיקום ובזמינות של תחנות הטעינה","בעיית שיבוץ — התאמה של אחד-לאחד בין כל רכב חשמלי לבין תחנת טעינה ייעודית שהוקצתה לו","חתך מינימלי — איתור צוואר הבקבוק ברשת הכבישים שמגביל את תנועת הרכבים החשמליים","P-Median — מזעור סכום המרחקים המשוקללים בין תחנות הטעינה לבין לקוחות החברה"],a:0,e:"E-VRP הוא ענף של Green-VRP המטפל בניתוב רכבים חשמליים, ומחייב התייחסות למיקום ולזמינות תחנות הטעינה לאורך המסלול."},
{u:1,s:"בעקומת זרימת התנועה, הזרימה המקסימלית היא 1000 רכבים/שעה. בשעה מסוימת נמדדה זרימה של 500 רכבים/שעה (שאינה זרימת השיא).",q:"כמה ערכי צפיפות ומהירות מתאימים לזרימה של 500?",o:["שתי צפיפויות ושתי מהירויות — לכל ערך זרימה (מלבד זרימת השיא) מתאימים שני פתרונות שונים","צפיפות אחת ומהירות אחת בלבד, מכיוון שהקשר בין זרימה לצפיפות הוא ליניארי וחד-ערכי","אינסוף פתרונות אפשריים, מכיוון שהזרימה אינה קובעת כלל את הצפיפות או את המהירות","אף פתרון אינו קיים, מכיוון ש-500 נמוך מדי ביחס לזרימה המקסימלית שנמדדה בכביש"],a:0,e:"עקומת q(D) פרבולית: כל ערך זרימה (למעט qmax בשיא) מתקבל בשתי צפיפויות שונות — נמוכה (זרימה חופשית) וגבוהה (לקראת פקק) — ולכן גם שתי מהירויות. רק בשיא יש פתרון יחיד."},
{u:1,s:"מנהל לוגיסטיקה משלב מלגזה, משאית ורכבת לאורך אותו מסלול הפצה, במקום להשתמש רק במשאית.",q:"מהי המטרה העיקרית של שינוע רב-אמצעי (Inter-modality)?",o:["הפצה יעילה יותר — לא בהכרח זולה או מהירה יותר","תמיד הפצה זולה יותר","תמיד הפצה מהירה יותר","ביטול הצורך במחסני ביניים"],a:0,e:"אינטר-מודליות = שילוב אמצעי הובלה לאורך המסלול לשם הפצה יעילה יותר. לא בהכרח הזול או המהיר ביותר — לעיתים דווקא יקר/איטי יותר, אך יעיל בהיבט הכולל."},
{u:1,s:"חבילה מחו\"ל מגיעה במטוס למרכז ההפצה בארץ, ומשם צריכה להגיע ללקוח בודד שביתו בנקודה מרוחקת וקשה להגעה.",q:"כיצד נכנה את אתגר השלב האחרון — מנקודת ההפצה עד ללקוח עצמו?",o:["בעיית המייל האחרון (Last Mile)","אינטר-מודליות","רמת מינוע","שיטעון"],a:0,e:"'המייל האחרון' (Last Mile) — הבאת המשלוח מנקודת ההפצה האחרונה עד ללקוח הסופי. לרוב החלק היקר והמורכב ביותר, כי הלקוחות מפוזרים ולחלקם קשה להגיע."},
{u:2,s:"רוצים לצייר בית קלאסי (ריבוע עם 'איקס' וגג משולש) בלי להרים את העיפרון ובלי לעבור על קו פעמיים — מסלול אוילר שעובר בכל קשת בדיוק פעם אחת.",q:"מהו התנאי לקיום מסלול כזה בגרף קשיר?",o:["בדיוק 0 או 2 קודקודים בעלי דרגה אי-זוגית","כל הקודקודים בדרגה אי-זוגית","מספר הקודקודים זוגי","מספר הקשתות שווה למספר הקודקודים"],a:0,e:"מסלול אוילר (מעבר בכל קשת פעם אחת) קיים בגרף קשיר רק אם יש 0 קודקודים אי-זוגיים (מסלול מעגלי) או בדיוק 2 (מתחילים באחד ומסיימים בשני)."},
{u:2,s:"בבעיית הגשרים של קניגסברג חיפשו מסלול מעגלי שעובר בכל 7 הגשרים בדיוק פעם אחת, ואויילר הוכיח שאי אפשר.",q:"מדוע לא ניתן היה למצוא מסלול כזה?",o:["מכיוון שהיו קודקודים בדרגה אי-זוגית (יותר מ-0 או 2), ולכן התנאי לקיום מסלול אוילר לא התקיים","מכיוון שמספר הגשרים בעיר היה גדול מדי, וכל תוספת גשר מכפילה את מספר המסלולים האפשריים","מכיוון שהנהר חצה את העיר לשניים, ולכן לא ניתן היה לעבור בין גדות הנהר בלי לחזור על גשר","מכיוון שהגרף לא היה קשיר — היו יבשות שלא היה אליהן חיבור כלל דרך אף אחד מהגשרים"],a:0,e:"אויילר תרגם את העיר לגרף (יבשות=קודקודים, גשרים=קשתות). מסלול מעגלי בכל קשת פעם אחת דורש שכל הקודקודים בדרגה זוגית; בקניגסברג היו קודקודים אי-זוגיים ולכן בלתי אפשרי."},
{u:4,s:"מוכר גלידה בוחר היכן להתמקם בחוף. באפשרות אחת הוא חופשי לעמוד בכל נקודה לאורך החוף; באפשרות שנייה מותר לו רק במספר עמדות שהוגדרו מראש.",q:"כיצד נכנה את שני סוגי המודלים בהתאמה?",o:["רציף (המתקן יכול להתמקם בכל נקודה) מול בדיד (רק ממספר נקודות שהוגדרו מראש)","בדיד (המתקן יכול להתמקם בכל נקודה) מול רציף (רק ממספר נקודות שהוגדרו מראש)","שני המודלים רציפים, ונבדלים זה מזה רק באופן שבו מחושב המרחק אל הלקוחות","שני המודלים בדידים, ונבדלים זה מזה רק במספר המתקנים שמותר להקים בכל אחד"],a:0,e:"מודל רציף — המתקן יכול להתמקם בכל נקודה במרחב. מודל בדיד — רק ממספר מיקומים מוגדרים מראש שצריך לבחור ביניהם."},
{u:4,s:"צריך להקים מרלו\"ג במרחק שלא יעלה על 100 ק\"מ מכל לקוח. המיקומים האפשריים הם A, B, C בלבד, ונמצא ש-A רחוק 120 ק\"מ מ-C.",q:"מה המסקנה?",o:["במודל בדיד ייתכן שאין פתרון שעומד באילוץ; במודל רציף אפשר היה למקם בדיוק בנקודה המקיימת 100 ק\"מ","במודל בדיד תמיד קיים פתרון, כי אפשר לבחור את הנקודה הקרובה ביותר גם אם היא חורגת מהאילוץ שהוגדר","המרחק בין הנקודות אינו רלוונטי להחלטה, מכיוון שהאילוץ מתייחס רק לעלויות ההקמה של המתקן","יש למקם את המרלו\"ג ב-A מכיוון שהוא הנקודה הראשונה ברשימה ולכן ברירת המחדל של המודל"],a:0,e:"במודל בדיד מוגבלים לנקודות קיימות, ולכן ייתכן שאף אחת לא עומדת באילוץ (120>100) ואין פתרון. במודל רציף אפשר למקם בדיוק בנקודה שמקיימת את 100 ק\"מ."},
{u:4,s:"רוצים לוודא שכל הלקוחות נמצאים במרחק סביר ממרלו\"ג, אך אין מערכת GIS מדויקת ולכן מעריכים את המרחק.",q:"איזו טענה נכונה לגבי שיטות הערכת המרחק?",o:["קו אווירי (אוקלידי) נותן הערכת חסר — קצר מהמציאות; מדידה לאורך צירים (X ואז Y) נותנת הערכה מחמירה — ארוכה יותר מהמסלול בפועל","קו אווירי תמיד ארוך מהמסלול האמיתי בכביש, ולכן הוא נחשב להערכה מחמירה שכדאי להסתמך עליה בתכנון","מדידה לאורך הצירים נותנת הערכת חסר, כי היא מקצרת את המסלול על ידי חיתוך אלכסוני בין הנקודות","כל שיטות ההערכה נותנות בדיוק את אותו מרחק, ולכן אין חשיבות לבחירה ביניהן בשלב התכנון"],a:0,e:"קו אווירי ישר קצר מהמסלול האמיתי בכביש → הערכת חסר. מדידה לאורך צירים (רוחב ואז אורך, כמו מנהטן) ארוכה יותר → הערכה מחמירה. מדידה מפורשת ב-GIS היא המדויקת."},
{u:4,s:"חברת הפצה A יודעת מראש בדיוק כמה כל לקוח יזמין בכל יום. חברה B לא יודעת — הכמות משתנה אקראית, וידועות רק ההסתברות וסטיית התקן.",q:"כיצד נסווג את שתי הבעיות בהתאמה?",o:["דטרמיניסטית (A) מול סטוכסטית (B)","סטוכסטית (A) מול דטרמיניסטית (B)","שתיהן דטרמיניסטיות","שתיהן סטטיות"],a:0,e:"בעיה דטרמיניסטית — כל הנתונים ידועים וקבועים (קל יותר לתכנן). בעיה סטוכסטית — יש אקראיות; יודעים רק התפלגות/הסתברות ולא ערכים מדויקים, מה שמקשה על תכנון."},
{u:5,s:"פיצרייה מקבלת הזמנות באופן רציף לאורך הערב — לא יודעים מראש מי יזמין ומתי, וההזמנות נכנסות תוך כדי הנסיעות.",q:"כיצד נסווג את בעיית הניתוב הזו?",o:["בעיה דינאמית — המידע מתעדכן בזמן אמת, ולכן לא ניתן לבנות מסלול הפצה קבוע מראש","בעיה סטטית — כל ההזמנות והכמויות ידועות מראש, ולכן ניתן לתכנן את המסלול המלא לפני היציאה","בעיית המסלול הקצר ביותר — מחפשים את הנתיב הזול ביותר בין הפיצרייה ללקוח בודד","בעיית מחלק הדואר הסיני — נדרש לעבור בכל רחובות העיר ולא רק בכתובות שהזמינו"],a:0,e:"בבעיה דינאמית ההזמנות/הנתונים משתנים תוך כדי, ולכן לא ניתן לבנות מסלול קבוע מראש — צריך לעדכן בזמן אמת. בבעיה סטטית הכל ידוע מראש."},
{u:5,s:"כדי למצוא בוודאות את הפתרון האופטימלי לבעיית הסוכן הנוסע, מחשב מייצר את כל המסלולים האפשריים, מחשב את אורך כל אחד ובוחר את הקצר.",q:"כיצד נקראת גישה זו ומה חסרונה?",o:["Brute Force ('כוח גס') — מובטח שיימצא האופטימום, אך בלתי מעשי כי מספר המסלולים גדל בקצב עצרתי עצום","היוריסטיקת השכן הקרוב — מהירה מאוד ומבטיחה את המסלול המדויק ביותר בכל גודל של בעיה","אלגוריתם דייקסטרה — פותר את הבעיה בזמן פולינומי מהיר גם עבור מאות קודקודים ברשת","גישה חמדנית — בוחרת בכל צעד את הקודקוד הקרוב ביותר ומבטיחה תמיד את הפתרון האופטימלי"],a:0,e:"Brute Force בודק את כל האפשרויות ומבטיח אופטימום, אך מספר המסלולים גדל בקצב עצרתי (סופר-אקספוננציאלי) — כבר ב-10 ערים ~מיליוני מסלולים — ולכן בלתי מעשי. לכן משתמשים בהיוריסטיקות."},
{u:5,s:"מריצים את אלגוריתם 'השכן הקרוב ביותר' על אותה בעיית סוכן נוסע, אך פעם מתחילים מקודקוד אחד ופעם מקודקוד אחר.",q:"מה צפוי לקרות?",o:["ייתכן שנקבל מסלול סופי שונה לחלוטין — נקודת ההתחלה משפיעה ישירות על התוצאה","התוצאה תהיה תמיד זהה ללא תלות בנקודת ההתחלה, מכיוון שמדובר במסלול מעגלי סגור","האלגוריתם כלל לא יוכל לפעול אם משנים את נקודת ההתחלה שהוגדרה בהרצה הראשונה","נקבל תמיד את הפתרון האופטימלי, מכיוון שהאלגוריתם בודק את כל נקודות ההתחלה"],a:0,e:"מכיוון שהשכן הקרוב חמדני, בחירה מוקדמת משפיעה על ההמשך. שינוי נקודת ההתחלה יכול להוביל למסלול מעגלי שונה לחלוטין (ולרוב לא אופטימלי) — אף שהוא עדיין מבקר בכל הנקודות."},
{u:5,s:"מתכנן מסלולי הפצה משווה בין רשת של כבישים חד-סטריים לרשת של כבישים דו-סטריים.",q:"איזו טענה נכונה לגבי מורכבות בעיית הניתוב?",o:["רשת דו-סטרית מורכבת וקשה יותר לפתרון, כי ההלוך שונה מהחזור ולמעשה היא מכפילה את מספר הקשתות ברשת","רשת חד-סטרית מורכבת יותר, מכיוון שהיא מגבילה את כיווני הנסיעה ומחייבת מסלולי עקיפה ארוכים","אין הבדל במורכבות בין שתי הרשתות, מכיוון שמספר הקודקודים בשתיהן נשאר זהה לחלוטין","רשת דו-סטרית היא תמיד חסרת פתרון, ולכן חייבים להמיר אותה לרשת חד-סטרית לפני הפתרון"],a:0,e:"בכביש דו-סטרי כל קטע מתפצל לשני כיוונים (הלוך≠חזור), מה שמכפיל את מספר הקשתות ומגדיל את מורכבות הבעיה. רשת חד-סטרית פשוטה יותר."}
