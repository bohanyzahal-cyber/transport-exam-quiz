<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>חומר פתוח — ניהול מערכות תובלה ושינוע</title>
<style>
/* ---------- בסיס ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8a8f96}
body{font:12.4px/1.46 "Segoe UI","Arial Hebrew",Arial,sans-serif;color:#12161c;direction:rtl}

/* ---------- עמוד ---------- */
/* A4 = 210×297mm. הריפוד הימני רחב יותר — שם הכריכה/הסיכה. */
.pg{position:relative;width:209.9mm;height:296.8mm;padding:13mm 11mm 11mm 16mm;
    background:#fff;margin:0 auto 7mm;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pg.over{outline:3px solid #d92b2b}
.pg.over::after{content:"גלישה";position:absolute;left:2mm;bottom:2mm;
    background:#d92b2b;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px}

/* כותרת רצה */
.hd{position:absolute;top:5mm;right:11mm;left:16mm;display:flex;
    justify-content:space-between;align-items:baseline;
    border-bottom:1.6px solid var(--c,#333);padding-bottom:1.5mm;
    font-size:10px;letter-spacing:.2px}
.hd b{font-size:12.5px;color:var(--c,#333)}
.hd span{color:#7a828c}
.pgn{position:absolute;bottom:4.5mm;left:16mm;font-size:10px;color:#7a828c}
.pgn b{color:#333}

/* לשונית צד — המיקום האנכי משתנה לפי הנושא, כך שבערימת דפים
   נראות "מדרגות" וניתן לדפדף ישר לנושא בלי לקרוא. */
.tab{position:absolute;left:0;width:11mm;background:var(--c,#333);color:#fff;
     display:flex;align-items:center;justify-content:center;
     writing-mode:vertical-rl;font-size:9.5px;font-weight:700;letter-spacing:.4px;
     padding:2mm 0;border-radius:3px 0 0 3px}

/* ---------- תוכן ---------- */
.body{margin-top:6.5mm;column-gap:7mm}
.body.c2{column-count:2;column-rule:1px solid #dfe3e8}
h2{font-size:13.5px;color:#fff;background:var(--c,#333);padding:1.3mm 2.5mm;
   border-radius:2.5px;margin:0 0 1.6mm;break-after:avoid}
h2:not(:first-child){margin-top:3mm}
h3{font-size:12px;color:var(--c,#333);margin:2.4mm 0 1mm;break-after:avoid;
   border-bottom:1px dotted #c3c9d0;padding-bottom:.6mm}
h3:first-child{margin-top:0}
dl{margin:0 0 1.2mm}
dt{font-weight:700;font-size:12.2px;display:inline}
dd{display:inline;margin:0}
dl>div{margin-bottom:.9mm;break-inside:avoid;text-indent:-3.2mm;padding-right:3.2mm}
dt::before{content:"▪ ";color:var(--c,#333);font-weight:700}
dt::after{content:" — ";font-weight:400;color:#7a828c}
.n{color:#0b4f9e;font-weight:700;font-feature-settings:"tnum"}
.q{color:#3d4650;font-style:italic}
em{font-style:normal;background:#fff2b8;padding:0 1px;border-radius:2px}
.warn{background:#fdeaea;border-right:2.5px solid #d92b2b;padding:1.2mm 2mm;
      margin:1.2mm 0;break-inside:avoid;border-radius:0 2.5px 2.5px 0}
.warn b{color:#a51b1b}

/* תרשימים — לא נחתכים בין טורים, ונדפסים בשחור */
.fig{margin:1.2mm 0 2mm;break-inside:avoid;page-break-inside:avoid;
     text-align:center;color:#1a1a1a;direction:ltr}
.fig svg{width:100%;max-width:60mm;height:auto}
.fig figcaption{direction:rtl;font-size:9.4px;color:#42506a;
     margin-top:.5mm;line-height:1.35;text-align:right}

/* טבלאות */
table{border-collapse:collapse;width:100%;font-size:11.2px;margin:0 0 2mm;break-inside:avoid}
th{background:var(--c,#333);color:#fff;text-align:right;padding:1mm 2mm;font-size:10px}
td{border-bottom:1px solid #dfe3e8;padding:.9mm 2mm;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fa}
td.k{font-weight:700;white-space:nowrap;color:#0b4f9e;font-feature-settings:"tnum"}

/* ---------- שער ---------- */
.cover{text-align:center;padding-top:24mm}
.cover h1{font-size:30px;letter-spacing:-.5px;margin-bottom:2mm}
.cover .sub{font-size:13px;color:#5b6470;margin-bottom:12mm}
.toc{text-align:right;max-width:150mm;margin:0 auto}
.toc a{display:flex;align-items:baseline;gap:2mm;text-decoration:none;color:#12161c;
       padding:1.5mm 2mm;border-radius:3px;font-size:13px}
.toc a:nth-child(odd){background:#f2f5f8}
.toc .sw{width:4mm;height:4mm;border-radius:2px;flex:none}
.toc .nm{flex:1;font-weight:700}
.toc .dots{flex:1;border-bottom:1.5px dotted #b9c0c8;transform:translateY(-2px)}
.toc .pn{font-weight:700;color:#0b4f9e;font-feature-settings:"tnum"}
.tip{max-width:150mm;margin:10mm auto 0;background:#f2f5f8;border-radius:4px;
     padding:4mm 5mm;font-size:11px;line-height:1.55}
.tip b{display:block;margin-bottom:1.5mm;font-size:12px}

/* ---------- מפתח ---------- */
.idx{column-count:3;column-gap:6mm;font-size:10.6px;line-height:1.5}
.idx div{break-inside:avoid}
.idx .t{font-weight:700}
.idx .p{color:#0b4f9e;font-weight:700}
.idx h3{column-span:all}
/* כותרת המקטע הלועזי בתוך המפתח */
.idx .ixhd{column-span:all;margin:2.5mm 0 1.5mm;padding-top:1.5mm;
  border-top:1.2px solid #c8d0d8;font-weight:800;font-size:11.4px;color:#3d4650}
/* שורה שמתחילה באות לטינית מוצגת LTR, אחרת המספרים קופצים לצד הלא נכון */
.idx div.ltr{direction:ltr;text-align:left}

/* ---------- הדפסה ---------- */
@page{size:A4;margin:0}
@media print{
  html{background:#fff}
  .pg{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg.over{outline:none}
  .pg.over::after{display:none}
  .noprint{display:none}
}
.noprint{position:fixed;top:8px;left:8px;z-index:99;background:#12161c;color:#fff;
  border-radius:6px;padding:7px 11px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.noprint button{background:#2d6cdf;color:#fff;border:0;border-radius:4px;
  padding:4px 9px;font-size:12px;cursor:pointer;margin-right:6px}
.noprint a{color:#9ec5ff;text-decoration:none;font-size:12px;margin-right:9px}
.noprint a:hover{text-decoration:underline}
</style>
</head>

{items:[

"חמדני :: אופטימום **מקומי** בכל צעד, בלי לשקול את העתיד. בדייקסטרה ← אופטימלי · ב-TSP ← רק קירוב. __לא__ «תמיד אופטימלי» ו__לא__ «אקראי»",
"TSP מול מחלק הדואר :: TSP = כל ה**קודקודים** · מחלק הדואר = כל ה**קשתות**. טאטוא, אשפה, חלוקת דואר ← __קשתות__",

"היצע ≠ ביקוש :: המודל __לא__ הופך ללא-פתיר ופונקציית המטרה __לא__ שלילית — פשוט מאזנים בצומת פיקטיבי",
"שכן קרוב (TSP) :: ⟨2⟩·S_opt ≥ S_alg ≥ S_opt. מהיר וסביר — __לא__ אופטימלי. שינוי נקודת ההתחלה ← מסלול אחר",
"Brute Force :: מבטיח אופטימום אך **בלתי מעשי** (גידול עצרתי). לכן היוריסטיקות",
"עלות מול מרחק :: המיקום הזול __אינו__ הקרוב ביותר ו__לא__ הרחוק ביותר — **עקומת U**, מינימום בנקודת ביניים",

"⟨3⟩ :: פסול החלפות שיטה («תובלה בסולבר ושיטעון היוריסטי») ואבסורדים (צינורות גז ונפט, לולאה אינסופית)",

"ספרייה — חציון משוקלל :: סה״כ ⟨2040⟩ ← חציון **⟨1020⟩** ← X=⟨6⟩ (מדעי הרוח), Y=⟨12⟩ (מדעים) ← **(⟨6⟩,⟨12⟩)**",
"דייקסטרה מ-V1 :: V2=⟨7⟩ · V3=⟨9⟩ · V4=⟨4⟩ · V5=⟨8⟩ · V6=⟨5⟩",
"שכן קרוב :: **⟨2⟩·S_opt ≥ S_alg ≥ S_opt**",
"סיבוכיות VRP :: O(n²·3ⁿ) לניתוב רכב בודד",
"רכב תקן WB-20 :: אורך ⟨22.41⟩ מ׳ · **רדיוס פנייה מינימלי ⟨13.72⟩ מ׳** · זווית היגוי ⟨28.4⟩°"
]}
]},

/* ══════════════════════════ 3 · יחידה 1 */
{name:"1 · מבוא", color:"#1f4e79", sub:"שיעורים 1–2 · 19 שקפים", cols:2, blocks:[

{h2:"חשיבות התחום"},
{items:[
"גלובליזציה :: עד לפני ⟨20⟩–⟨30⟩ שנה רוב הארגונים עסקו בשוק המקומי; היום ייבוא ושיווק לחו״ל ← מורכבות שינוע גדולה יותר",
"יתרון לגודל :: ככל שהארגון גדול, גדל הצורך לנהל אספקה והפצה בין סניפים ומחסנים — וניהול יעיל של צי גדול חוסך כסף",
"התמחות :: ידע בתהליכי שינוע נכונים חוסך לארגון כסף רב",
"שרשרת האספקה :: מהספקים של הספקים, דרך היצרן, המפיץ והחנויות ועד הלקוח. **שיתוף מידע לאורך השרשרת מפחית אי-ודאות** ומאפשר תכנון מלאים, כמויות ועיתוי",
"אתגרים :: עומס (כבישים, מלאים) · מלאים · מרכזי הפצה מול מחסנים",
"חקר ביצועים :: הכלי לפתרון בעיות תחבורתיות ולוגיסטיות במודלים מתמטיים ואלגוריתמים"
]},
{items:[
"תחומים עיקריים בתחבורה ⟦⟧ :: הנדסת תעבורה · תכנון תחבורה · חקר ביצועים · כלכלת תחבורה · תכנון עירוני ואזורי · בטיחות · הגורם האנושי · איכות הסביבה"
]},

{h2:"לוגיסטיקה ו-JIT"},
{items:[
"מטרת הלוגיסטיקה :: לאפשר לרצפת הייצור לעבוד ביעילות — כולל הובלת חומרי גלם והתוצר המוגמר",
"**JIT** (Just-In-Time) :: הספק מספק **מה שצריך, מתי שצריך**. __לא מחזיקים מלאים__. דורש קשרים טובים עם הספק ושיתוף מידע",
"השלכה על מיקום :: JIT ← **מחסנים קרובים גיאוגרפית ללקוח** (אספקה מהירה ואמינה). מרחק גדול הורס JIT"
]},

{h2:"אמצעי הובלה"},
{items:[
"נוסעים :: Air · Road · Rail · Maritime",
"מטען :: Air · Truck · Rail · Maritime · Inland/Coastal · **Pipeline** (צנרת — ייחודי למטען!)",
"הבחירה :: **תלויה בצורך**. ארגונים גדולים (שופרסל, קוקה-קולה, צה״ל) לעיתים מנהלים מערך עצמאי — שליטה על איכות ושיקולים כלכליים",
"מה מסתתר ב«לעשות הכול לבד» :: **כבישי אגרה · אוכל ולינה לנהגים · שעות נהיגה**. מסלול שלם במשאית אחת __לא בהכרח זול יותר__"
]},

{h3:"⟦מונחי מטען באנגלית · RoRo · Truckload⟧ מונחי מטען לועזיים"},
{items:[
"**Intermodal Container** (מכולה תקנית) :: מכולה בתקן אחיד, ולכן היא עוברת **בין רכבת, אונייה ומשאית בלי לפרוק את התוכן**. זה עיקרון היסוד שמאפשר אינטר-מודליות בכלל",
"**Truckload** (TL) :: משלוח ש**ממלא רכב שלם** ונוסע ישירות מהמוצא ליעד",
"**Less than Truckload** (LTL) :: משלוח **קטן שמאוחד** עם משלוחים אחרים באותו רכב — זול יותר ליחידה, אך איטי יותר בגלל האיחוד והפיצול",
"**RoRo** (Roll-on / Roll-off) :: ציוד **גלגלי עולה ויורד מהאונייה בכוחות עצמו** — בלי מנוף ובלי מסוף מכולות. __ההבדל ממכולות הוא שיטת הטעינה__, לא סוג המטען"
]},
{warn:"⚠ **על ארבעת המונחים האלה:** הם __לא מופיעים__ במצגות הקורס ולא בתמלילי ההרצאות שברשותנו — אבל הם מסתובבים בסיכומים בכיתה ובמאגר שאלות חיצוני. הם כאן כביטוח, לא כי אומתו כחומר נבחן. **אל תשקיעו בהם זמן לימוד על חשבון מה שכן במיקוד.**"},

{h2:"מדיניות ותמחור גודש"},
{items:[
"למה זה שייך לכאן :: **מדיניות וחוקים** הם אחד מ-⟨4⟩ מרכיבי התנועה — הרשות משנה זרימה בלי לסלול מטר",
"כביש ⟨6⟩ :: גובים תשלום **כדי לשמור עליו לא עמוס**",
"הנתיב המהיר :: התשלום **גבוה יותר דווקא בשעות העומס** — מחיר שעולה עם הביקוש",
"__העיקרון__ :: מתמחרים את הגודש כדי להזיז ביקוש, ולא כדי לכסות את עלות הסלילה"
]},

{h2:"מרכיבי התנועה — ⟨4⟩"},
{items:[
"אמצעי :: כלי הרכב — טיפולים, איכות, מהימנות",
"מדיניות וחוקים :: למשל מהירות הנסיעה המותרת",
"תשתיות :: כביש, צינור, נתיב — משפיעות על מהירות ודלק",
"משתמשים :: נהג ונוסע — מהימנות והכשרות",
"⟦הקשר ביניהם⟧ המסקנה :: כולם משפיעים זה על זה ← __אי אפשר לבחון תנועה כגורם מבודד__"
]},

{h2:"אינטר-מודליות"},
{items:[
"הגדרה :: שילוב כמה אמצעי הובלה לאורך אותו מסלול",
"השלבים :: **COMPOSITION** (איסוף / First mile) ← **INTERCHANGE** (מעבר / TRANSFER) ← **DECOMPOSITION** (חלוקה / Last mile)",
"__הדגש__ :: המטרה **הפצה יעילה יותר** — __לא בהכרח זולה או מהירה__",
"Last Mile :: הבאת המשלוח מנקודת ההפצה האחרונה עד הלקוח — החלק היקר והמורכב"
]},

{h2:"סיווג דרכים"},
{tbl:{head:["סוג","זרימה","נגישות","קיבולת"],rows:[
["מהירה","**גבוהה**","נמוכה","⟨2,000⟩"],

{h2:"רמת מינוע"},
{items:[
"⟦כמה כלי רכב לאלף תושבים⟧ הגדרה :: מספר **כלי הרכב המנועיים לכל ⟨1,000⟩ תושבים**. __מנורמל לאוכלוסייה__ — ולכן משווה בין מדינות בגדלים שונים, מה שמספר מוחלט של כלי רכב לא היה מאפשר",
"ישראל :: מ-⟨6.1⟩ כלי רכב (⟨1951⟩) ל-⟨276⟩ (⟨2011⟩) — עלייה ממוצעת של **⟨7%⟩ בשנה**",
"השוואה ⟨2009⟩ :: איטליה ⟨521⟩ · גרמניה ⟨510⟩ · ספרד ⟨478⟩ · בריטניה ⟨460⟩ · יוון ⟨457⟩ · יפן ⟨455⟩ · ארה״ב ⟨439⟩ · צרפת ⟨420⟩ · **ישראל ~⟨265⟩** · טורקיה ~⟨95⟩",
"__ישראל נמוכה__ :: מכל המדינות המערביות ברשימה. **טורקיה היחידה הנמוכה מישראל**",
"⟦למה המדד חשוב · השלכות רמת מינוע⟧ המשמעות :: עלייה ברמת המינוע ← **עומסים · תאונות · זיהום אוויר · צריכת משאבים**. לכן זהו מדד __סביבתי-חברתי__ לתכנון תשתיות ומדיניות, ולא מדד כלכלי גרידא",
"⚠ ⟦גל עלייה · מיליון עולים⟧ המלכודת :: בשנות ה-⟨80⟩–⟨90⟩ הגיעו כ**מיליון עולים בלי רכבים**. המונה לא השתנה, **המכנה גדל** ← רמת המינוע **ירדה**. אחרי כשנתיים הם נקלטו, קנו רכבים, והמדד עלה בחזרה. __המדד יורד גם בלי שאיש מכר רכב__"
]},

{h2:"מודל זרימת התנועה"},
{items:[
"⟨1⟩ **q = S × D** :: זרימה = מהירות × צפיפות — __נוסחת היסוד__",
"⟨2⟩ S = S_f(1 − D/D_j) :: הקשר מהירות–צפיפות **ליניארי יורד**",
"⟨3⟩ q = S_f(D − D²/D_j) :: זרימה כפונקציה של צפיפות — **פרבולה**",
"⟨4⟩ q = D_j(S − S²/S_f) :: זרימה כפונקציה של מהירות",
"המשתנים :: **S** מהירות (קמ״ש) · **D** צפיפות (רכב/ק״מ) · **q** זרימה/נפח (רכב/שעה) · **C** קיבולת · **t** זמן נסיעה",
"**S_f** :: מהירות בזרימה חופשית — כשהצפיפות ⟨0⟩",
"**D_j** :: צפיפות פקק — כשהמהירות ⟨0⟩",
"⟦מתי הזרימה מקסימלית⟧ q_max :: מתקבל ב-**D = D_j/2** וב-**S = S_f/2** — ב__חצי__ מצפיפות הפקק",
"__המלכודת__ :: לכל ערך זרימה **למעט השיא** יש **שתי** צפיפויות ו**שתי** מהירויות — אחת בזרימה חופשית ואחת בגודש",
"מהירות מול זמן נסיעה :: __לא אותו משתנה__ — זמן הנסיעה כולל גם עצירות והמתנות, ולכן מודלים מפרידים ביניהם"
]},
{warn:"דוגמה: ⟨40⟩ קמ״ש × ⟨50⟩ רכב/ק״מ = **⟨2,000⟩ רכב/שעה**."},

/* ══════════════════════════ 4 · יחידה 2 */
{name:"2 · מידע מרחבי", color:"#0f8b8b", sub:"שיעורים 3–5 · 45 שקפים", cols:2, blocks:[

{h2:"גרפים — קניגסברג ואוילר"},
{items:[
"הבעיה :: העיר קניגסברג חולקה ל-⟨4⟩ חלקים ע״י הנהר, עם **⟨7⟩ גשרים**. חיפשו מסלול מעגלי שעובר בכל גשר **פעם אחת**",
"⟦אויילר · Euler⟧ אויילר ⟨1736⟩ :: תרגם את המפה לגרף — כל יבשת = **קודקוד**, כל גשר = **קשת**. **דרגה** = מספר הקשתות בקודקוד",
"⟦מסלול אוילר מול מעגל אוילר⟧ מסלול מול מעגל :: **מסלול אוילר** — עובר בכל קשת בדיוק פעם אחת ו**פתוח**: מתחיל ומסיים בקודקודים **שונים** · **מעגל אוילר** — עובר בכל קשת בדיוק פעם אחת ו**חוזר לנקודת ההתחלה**",
"__התנאי__ :: **מעגל** אוילר קיים בגרף קשיר רק אם **כל** הקודקודים בדרגה זוגית (⟨0⟩ אי-זוגיים) · **מסלול** אוילר פתוח קיים אם יש **בדיוק ⟨2⟩** אי-זוגיים — מתחילים באחד ומסיימים בשני",
"בקניגסברג :: ⟨4⟩ קודקודים — האי בדרגה **⟨5⟩** ושלוש הגדות בדרגה **⟨3⟩** כל אחת (⟨3⟩,⟨3⟩,⟨3⟩,⟨5⟩) ← **⟨4⟩ קודקודים אי-זוגיים**, ולכן **אי אפשר** — לא מעגלי ואף לא פתוח",
"__בדיקה שתופסת טעות__ :: סכום הדרגות **תמיד זוגי** ושווה ל-⟨2⟩ × מספר הקשתות. כאן ⟨3⟩+⟨3⟩+⟨3⟩+⟨5⟩ = ⟨14⟩ = ⟨2⟩ × ⟨7⟩ גשרים ✔. אם יצא לכם סכום אי-זוגי — פספסתם קודקוד",
"ציור הבית :: ⟨2⟩ פינות תחתונות בדרגה ⟨3⟩, השאר זוגיות ← **אפשר**, אך חייבים להתחיל באחת התחתונות ולסיים בשנייה"
]},

"⚠ __אין «סוג משולב»__ :: המצגת מציגה **שלושה** סוגים בלבד ואין בה שקף על שילוב ביניהם. אפשרות שמציעה «שילוב של קרבה ורשת» היא __מסיח__",
"__תשאול מול ניתוח__ :: **תשאול** מוצא ישויות קיימות לפי קריטריון («מחוזות מעל ⟨300⟩ אלף תושבים»). **ניתוח** __יוצר מידע חדש__ שלא היה באף שכבה"

{h2:"איכון — GPS, AGPS, AVL"},
{items:[
"מערכות :: **GNSS** (גלובלית) · **SBAS** ו-**DGPS** (מערכות הרחבה מקומיות)",
"איך GPS עובד :: המקלט קולט אות, מחשב את **זמן ההגעה** ומתרגם ל**מרחק** (מהירות האור)",
"**AGPS** :: הבעיה — טעינת הנתונים מהלוויין **איטית**. הפתרון: המכשיר מוריד את נתוני הלוויינים מ**שרת אינטרנט**, ומזרז את הנעילה הראשונה — **TTFF** (Time To First Fix). מתאים למכשירים סלולריים, בעיקר ב**אזורים עירוניים**",
"**AVL** :: **GPS + GIS**. קופסה ברכב שמעבירה מיקום למוקד",
"⟦תכונות AVL⟧ **תכונות** AVL — *מה המערכת יודעת לעשות* :: הצגה על מפה · עדכון אוטומטי · איתור ה**כלי הקרוב** לנקודה · **שילוח דינמי** · **geofencing** (התראות כניסה/יציאה) · תקשורת עם הכלים",
"⟦שימושים של AVL⟧ **שימושים** של AVL — *למה משתמשים בזה* :: מעקב אחרי מיקום · כלי רכב ואמצעי שילוח · מעקב אחרי **ציוד בתנועה** · מעקב וניטור **מלאי** (בשילוב **RFID**) · **אימות משימות** · ניווט",
"⚠ __שתי רשימות נפרדות__ :: במצגת אלה **שני שקפים** — שימושים (⟨51⟩) ותכונות (⟨52⟩), שש בכל אחת. קל לבנות מהן מסיח. הזיהוי: **שימוש** = מטרה עסקית · **תכונה** = יכולת של המערכת. __מעקב מלאי עם RFID הוא שימוש, לא תכונה__"
]},

{h2:"GPS — מבנה, ולמה ⟨4⟩ לוויינים"},
{items:[

"מי מפעיל :: הוקמה ע״י **משרד ההגנה** האמריקאי, מתופעלת ע״י **חיל האוויר**",
"Almanac :: מיקום כל לוויין ידוע במדויק בכל רגע · **שעון אטומי** בכל לוויין",
"⟦למה צריך ארבעה לוויינים⟧ למה ⟨4⟩ :: יש ⟨4⟩ **נעלמים** — x, y, z ו**הזמן** (t) ← דרושות ⟨4⟩ משוואות ← **⟨4⟩ לוויינים**. במרחב החיתוך הוא של **ספירות**, לא של מעגלים",
"__למה הזמן בכלל נעלם__ :: ל**לוויין** יש שעון אטומי — ל**מקלט שלכם אין**. לכן יש **סטייה בשעון המקלט**, והיא הנעלם הרביעי. זו הסיבה שגם מדידה מושלמת של ⟨3⟩ מרחקים לא מספיקה",
"⚠ __שני ניסוחים לאותה תשובה__ :: **המצגת** — ⟨4⟩ נעלמים (x,y,z,t). **סיכום ההרצאה** — ⟨3⟩ לוויינים למיקום ו**רביעי לגובה**. שתי הגרסאות מגיעות ל-**⟨4⟩**; ההבדל רק בהסבר",
"מערכות נוספות :: **Galileo** (אירופה) · **Glonass** (רוסיה) · **Beidou** (סין). **GNSS** = השם הכללי לכולן"
]},

"אילוצים :: היוצא מכל ספק **≤** מה שיש לו · המגיע לכל לקוח **=** הדרישה · אי-שליליות · לעיתים **INT** (פריטים בודדים ולא נוזלים)",

{h2:"בעיית השיטעון"},
{items:[
"מה מתווסף :: **נקודות ביניים** (מרלו״ג, נמל) שדרכן הסחורה עוברת בדרך ליעד",
"__ההבדל המהותי מתובלה__ :: בתובלה הזרימה **ישירה** ממקור ליעד; בשיטעון יש **קודקודי ביניים** שבהם **סך הנכנס = סך היוצא** (שימור זרימה)",
"פתרון :: תיאור כ**בעיית תכנות לינארי** ופתרון ב**סולבר**",
"בקודקוד המעבר :: המאזן **⟨0⟩**, ומניחים שם **קיבולת גדולה מאוד** — מעין **חוצץ** — כדי שהסחורה תוכל לזרום דרכו",
"⚠ ⟦ההסחות בשאלת תובלה מול שיטעון⟧ שתי הסחות לפסול :: «אחת נפתרת ב**סולבר** והשנייה ב**היוריסטיקה**» — __לא נכון__ · «ההבדל הוא ההנחה על **שטח אחסון אינסופי**» — הנחה טכנית אמיתית, אבל __לא ההבדל המהותי__. ההבדל הוא **קודקודי המעבר ושימור הזרימה**"

{h2:"תכנות לינארי וסולבר"},
{items:[
"⟨3⟩ המרכיבים :: **פונקציית מטרה** (סכום כמות×עלות ← מינימום) · **משתני החלטה** X_ij · **אילוצים**",
"למה צריך אילוצים :: בלי אילוצים אפשר להציב ⟨0⟩ בהכל ולקבל עלות ⟨0⟩ — אבל אז לא עובר כלום",
"שלבי הסולבר :: הפעלת התוספת ← לשונית **DATA** ← סימון תא פונקציית המטרה ← סימון תאי משתני ההחלטה ← **מינימום** ← הוספת אילוצים (אפשר טווח שלם) ← **INT** ו-≥⟨0⟩ ← Solve",
"SUMPRODUCT :: מכפילה איבר-איבר בין שני טווחים וסוכמת",
"__מגבלה__ :: בסולבר אפשר להגדיר **רק פונקציית מטרה אחת**"
]},
{warn:"המרצה אמר במפורש: «**לא תהיה לכם שאלה כזאת במבחן**» — אין שאלות אקסל/סולבר."},

{h2:"זרימה מקסימלית — פורד-פולקרסון"},
{items:[
"⟦זרימה מקסימלית · Max Flow · Ford-Fulkerson⟧ הבעיה :: כמה ניתן להעביר מ-s ל-t **בשימוש בכל הרשת בו-זמנית** (לא מסלול אחד)",
"חסם ראשוני :: המינימום בין סך הקיבולות היוצאות מהמקור לסך הנכנסות ליעד",
"רשת שיורית :: לכל קשת בונים **קשת בכיוון ההפוך** בערך התחלתי ⟨0⟩",
"**מסלול אוגמנטי** :: מסלול מהמקור ליעד שבו הזרימה השיורית בכל הקשתות **> ⟨0⟩**",
"⟨1⟩ :: מצא מסלול אוגמנטי כלשהו. אם אין — סיים",
"⟨2⟩ :: **f** = הזרימה **המינימלית** במסלול (צוואר הבקבוק)",
"⟨3⟩ :: **הפחת f** מהקשתות הישרות · **הוסף f** לקשתות ההפוכות",
"⟨4⟩ :: חזור לשלב ⟨1⟩. **הזרימה המקסימלית = סכום כל ערכי f**",
"__למה קשתות חוזרות__ :: הן מאפשרות **לבטל** זרימה שהוקצתה בטעות ולנתב מחדש. בלעדיהן האלגוריתם נתקע בפתרון לא אופטימלי",
"⚠ ⟦בניית הרשת לפני האלגוריתם⟧ לפני שמתחילים :: __פורד-פולקרסון לא רץ על הרשת המקורית__. **בונים תחילה רשת שיורית**: כל קשת נשארת בקיבולתה, ולצידה קשת הפוכה בערך ⟨0⟩",
"הדוגמה מהמצגת :: רשת קטנה שכל **הקיבולות בה ⟨1⟩**. מסלול דרך האמצע **חוסם את הרשת** ונראה שסיימנו — והקשת החוזרת היא שמאפשרת לתקן ולהגיע לזרימה המקסימלית האמיתית",
"__ניסוח מדויק__ :: הקשתות ההפוכות __לא מוסיפות זרימה__ — הן **מוסיפות אפשרויות**",
"מספר מקורות/יעדים :: מוסיפים **מקור-על ויעד-על** בקיבולת **∞** ← מצמצמים למקור/יעד יחיד"
]},

{h3:"⟦למה צריך קשתות חוזרות · הדוגמה⟧ ⚠ הדוגמה שמסבירה את הקשתות החוזרות"},

"__המשפט למבחן__ :: הקשת החוזרת אינה מוסיפה קיבולת פיזית — היא **מאפשרת לחזור בנו מהקצאה קודמת ולנתב מחדש**. בלעדיה תוצאת האלגוריתם תלויה בסדר שבו נבחרו המסלולים, והוא עלול לעצור בפתרון לא אופטימלי"
]},

{items:[
"⟦למה זה לא משנה את התשובה⟧ למה מותר :: הקשתות החדשות **אינן מגבילות דבר**, כי קיבולתן אינסופית. צוואר הבקבוק נשאר **הקשתות האמיתיות** של הרשת, ולכן ערך הזרימה המקסימלית __לא משתנה__",
"למה עושים זאת :: פורד-פולקרסון מוגדר ל**מקור אחד ויעד אחד**. ההמרה מצמצמת את הבעיה לצורה שהאלגוריתם יודע לפתור — **בלי לשנות את הבעיה עצמה**",

]},

{items:[

"__משפט Max-Flow / Min-Cut__ :: החתך המינימלי הוא הבעיה ה**דואלית** — **ערך הזרימה המקסימלית = ערך החתך המינימלי**",
"איך מוצאים :: פותרים תחילה את ה**זרימה המקסימלית**",
"אילו קשתות :: ה**רוויות** — שבהן **הזרימה שווה לקיבולת**. __לא__ «הזרימה המינימלית»!",
"__האינטואיציה__ :: הרשת **חזקה בדיוק כמו צוואר הבקבוק שלה** — אי אפשר להעביר יותר ממה שהחלק הצר מרשה"
]},

"בעיית שיבוץ :: מקרה פרטי של תובלה שבו **כל היצע = ⟨1⟩ וכל ביקוש = ⟨1⟩** (התאמה 1:1), משתנים בינאריים"
]}
]},

{h2:"הבעיה ביחידה"},
{items:[
"בשורה אחת :: למצוא **מיקום אופטימלי למתקן** — מרלו״ג, מפעל, תחנת כיבוי אש, מוקד שילוח — כשלכל אחד המטרות והאילוצים שלו",
"⟦דוגמת סן פרנסיסקו · מפת חום⟧ הדוגמה מהשיעור :: מריצים ניתוח GIS ומקבלים **מפת חום של זמני הגעה** לבתי החולים הקיימים (⟨5⟩ · ⟨10⟩ · ⟨20⟩ דקות), ומחפשים את **האזורים הצהובים**",
"__הרעיון של כל היחידה__ :: ממקמים את המתקן החדש דווקא היכן ש**רמת השירות נמוכה וזמני ההגעה ארוכים** — כדי **להרחיב כיסוי**, __לא__ כדי להתחרות במתקנים הקיימים"
]},

{h2:"סוגי מתקנים"},
{items:[
"מרכז הפצה :: אחסון והפצה **+ פעולות משלימות** (איחוד, אריזה, «ייצור»)",
"מחסן :: ל**אחסון בלבד**",
"**Cross-docking** (שטעון) :: מעבר סחורה **ללא אחסון** — מעמדת פריקה ישירות לעמדת טעינה",
"נמלים :: נמל · אזור סחר חופשי · נמל עורפי",
"מסופים :: Intermodal · צובר · **רכזת** · עירוני",
"מרכז לוגיסטי משולב :: פארק תעשייתי / «עיר» לוגיסטית",
"⟦גדול מול קטן⟧ החלוקה :: **מרלו״גים גדולים** מחוץ לעיר באזורי תעשייה · **מרכזים מקומיים** קטנים לשירות אזורי"
]},
{warn:"⟦מחסן מול מרכז הפצה מול קרוס-דוקינג⟧ **מה מבדיל בין השלושה: כמה זמן הסחורה נשארת.**\n**מחסן** — נשארת · **מרכז הפצה** — נשארת __ומטופלת__ · **Cross-docking** — __לא נשארת בכלל__.\nבתרחיש: אם הסחורה נפרקת ונטענת באותו יום בלי אחסון — זה שטעון, גם אם קוראים למקום «מרכז הפצה»."},

{h2:"⚠ שאלת המרצה — JIT ומיקום"},
{items:[
"⟦איך JIT משפיע על מיקום המחסנים⟧ השאלה :: איך המעבר ל-**JIT** משפיע על מיקום המחסנים ביחס ללקוחות?",
"התשובה :: מחייב מיקום **קרוב גיאוגרפית ללקוחות**",
"__ההיגיון — וזה מה שבודקים__ :: ב-JIT **אין מלאי חוצץ**. מלאי הוא **כרית ביטחון שסופגת עיכובים**; בלעדיו כל עיכוב באספקה **עוצר את הקו**. לכן נדרשת אספקה **מהירה, תכופה ואמינה** — ומרחק גדול הורס את היכולת לספק בדיוק בזמן"
]},

{h2:"סיווג מודלים"},
{items:[
"בדיד מול רציף :: **בדיד** — רק ממקומות מוגדרים מראש · **רציף** — כל נקודה במרחב",
"⟦מוכר הגלידה⟧ איך זוכרים :: מוכר גלידה שיכול לעמוד ב**כל נקודה בחוף** = **רציף** · רק ב**עמדות מוגדרות** = **בדיד**",
"⟦הדוגמה של 100 קמ · A B C⟧ הדוגמה מהמצגת :: למקם מרכז במרחק **שלא יעלה על ⟨100⟩ ק״מ מכל לקוח**, ברשת **A —⟨120⟩— B —⟨80⟩— C**",
"למה **אין פתרון בדיד** :: ב-A ← המרחק ל-C הוא ⟨200⟩ ✗ · ב-B ← המרחק ל-A הוא ⟨120⟩ ✗ · ב-C ← המרחק ל-A הוא ⟨200⟩ ✗. שלוש האפשרויות נופלות",
"למה **ברציף כן** :: ממקמים **⟨100⟩ ק״מ מ-A** (⟨20⟩ ק״מ לפני B) ← ל-A ⟨100⟩ ✔ · ל-B ⟨20⟩ ✔ · ל-C ⟨20⟩+⟨80⟩=⟨100⟩ ✔. __הרציף מנצח כי מותר לעצור באמצע קשת__",
"→ ובכיוון ההפוך :: **החציון המשוקלל** נותן נקודה **רציפה** במישור — ולכן אחריו בודקים אם בכלל אפשר לבנות שם. **המודל נותן נקודה, לא אישור בנייה**",
"סטטי מול דינמי :: סטטי — הכל קבוע וידוע · דינמי — משתנה",
"דטרמיניסטי מול סטוכסטי :: **סטוכסטי** = יש אקראיות; יודעים רק **הסתברות וסטיית תקן**",
"⟦שלוש שיטות מרחק⟧ מדידת מרחק :: **מפורש** (ברשת בפועל ב-GIS — מדויק) · **אוקלידי** (קו אווירי — הערכת **חסר**) · **Rectilinear** (לאורך צירים — הערכה **מחמירה**)",
"איך מפצים על ההטיה :: מגדירים **⟨40⟩ ק״מ אווירי** כדי לקבל בערך **⟨50⟩ בפועל** — מכיוון שהקו האווירי תמיד קצר מהמציאות"
]},

{h2:"מודלי מיקום"},
{tbl:{head:["מודל","המטרה"],rows:[
["**P-Median**","מזעור **סכום** המרחקים המשוקלל בביקוש"],
["**Min-Max**","מזעור ה**זמן** (או המרחק) אל הלקוח ה**מרוחק ביותר** — הוגנות ושירות חירום"],
["**כיסוי מקסימלי**","מקסום ה**ביקוש המכוסה** בטווח נתון D_c"],
["רשת היררכית","מרכזי-על וחישורים — קווי תעופה, שילוח"]
]}},
{warn:"**המודל שבוחרים משנה את התוצאה!** חלופה א׳: ⟨5⟩+⟨10⟩+⟨20⟩=⟨35⟩ · חלופה ב׳: ⟨15⟩+⟨10⟩+⟨15⟩=⟨40⟩.\nלפי **P-Median** עדיפה א׳ · לפי **Min-Max** עדיפה ב׳ (מקסימום ⟨15⟩ מול ⟨20⟩)."},

{h3:"כיסוי מקסימלי — הרחבה"},
{items:[
"⟦מה ממקסמים בכיסוי מקסימלי⟧ המטרה :: למקסם את **סך הביקוש המכוסה** — סכום של (ביקוש × האם הוא מכוסה). לא מספר הלקוחות, אלא **הביקוש המשוקלל**",
"__העיקרון__ :: **עדיפות לביקוש גבוה**. לקוח עם ביקוש גדול שווה יותר מלקוח קטן, ולכן משתלם לכסות ריכוזים",
"**D_c** :: **טווח הכיסוי** — הרדיוס שבתוכו לקוח נחשב «מכוסה». __נתון__, לא נבחר",
"**P** :: **מספר המתקנים** שמותר למקם. __נתון ומוגבל__ — זה מה שהופך את הבעיה לבחירה",
"מה מחליטים :: **היכן למקם את ה-P מתקנים**, כך שסך הביקוש שנופל בתוך D_c יהיה מקסימלי",
"⟦דוגמה לכיסוי מקסימלי⟧ הדוגמה :: היכן לשים ⟨5⟩ סניפים כך שכמה שיותר לקוחות יהיו ב**טווח הליכה של ⟨500⟩ מ׳** — כאן ⟨5⟩ = P ו-⟨500⟩ מ׳ = D_c",
"__מה שמסגיר את השאלה__ :: מופיעים **גם טווח וגם מספר מתקנים מוגבל**. אם יש טווח אבל אין הגבלת מספר — זו לא הבעיה הזו",
"__ההבדל משני האחרים__ :: **P-Median** ממזער **סכום** מרחקים · **Min-Max** ממזער את **הגרוע ביותר** · **כיסוי מקסימלי** __לא ממזער מרחק בכלל__ — הוא סופר כמה ביקוש נכנס לטווח, ולקוח מחוץ לטווח פשוט לא נספר"
]},
{warn:"⬜ **הניסוח המתמטי** (‏max Σh·z בכפוף לאילוצי כיסוי ול-Σx=P) **נחתך מהמיקוד** — אבל **D_c ו-P נשארו**, וכך גם ההבחנה בין שלושת המודלים."},

{h2:"חציון משוקלל — מתקן יחיד"},
{items:[
"מתי :: לקוחות במיקומים ידועים, לכל אחד **משקל**; רוצים למזער עלות שינוע. מרחק **Rectilinear**",
"⟨1⟩ :: מיין את הנקודות לפי ציר X בנפרד ולפי Y בנפרד",
"⟨2⟩ :: חשב משקל מצטבר ומצא את ה**חציון** = סך המשקל ÷ ⟨2⟩",
"⟨3⟩ :: המיקום = הנקודה שבה המשקל המצטבר **עובר לראשונה** את החציון. חזור לציר השני",
"__קריטי__ :: זה **חציון משוקלל** — __לא ממוצע__ ולא מרכז גיאומטרי!",
"⚠ ⟦לא איפה הקבוצה הגדולה⟧ גם __לא__ «איפה הכי הרבה לקוחות» :: החציון הוא הנקודה שבה **חצי מהמשקל מכל צד** — לא מיקום הקבוצה הגדולה ביותר. בדוגמת הספרייה זה במקרה מתלכד בציר X (מדעי הרוח, ⟨530⟩, ב-⟨6⟩), אבל **בציר Y זה נשבר**: הקבוצה הגדולה ב-y=⟨3⟩, והתשובה **y=⟨12⟩** — כי ב-⟨3⟩ המצטבר הגיע רק ל-⟨720⟩ מתוך ⟨1,020⟩",
"__ולמה בכלל חציון__ :: לחציון לא אכפת **כמה רחוק**, רק **כמה משקל** מכל צד. הזיזו את משפטים מ-X=⟨14⟩ ל-X=⟨100⟩ — **X נשאר ⟨6⟩**. בממוצע משוקלל הנקודה הייתה קופצת"
]},

{items:[
"ציר X :: 0(⟨190⟩) ← 5(⟨500⟩) ← **6(⟨1030⟩)** ✔ עובר את ⟨1020⟩ ← **X = ⟨6⟩**",
"ציר Y :: 0(⟨190⟩) ← 3(⟨720⟩) ← **12(⟨1130⟩)** ✔ ← **Y = ⟨12⟩**",

{h2:"חזית פארטו"},
{items:[
"⟦חזית פארטו · Pareto Front · Multi-Objective⟧ מתי :: **מספר פונקציות מטרה** מנוגדות בו-זמנית. פותרים את כולן יחד — לא אחת אחרי השנייה",
"הגרף שבמצגת :: ציר X = **מרחק ממוצע** · ציר Y = **אחוז ביקוש לא מכוסה**. שתיהן למזעור, ולכן __אי אפשר לשפר את שתיהן יחד__",
"מה מקבלים :: __אין פתרון יחיד__ — מקבלים **סט פתרונות לא-נשלטים** (חזית פארטו), שבהם אי אפשר לשפר מטרה בלי לפגוע באחרת",
"⚠ ⟦מתי פתרון נשלט⟧ פתרון **נשלט** :: קיים פתרון אחר שהוא **טוב ממנו בכל המטרות** __או טוב באחת ושווה בשאר__. הוא נחות ← **אינו על החזית**",
"__שימו לב לניסוח__ :: __לא__ צריך שיהיה טוב יותר ב**שתי** המטרות. במצגת הנקודה ההיפותטית **G** נשלטת ע״י **E**, שנמצאת באותו מרחק ממוצע בערך אך עם **אחוז לא-מכוסה נמוך בהרבה** — עדיפה באחת, לא גרועה בשנייה",
"מי בוחר :: **כל הפתרונות שעל החזית טובים באותה מידה**. המודל לא מכריע — **הארגון בוחר לפי ההעדפות שלו**"
]},

{h2:"מסלול קצר ו-K-Shortest"},
{items:[
"ייצוג :: גרף **G=(V,E,w)** — קודקודים=צמתים, קשתות=כבישים, **משקל** = מרחק/זמן/עלות/קיבולת",
"__שים לב__ :: «מסלול קצר ביותר» __לא תמיד__ באמת הקצר — תלוי במה שהמספרים מייצגים",
"מסלול קצר :: נקודת מוצא, נקודת יעד, והזול ביותר בזמן/מרחק/עלות — **Waze וגוגל מפות**. ייתכנו גם **שני מסלולים באותו אורך בדיוק**",
"**K-Shortest Paths** :: K המסלולים הקצרים ביותר — **חלופות גיבוי מוכנות מראש** לתאונה או חסימה. היערכות לחירום ותכנון נתיבי פינוי: אם הקצר חסום, עוברים מיד לבא בתור",
"⚠ __ההסחות בשאלת ה-K__ :: הערך הוא **גיבוי וזמינות** — __לא__ «צמצום המייל האחרון» ו__לא__ «הפיכת הבעיה לתכנון לינארי»",
"⟨1⟩ :: מצא את המסלול הקצר ביותר, N=⟨1⟩",
"⟨2⟩ :: צרף לרשימת המועמדים את כל ה**הטיות** של מסלול N",
"⟨3⟩ :: מיין את הרשימה לפי אורכים, N=N+⟨1⟩",
"⟨4⟩ :: המסלול הקצר ביותר ברשימה הוא ה-N הקצר ביותר",
"⟨5⟩ :: אם N=K סיים; אחרת חזור ל-⟨2⟩"
]},

{h2:"אלגוריתם דייקסטרה"},
{items:[
"⟦דייקסטרה · Dijkstra⟧ רקע :: **אדסחר דייקסטרה**, הולנדי, **⟨1959⟩**. אלגוריתם **חמדני**",
"__מה הוא מוצא__ :: **בבת אחת** את המסלולים הקצרים מקודקוד מוצא **אחד לכל שאר הקודקודים** (Single-Source). __אין הגדרת יעד__ — בגרף עם ⟨6⟩ קודקודים מקבלים ⟨5⟩ מסלולים",
"אתחול :: לקודקוד המוצא **⟨0⟩**, לכל השאר **∞** — פירושו «**טרם נמצא מסלול**»: כל מרחק ממשי שיתגלה בהמשך קטן מ-∞, ולכן **כל עדכון הוא בהכרח שיפור**",
"איטרציה :: בחר מבין שלא ביקרנו את זה שהמרחק אליו **הקצר ביותר** ← בחן את שכניו ← אם המרחק החדש **קטן יותר**, עדכן (Relaxation)",
"הסימון :: **מרחק/קודקוד-אב** — «7/v6» = מרחק ⟨7⟩, הגענו מ-v6. **שחזור המסלול** = הליכה אחורה לפי האבות",
"__המגבלה__ :: __אינו מתמודד עם משקלים שליליים__. הסיבה: ברגע שקודקוד ננעל כ**קבוע** מניחים שהמרחק אליו מינימלי — וקשת שלילית מאוחרת כבר לא תעדכן אותו",
"⚠ הניסוח שרוצים לראות :: **נועל קודקוד כקבוע ולא מעדכן אותו אחר כך**. __לא__ «לולאה אינסופית» ו__לא__ «פיצול הגרף»",
"אבל בפועל :: נדיר להיתקל במשקל שלילי — **זמן, מהירות ומרחק אינם שליליים** — ולכן האלגוריתם **רלוונטי למרות המגבלה**. נאמר במפורש"
]},

{h2:"אלגוריתם חמדני"},
{items:[
"מהו :: **משפחה** של אלגוריתמים. בכל צעד עושים את הפעולה שנותנת **מירב תועלת באותו רגע**, בלי להסתכל על ההשפעה העתידית",
"התוצאה :: לעיתים **אופטימלי** (דייקסטרה ללא שליליים) · לעיתים רק **מקורב** (TSP)",
"היתרון :: **מהיר** — לא צריך לסרוק את כל הפתרונות"
]},

{h2:"בעיית הסוכן הנוסע (TSP)"},
{items:[

/* ---- עזרי בנייה ---- */
function E(t,a,h){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);
  if(h!=null)e.innerHTML=h;return e;}

/* טקסט עשיר: **מודגש** ⟨מספר⟩ «ציטוט» __הדגשה__ */
function rt(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<em>$1</em>')
    .replace(/«(.+?)»/g,'<span class="q">"$1"</span>')
    .replace(/⟨(.+?)⟩/g,'<span class="n">$1</span>');
}

/* ---- הופך בלוק לאלמנט ---- */
function block(b){
  if(b.h2) return E('h2',{},rt(b.h2));
  if(b.h3) return E('h3',{},rt(b.h3));
  if(b.warn) return E('div',{'class':'warn'},rt(b.warn));
  /* תרשים: ה-SVG יורש currentColor ולכן נדפס בשחור נקי */
  if(b.svg) return E('figure',{'class':'fig'},
    b.svg + (b.cap?'<figcaption>'+rt(b.cap)+'</figcaption>':''));
  if(b.tbl){
    var t=E('table'),th=E('tr');
    (b.tbl.head||[]).forEach(function(c){th.appendChild(E('th',{},rt(c)));});
    if(b.tbl.head)t.appendChild(th);
    b.tbl.rows.forEach(function(r){
      var tr=E('tr');
      r.forEach(function(c,i){tr.appendChild(E('td',{'class':i===0?'k':''},rt(c)));});
      t.appendChild(tr);
    });
    return t;
  }
  var dl=E('dl');
  b.items.forEach(function(it){
    var d=E('div'), p=String(it).split(' :: ');
    /* ⟦כינוי · כינוי⟧ בכותרת — לא מוצג, אך נכנס למפתח הא״ב. נועד לכותרות
       שנוסחו כשאלה ("מה נכלל") ואי אפשר לחפש אותן לפי מונח. */
    var head=p[0], alias='', ma=head.match(/⟦([^⟧]*)⟧/);
    if(ma){ alias=ma[1]; head=head.replace(/\s*⟦[^⟧]*⟧/,''); }
    var dt=E('dt',{},rt(head));
    if(alias) dt.setAttribute('data-idx',alias);
    d.appendChild(dt);
    d.appendChild(E('dd',{},rt(p.slice(1).join(' :: '))));
    dl.appendChild(d);
  });
  return dl;
}

/* ---- דפדוף: ממלא עמוד עד שהוא מתמלא, ואז פותח חדש ---- */
var out=document.getElementById('out'), pages=[];
function newPage(sec,cont){
  var p=E('div',{'class':'pg','style':'--c:'+sec.color});
  p.appendChild(E('div',{'class':'hd'},
    '<b>'+sec.name+'</b><span>'+(cont?'המשך':(sec.sub||''))+'</span>'));
  var tabTop = 14 + sec.idx*(70/Math.max(1,DATA.sections.length-1));
  p.appendChild(E('div',{'class':'tab',
    'style':'top:'+tabTop+'mm;height:34mm'},sec.name));
  var bd=E('div',{'class':'body'+(sec.cols===2?' c2':'')});
  p.appendChild(bd); p.appendChild(E('div',{'class':'pgn'}));
  out.appendChild(p); pages.push(p);
  return bd;
}
function fits(pg){return pg.scrollHeight<=pg.clientHeight+1;}

DATA.sections.forEach(function(sec,si){
  sec.idx=si;
  var bd=newPage(sec,false), pg=bd.parentNode;
  sec.blocks.forEach(function(b){
    var el=block(b);
    bd.appendChild(el);
    if(!fits(pg)){
      bd.removeChild(el);
      /* כותרת בסוף עמוד — מעבירים אותה יחד עם מה שבא אחריה */
      var trail=[];
      while(bd.lastChild && /^H[23]$/.test(bd.lastChild.tagName)){
        trail.unshift(bd.lastChild); bd.removeChild(bd.lastChild);
      }
      /* אם הוצאת הכותרות רוקנה את העמוד — אין טעם לפתוח חדש ולהשאיר דף
         ריק. זה קרה בעמוד הראשון של המילון: h2 ואחריו טבלה שאינה נכנסת,
         ושניהם עברו הלאה. ממשיכים על אותו עמוד, והטבלה תיחתך בהמשך. */
      if(bd.childNodes.length){ bd=newPage(sec,true); pg=bd.parentNode; }
      trail.forEach(function(t){bd.appendChild(t);});
      bd.appendChild(el);
      /* בלוק גדול מעמוד שלם — טבלה ארוכה או רשימה ארוכה — נחתך לשורות */
      while(!fits(pg) && el.rows && el.rows.length>1){
        var cut=E(el.tagName), moved=false;
        while(!fits(pg) && el.rows.length>1){
          cut.insertBefore(el.rows[el.rows.length-1], cut.firstChild);
          moved=true;
        }
        if(!moved) break;
        bd=newPage(sec,true); pg=bd.parentNode;
        bd.appendChild(cut); el=cut;
      }
      while(!fits(pg) && el.children && el.children.length>1 && !el.rows){
        var cut2=E(el.tagName,{'class':el.getAttribute('class')||''}), moved2=false;
        while(!fits(pg) && el.children.length>1){
          cut2.insertBefore(el.lastElementChild, cut2.firstChild);
          moved2=true;
        }
        if(!moved2) break;
        bd=newPage(sec,true); pg=bd.parentNode;
        bd.appendChild(cut2); el=cut2;
      }
    }
  });
});

/* ---- מספור, שער ומפתח ---- */
var first={};
pages.forEach(function(p,i){
  p.querySelector('.pgn').innerHTML='עמ׳ <b>'+(i+2)+'</b>';
  var nm=p.querySelector('.hd b').textContent;
  if(first[nm]===undefined)first[nm]=i+2;
});

var cover=E('div',{'class':'pg'});
cover.innerHTML='<div class="cover"><h1>ניהול מערכות תובלה ושינוע</h1>'+
  '<div class="sub">חומר פתוח למבחן · ד״ר אורן נחום · 13.8.26<br><b>מבחן אמריקאי · 20 שאלות — 5 נושאים × 4 שאלות · ללא חישובים</b> — חומר פתוח <b>מודפס בלבד (אין מחשבים)</b></div>';
var toc=E('div',{'class':'toc'});
DATA.sections.forEach(function(s){
  var a=E('a',{href:'#'},'<span class="sw" style="background:'+s.color+'"></span>'+
    '<span class="nm">'+s.name+'</span><span class="dots"></span>'+
    '<span class="pn">'+first[s.name]+'</span>');
  toc.appendChild(a);
});
cover.querySelector('.cover').appendChild(toc);
cover.querySelector('.cover').appendChild(E('div',{'class':'tip'},
  '<b>איך מנווטים כאן מהר</b>'+rt(
  '__שני הפרקים הראשונים הם מה שתפתחו בו הכי הרבה__ — **הכרעה מהירה** (השאלה מתארת X ← זו הבעיה) '+
  'ו**מספרים ונוסחאות**. שאר הפרקים לפי יחידה, ובסוף **נספח · מבחן קודם**. '+
  'הלשוניות בשוליים השמאליים יורדות מדרגה-מדרגה לפי סדר הפרקים — בערימת דפים '+
  'רואים אותן מהצד ומדפדפים ישר לפרק, בלי לקרוא כותרות. '+
  'בסוף החוברת **מפתח מונחים לפי א״ב** עם מספרי עמודים. '+
  '⟨מספרים⟩ מודגשים בכחול · __הדגשה צהובה__ = נקודה שהמרצה חזר עליה · '+
  '«מירכאות אלכסוניות» = ציטוט מהכיתה.')));
out.insertBefore(cover,out.firstChild);
cover.appendChild(E('div',{'class':'pgn'},'עמ׳ <b>1</b>'));

/* מפתח — נבנה מהמונחים שבעמודים, כך שמספרי העמודים תמיד נכונים.
   בשאלת מבחן לא כתוב הנושא אלא המונח, ולכן המפתח נבנה מכל מקום שבו
   מונח מופיע: כותרות הפריטים, העמודה הראשונה בטבלאות (שם יושב מילון
   ראשי התיבות), ומונחים מודגשים בתוך גוף הטקסט. */
var terms={};
/* שברי משפט שנקלעו למפתח מהדגשה באמצע משפט, לא מונחים */
var IXSTOP={'או':1,'אינו':1,'ואז':1,'למה':1,'הכשל':1,'הסף':1,'מה':1,'כך':1,
  'barriers and light':1,'providing confidence':1,'fulfilling':1,
  'protective standard procedures and devices':1,'Assurance':1,'Control':1,
  'Actual':1,'Between Failures':1,'To Repair':1};
function addTerm(k,pg){
  k=String(k).replace(/^[▪\s]+/,'').replace(/[\s—:,.;·]+$/,'').trim();
  if(k.length<2||k.length>44)return;
  if(!/[A-Za-z֐-׿]/.test(k))return;      /* מספרים/סימנים בלבד */
  if(/^[⟨(]/.test(k))return;
  if(IXSTOP[k])return;
  (terms[k]=terms[k]||[]).push(pg);
}
pages.forEach(function(p,i){
  var pg=i+2;
  p.querySelectorAll('dt').forEach(function(d){
    var t=d.textContent.replace(/^▪\s*/,'').replace(/\s*—\s*$/,'').trim();
    var al=d.getAttribute('data-idx');
    /* יש כינויים — הם מחליפים את הכותרת במפתח ולא מתווספים אליה. הכותרת
       שקיבלה כינוי היא בדיוק זו שאי אפשר לחפש לפיה ("מהו", "מה נכלל"),
       ואם תישאר היא רק תרעיש. מה שכן שווה לשמר נכתב בתוך הכינויים. */
    (al?al.split('·'):[t]).forEach(function(k){addTerm(k,pg);});
  });
  /* מילון ראשי התיבות הוא טבלה ולא רשימת פריטים, ולכן ⟨148⟩ מונחים —
     SLA, KPI, NPV, BIM — לא נכנסו למפתח כלל עד עכשיו. */
  p.querySelectorAll('td.k').forEach(function(c){addTerm(c.textContent,pg);});
  /* מונחים משניים: מודגשים בתוך גוף הפריט, לא ככותרת. */
  p.querySelectorAll('dd b, td b, .warn b').forEach(function(b){
    var t=b.textContent.trim();
    if(/\s/.test(t)&&t.split(/\s+/).length>5)return;   /* משפט, לא מונח */
    addTerm(t,pg);
  });
});
/* השיוך והמיון לפי האות הראשונה **שיש בה ממש** — לא לפי התו הראשון.
   מונח שנפתח במירכאות («קהל שבוי») או בספרה (⟨140⟩ אלף ₪) נכשל בבדיקת
   התו הראשון ונפל לבלוק הלועזי; ⟨52⟩ מונחים עבריים ישבו שם. מאותה סיבה
   גם המיון מדלג על מה שלפני האות, כדי ש«קהל שבוי» יישב תחת ק׳. */
function firstLetter(k){var m=String(k).match(/[A-Za-z֐-׿]/);return m?m[0]:'';}
function isEng(k){return /[A-Za-z]/.test(firstLetter(k));}
function sortBase(k){return String(k).replace(/^[^A-Za-z֐-׿]+/,'').toLowerCase();}
function sortKeys(a,b,loc){return sortBase(a).localeCompare(sortBase(b),loc);}
var hebKeys=Object.keys(terms).filter(function(k){return !isEng(k);})
              .sort(function(a,b){return sortKeys(a,b,'he');});
var engKeys=Object.keys(terms).filter(isEng)
              .sort(function(a,b){return sortKeys(a,b,'en');});

var ixSec={name:'מפתח',color:'#3d4650',sub:'עברית א״ב · לועזית A-Z',idx:DATA.sections.length-1};
/* המפתח מתפרס על פני כמה עמודים בדיוק כמו התוכן — אחרת הוא גולש. */
var ixFirst=pages.length+2;          /* לשורת התוכן שתתווסף בהמשך */
var ibd=newPage(ixSec,false), ipg=ibd.parentNode, idx=E('div',{'class':'idx'});
ibd.appendChild(idx);
function idxAppend(node){
  idx.appendChild(node);
  if(!fits(ipg)){
    idx.removeChild(node);
    ibd=newPage(ixSec,true); ipg=ibd.parentNode;
    idx=E('div',{'class':'idx'}); ibd.appendChild(idx); idx.appendChild(node);
  }
}
function emitKeys(list,ltr){
  list.forEach(function(k){
    var u=terms[k].filter(function(v,i,a){return a.indexOf(v)===i;})
                  .sort(function(x,y){return x-y;});
    idxAppend(E('div',ltr?{'class':'ltr'}:{},
      '<span class="t">'+k+'</span> <span class="p">'+u.join(', ')+'</span>'));
  });
}
emitKeys(hebKeys,false);
idxAppend(E('div',{'class':'ixhd'},'מונחים לועזיים · A-Z'));
emitKeys(engKeys,true);
pages.forEach(function(p,i){var e=p.querySelector('.pgn');if(e)e.innerHTML='עמ׳ <b>'+(i+2)+'</b>';});

/* המפתח נבנה אחרי שהשער כבר נוצר, ולכן שורתו מתווספת לתוכן העניינים רק כאן */
toc.appendChild(E('a',{href:'#'},
  '<span class="sw" style="background:'+ixSec.color+'"></span>'+
  '<span class="nm">מפתח מונחים לפי א״ב</span><span class="dots"></span>'+
  '<span class="pn">'+ixFirst+'</span>'));

/* הקישור חזרה מצביע ל-index.html שלצד הקובץ הזה — נכון גם ברפו וגם
   בתיקיית הקורס, ולכן אין צורך להתאים אותו לפי שם הקובץ. */

/* ---- בקרת גלישה ---- */
var over=0;
document.querySelectorAll('.pg').forEach(function(p){
  if(p.scrollHeight>p.clientHeight+1){p.classList.add('over');over++;}
});
document.getElementById('stat').textContent=
  document.querySelectorAll('.pg').length+' עמודים'+(over?' · '+over+' בגלישה':' · תקין');

/* ---- הדפסת עמודים נבחרים ----
   exam.html?only=11,12,34,38-43 — מציג רק את העמודים האלה, כדי להחליף
   דפים בחוברת שכבר הודפסה במקום להדפיס הכל מחדש. רץ אחרי שהדפדוף
   והמספור הסתיימו, ולכן אינו משפיע על חלוקת העמודים. */
(function(){
  var m=/[?&]only=([^&]+)/.exec(location.search); if(!m)return;
  var want={},list=[];
  decodeURIComponent(m[1]).split(',').forEach(function(part){
    var r=part.split('-'),a=+r[0],b=r.length>1?+r[1]:a;
    for(var i=a;i<=b;i++){if(!want[i]){want[i]=1;list.push(i);}}
  });
  var kept=0;
  document.querySelectorAll('.pg').forEach(function(p){
    var e=p.querySelector('.pgn b');
    if(e&&want[+e.textContent])kept++; else p.style.display='none';
  });
  document.getElementById('stat').textContent=
    'מודפסים '+kept+' עמודים נבחרים: '+list.sort(function(x,y){return x-y;}).join(', ');
})();

</script>
